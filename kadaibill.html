// ---------- billing screen ----------
function PosScreen({ go }) {
  useApp();
  const cart = App.cart;
  const [, setV] = useState(0);
  const [q, setQ] = useState('');
  const [cat, setCat] = useState('');
  const [counts, setCounts] = useState({ hold: 0, estimate: 0 });
  const searchRef = useRef();
  const draftTimer = useRef();
  const parents = useMemo(() => Data.parentIds(), [App.version, App.items.length]);
  const lang = App.lang;

  const refresh = (saveDraft = true) => {
    Billing.compute(cart, App.offers, { roundOff: App.s('round_off', '1') === '1' });
    setV((v) => v + 1);
    if (saveDraft) {
      clearTimeout(draftTimer.current);
      draftTimer.current = setTimeout(() => Held.saveDraft(cart).catch(() => {}), 900);
    }
  };
  const loadCounts = async () => setCounts({ hold: await Held.count('hold'), estimate: await Held.count('estimate') });
  useEffect(() => {
    (async () => {
      if (!cart.lines.length && !App._draftChecked) {
        App._draftChecked = true;
        const d = await Held.loadDraft();
        if (d && d.lines.length) { Object.assign(cart, d); toast(tr('Unfinished bill restored')); }
      }
      refresh(false);
      loadCounts();
    })();
    searchRef.current?.focus();
    return () => clearTimeout(draftTimer.current);
  }, []);

  const results = useMemo(() => {
    const s = q.trim().toLowerCase();
    if (!s) return [];
    const exact = [], starts = [], contains = [];
    for (const it of App.items) {
      if (!it.active) continue;
      const code = it.code.toLowerCase(), name = it.name.toLowerCase();
      if (code === s) exact.push(it);
      else if (name.startsWith(s) || code.startsWith(s)) starts.push(it);
      else if (name.includes(s) || toS(it.name_ta).includes(q.trim()) || toS(it.category).toLowerCase().includes(s)) contains.push(it);
      if (exact.length + starts.length + contains.length > 60) break;
    }
    return [...exact, ...starts, ...contains].slice(0, 40);
  }, [q, App.version]);

  const focusSearch = () => setTimeout(() => searchRef.current?.focus(), 30);

  const pickVariant = async (parent) => {
    const vs = Inventory.variants(parent.id);
    if (!vs.length) return parent;
    return openModal((close) => html`<${Modal} title=${itemName(parent, lang)} onClose=${close}>
      <div class="quick-grid">${vs.map((v) => html`<button class="tile" onClick=${() => close(v)}><span class="nm">${variantLabel(v)}</span>
        <span class="pr">${money(itemPrice(v, cart.priceList))}</span><span class="muted small">${tr('Stock')} ${qtyFmt(v.stock)}</span></button>`)}</div></${Modal}>`);
  };

  const addItem = async (it, qty = 1, askQty = true) => {
    let item = it;
    if (parents.has(item.id)) { item = await pickVariant(item); if (!item) return focusSearch(); }
    let qn = qty;
    if (isLoose(item) && askQty) {
      const w = await ask.number(`${tr('Quantity')} (${item.unit}) - ${itemName(item, lang)}`, { hint: item.unit === 'kg' ? '0.250' : '1' });
      if (!w || w <= 0) return focusSearch();
      qn = w;
    }
    let existing = !isLoose(item) && askQty ? cart.lines.find((l) => l.item.id === item.id) : null;
    if (existing) { existing.qty += qn; cart.lines = [existing, ...cart.lines.filter((l) => l !== existing)]; }
    else cart.lines.unshift(newLine(item, qn, itemPrice(item, cart.priceList)));
    const inCart = sum(cart.lines.filter((l) => l.item.id === item.id), (l) => l.qty);
    if (inCart > toD(item.stock)) toast(`${tr('Low stock')}: ${itemName(item, lang)} (${qtyFmt(item.stock)})`);
    setQ('');
    refresh();
    focusSearch();
  };

  const tryScale = async (code) => {
    if (App.s('scale_enabled', '0') !== '1') return false;
    const b = ScaleBarcode.parse(code, App.s('scale_prefix', '21'));
    if (!b) return false;
    const it = App.items.find((i) => i.active && ScaleBarcode.matches(b.itemCode, i.code));
    if (!it) return false;
    let qn;
    if (App.s('scale_mode', 'weight') === 'price') {
      const p = itemPrice(it, cart.priceList);
      if (p <= 0) return false;
      qn = Math.round((b.value / 100) / p * 1000) / 1000;
    } else qn = b.value / 1000;
    if (qn <= 0) return false;
    await addItem(it, qn, false);
    return true;
  };
  const submit = async () => {
    const s = q.trim();
    if (!s) return;
    if (await tryScale(s)) return;
    const match = App.items.find((i) => i.active && i.code.toLowerCase() === s.toLowerCase()) || (results.length === 1 ? results[0] : null);
    if (match) await addItem(match);
    else if (!results.length) { toast(`${tr('No item found for')} "${s}"`, true); searchRef.current?.select(); }
  };
  const scanned = async (code) => {
    if (await tryScale(code)) return;
    const it = App.items.find((i) => i.active && i.code === code);
    if (it) await addItem(it); else toast(`${tr('No item found for')} "${code}"`, true);
  };

  const removeLine = async (l) => {
    if (App.s('approve_line_delete', '0') === '1' && !(await approve('Remove item from bill'))) return;
    cart.lines = cart.lines.filter((x) => x !== l);
    audit('line_remove', `${l.item.code} ${qtyFmt(l.qty)} x ${amt(l.unitPrice)}`).catch(() => {});
    refresh();
  };
  const changeQty = (l, d) => { const n = l.qty + d; if (n <= 0) removeLine(l); else { l.qty = n; refresh(); } };
  const withinLimit = (disc, gross) => App.isManager || gross <= 0 || disc / gross * 100 <= App.d('cashier_max_disc_pct', 5) + 0.001;

  const editLine = async (l) => {
    const r = await openModal((close) => html`<${LineEdit} l=${l} close=${close} />`);
    if (!r) return focusSearch();
    if (r === 'remove') return removeLine(l);
    const gross = r.qty * r.price;
    const d = r.pct ? gross * r.disc / 100 : r.disc;
    if (!withinLimit(d, gross) && !(await approve('Discount above limit'))) return;
    if (r.qty <= 0) return removeLine(l);
    if (r.price !== l.unitPrice) audit('price_change', `${l.item.code} ${amt(l.unitPrice)} -> ${amt(r.price)}`).catch(() => {});
    l.qty = r.qty; l.unitPrice = r.price; l.manualDiscount = r2(d);
    refresh();
    focusSearch();
  };
  const setPriceList = (pl) => { cart.priceList = pl; for (const l of cart.lines) l.unitPrice = itemPrice(l.item, pl); refresh(); };
  const chooseCustomer = async () => {
    const c = await pickCustomer();
    if (c) { cart.customer = c; if (c.price_list && c.price_list !== cart.priceList) setPriceList(c.price_list); else refresh(); }
    focusSearch();
  };
  const billDiscount = async () => {
    if (!cart.lines.length) return;
    const r = await openModal((close) => html`<${DiscountModal} close=${close} />`);
    if (!r) return;
    const base = sum(cart.lines, lineNet);
    const d = r.pct ? base * r.v / 100 : r.v;
    if (!withinLimit(d + cart.lineDiscounts, cart.subtotal) && !(await approve('Discount above limit'))) return;
    cart.billDiscount = r2(Math.max(0, Math.min(d, base)));
    refresh();
  };
  const applyCoupon = async () => {
    if (!cart.lines.length) return;
    const code = await ask.text(tr('Coupon code'));
    if (!code) return;
    const c = await Sales.findCoupon(code, 'coupon');
    if (!c || c.used || couponExpired(c)) { toast(tr('Coupon not valid'), true); return; }
    if (sum(cart.lines, lineNet) < toD(c.min_bill)) { toast(`${tr('Minimum bill for this coupon')}: ${money(c.min_bill)}`, true); return; }
    cart.coupon = c;
    refresh();
  };
  const hold = async () => {
    if (!cart.lines.length) return;
    await Held.save(cart, 'hold');
    Object.assign(cart, newCart());
    refresh();
    loadCounts();
    toast(tr('Bill put on hold'));
    focusSearch();
  };
  const recall = async () => {
    const held = await Held.list('hold'), est = await Held.list('estimate');
    if (!held.length && !est.length) { toast(tr('No bills on hold')); return; }
    const picked = await openModal((close) => html`<${Modal} title=${tr('Held bills and estimates')} onClose=${close}>
      ${held.length > 0 && html`<h3>${tr('Bills on hold')}</h3><div class="list">${held.map((h) => html`<div class="li" onClick=${() => close(h)}>
        <${Icon} n="pause" /><div class="grow"><div class="title">${h.name || `${tr('Bill')} #${h.id}`}</div><div class="sub">${dateTimeFmt(h.created_at)}</div></div><b class="num">${money(h.total)}</b></div>`)}</div>`}
      ${est.length > 0 && html`<h3>${tr('Estimates / quotations')}</h3><div class="list">${est.map((h) => html`<div class="li" onClick=${() => close(h)}>
        <${Icon} n="ticket" /><div class="grow"><div class="title">EST-${h.id}${h.name ? ' • ' + h.name : ''}</div><div class="sub">${dateTimeFmt(h.created_at)}</div></div><b class="num">${money(h.total)}</b>
        <button class="btn-ghost icon-btn" aria-label=${tr('Delete')} onClick=${async (e) => { e.stopPropagation(); await Held.remove(h.id); close('reload'); }}><${Icon} n="trash" /></button></div>`)}</div>`}
    </${Modal}>`);
    if (picked === 'reload') { loadCounts(); return recall(); }
    if (!picked) return;
    const loaded = await Held.load(picked.id);
    if (!loaded) return;
    if (cart.lines.length) await Held.save(cart, 'hold');
    if (picked.kind === 'hold') await Held.remove(picked.id);
    Object.assign(cart, loaded);
    refresh();
    loadCounts();
  };
  const clearBill = async () => {
    if (!cart.lines.length) return;
    if (!(await ask.confirm(tr('Clear bill?'), tr('All items in this bill will be removed.'), 'Clear'))) return;
    if (App.s('approve_bill_clear', '1') === '1' && !(await approve('Clear bill'))) return;
    audit('bill_clear', `${cart.lines.length} items ${amt(cart.total)}`).catch(() => {});
    if (cart.exchangeCode) toast(`${tr('Exchange credit kept as store credit')}: ${cart.exchangeCode} (${money(cart.exchangeValue)})`);
    Object.assign(cart, newCart());
    refresh();
  };
  const saveEstimate = async () => {
    if (!cart.lines.length) return;
    const name = await ask.text(tr('Save as estimate / quotation'), { initial: cart.customer?.name || '', hint: tr('Customer or reference') });
    if (name == null) return;
    refresh(false);
    const id = await Held.save(cart, 'estimate', name.trim());
    const { sale, lines } = Held.preview(cart, `EST-${id}`);
    loadCounts();
    await showDocument(sale, lines, []);
    if (await ask.confirm(tr('Clear the counter?'), tr('The estimate is saved. You can load it again from Recall.'), 'Clear')) { Object.assign(cart, newCart()); refresh(); }
  };
  const exchange = async () => {
    if (cart.exchangeCode) { toast(tr('This bill already has an exchange'), true); return; }
    const saleId = await pickBill();
    if (!saleId) return;
    const r = await runReturnFlow(saleId, true);
    if (!r) return;
    cart.exchangeCode = r.voucherCode;
    cart.exchangeValue = r.voucherValue;
    if (!cart.customer) {
      const s = await Sales.sale(saleId);
      if (s.customer_id != null) cart.customer = Data.customer(s.customer_id);
    }
    refresh();
    toast(`${tr('Exchange credit')} ${money(r.voucherValue)} • ${tr('now add the new items')}`);
    focusSearch();
  };
  const more = async () => {
    const v = await ask.choose(tr('More'), [
      { value: 'exchange', label: tr('Exchange (return + new items)'), icon: 'swap', sub: 'F7' },
      { value: 'estimate', label: tr('Save as estimate / quotation'), icon: 'ticket', sub: 'F10' },
      { value: 'voucher', label: tr('Sell gift voucher'), icon: 'gift' },
      { value: 'camera', label: tr('Scan with camera'), icon: 'camera' },
    ]);
    if (v === 'exchange') exchange();
    if (v === 'estimate') saveEstimate();
    if (v === 'voucher') sellGiftVoucher();
    if (v === 'camera') scanBarcode(scanned).then(focusSearch);
  };
  const pay = async () => {
    if (!cart.lines.length) return;
    if (App.requireShift && App.shiftId == null) { toast(tr('Open a shift before billing'), true); return; }
    refresh(false);
    const res = await showPayment(cart);
    if (!res) return focusSearch();
    try {
      const r = await Sales.saveSale(cart, res.tenders);
      Object.assign(cart, newCart());
      clearTimeout(draftTimer.current);
      Held.saveDraft(cart).catch(() => {});
      refresh(false);
      App.touch();
      await showReceipt(r.saleId, { autoPrint: App.s('auto_print', '0') === '1' });
    } catch (e) { toast(`${tr('Could not save bill')}: ${e.message}`, true); }
    focusSearch();
  };

  useEffect(() => {
    const keys = { F2: focusSearch, F3: chooseCustomer, F4: hold, F6: recall, F7: exchange, F8: billDiscount, F9: applyCoupon, F10: saveEstimate, F12: pay };
    const onKey = (e) => {
      if (Modals.stack.length) return;
      if (keys[e.key]) { e.preventDefault(); keys[e.key](); }
      if (e.key === 'Escape') { setQ(''); focusSearch(); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  });

  if (App.requireShift && App.shiftId == null) {
    return html`<div class="center-page"><div class="card auth-card stack" style="text-align:center;align-items:center">
      <${Icon} n="lock" s=${40} /><h2>${tr('Open shift')}</h2><p class="muted">${tr('Open a shift with your opening cash to start billing.')}</p>
      <button class="btn-primary" onClick=${() => go('shift')}>${tr('Open shift')}</button></div></div>`;
  }

  const base = App.items.filter((i) => i.active && i.parent_id == null);
  let quick = cat ? base.filter((i) => i.category === cat) : base.filter((i) => i.favourite);
  if (!cat && !quick.length) quick = base.slice(0, 60);
  const salespeople = App.s('salespeople').split(',').map((x) => x.trim()).filter(Boolean);
  const offers = cart.offerDiscounts + cart.slabDiscount;
  const sr = (a, v, neg) => html`<div class="sum-row"><span>${a}</span><span>${neg ? '- ' : ''}${money(v)}</span></div>`;

  return html`<div class="pos">
    <div class="pos-left">
      <div class="pos-search">
        <input ref=${searchRef} id="pos-search" value=${q} placeholder=${tr('Scan barcode or type item name (F2)')} autocomplete="off"
          onInput=${(e) => setQ(e.target.value)} onKeyDown=${(e) => { if (e.key === 'Enter') { e.preventDefault(); submit(); } }} />
        <button class="icon-btn" aria-label=${tr('Scan with camera')} title=${tr('Scan with camera')} onClick=${() => scanBarcode(scanned).then(focusSearch)}><${Icon} n="camera" /></button>
      </div>
      ${q.trim() ? html`<div class="quick results"><div class="list">${results.map((it) => html`<div class="li" onClick=${() => addItem(it)}>
          <div class="grow"><div class="title">${itemName(it, lang)}</div><div class="sub">${[it.code, variantLabel(it), parents.has(it.id) ? tr('has variants') : `${tr('Stock')} ${qtyFmt(it.stock)} ${it.unit}`].filter(Boolean).join(' • ')}</div></div>
          <b class="num">${money(itemPrice(it, cart.priceList))}</b></div>`)}
          ${!results.length && html`<div class="empty">${tr('No matching items')}</div>`}</div></div>`
        : html`<div class="quick">
          <div class="chips" style="margin-bottom:10px"><button class=${'chip' + (!cat ? ' on' : '')} onClick=${() => setCat('')}>${tr('Favourites')}</button>
            ${Data.categories().map((c) => html`<button class=${'chip' + (cat === c ? ' on' : '')} onClick=${() => setCat(c)}>${c}</button>`)}</div>
          ${quick.length ? html`<div class="quick-grid">${quick.map((it) => {
            const low = toD(it.reorder_level) > 0 && toD(it.stock) <= toD(it.reorder_level);
            return html`<button class="tile" onClick=${() => addItem(it)}><span class="nm">${itemName(it, lang)}</span>
              <span class="row between"><span class="pr">${money(itemPrice(it, cart.priceList))}</span>${low && html`<span class="pill bad">${tr('Low')}</span>`}</span></button>`;
          })}</div>` : html`<${Empty} icon="items" text=${tr('No items yet. Add items in the Items screen.')} />`}
        </div>`}
    </div>
    <div class="pos-right">
      <div class="bill-head">
        <button class="chip" onClick=${chooseCustomer}><${Icon} n="user" s=${16} />${cart.customer ? `${cart.customer.name} • ${cart.customer.phone}` : tr('Add customer (F3)')}</button>
        ${cart.customer && html`<button class="btn-ghost icon-btn" aria-label=${tr('Remove customer')} onClick=${() => { cart.customer = null; refresh(); }}><${Icon} n="x" s=${16} /></button>`}
        <select value=${cart.priceList} onChange=${(e) => setPriceList(e.target.value)} aria-label=${tr('Price list')}>
          <option value="retail">${tr('Retail price')}</option><option value="wholesale">${tr('Wholesale price')}</option><option value="member">${tr('Member price')}</option></select>
        <button class=${'chip' + (cart.interstate ? ' on' : '')} title=${tr('Inter-state sale')} onClick=${() => { cart.interstate = !cart.interstate; refresh(); }}>IGST</button>
        ${salespeople.length > 0 && html`<select value=${cart.salesperson} onChange=${(e) => { cart.salesperson = e.target.value; refresh(); }} aria-label=${tr('Salesperson')}>
          <option value="">${tr('Salesperson')}</option>${salespeople.map((p) => html`<option value=${p}>${p}</option>`)}</select>`}
        ${cart.exchangeCode && html`<span class="pill accent">${tr('Exchange credit')} ${money(cart.exchangeValue)}</span>`}
        ${counts.hold + counts.estimate > 0 && html`<button class="chip" onClick=${recall}><${Icon} n="pause" s=${14} />${tr('On hold')}: ${counts.hold}${counts.estimate ? ` • ${tr('Estimates')}: ${counts.estimate}` : ''}</button>`}
      </div>
      <div class="cart">
        ${!cart.lines.length ? html`<${Empty} icon="pos" text=${tr('Scan or search to add items')} />` : cart.lines.map((l) => {
          const disc = l.manualDiscount + l.offerDiscount;
          return html`<div class="cart-line">
            <div class="grow" onClick=${() => editLine(l)}>
              <div class="nm">${itemName(l.item, lang)}</div>
              <div class="meta">${[`${money(l.unitPrice)} / ${l.item.unit}`, variantLabel(l.item), toD(l.item.gst_rate) > 0 ? `GST ${qtyFmt(l.item.gst_rate)}%` : ''].filter(Boolean).join(' • ')}</div>
              ${disc > 0 && html`<div class="off">${l.offerName || tr('Discount')} -${money(disc)}</div>`}
            </div>
            <div class="qty">${!isLoose(l.item) && html`<button aria-label=${tr('Less')} onClick=${() => changeQty(l, -1)}><${Icon} n="minus" s=${14} /></button>`}
              <b onClick=${() => editLine(l)}>${qtyFmt(l.qty)}</b>
              ${!isLoose(l.item) && html`<button aria-label=${tr('More')} onClick=${() => changeQty(l, 1)}><${Icon} n="plus" s=${14} /></button>`}</div>
            <div class="amt">${money(lineNet(l))}</div>
          </div>`;
        })}
      </div>
      <div class="summary">
        ${cart.lines.length > 0 && html`
          ${sr(`${tr('Items')}: ${cart.lines.length} • ${tr('Qty')}: ${qtyFmt(sum(cart.lines, (l) => l.qty))}`, cart.subtotal)}
          ${cart.lineDiscounts > 0 && sr(tr('Item discounts'), cart.lineDiscounts, true)}
          ${offers > 0 && sr(cart.slabName ? `${tr('Offers')} (${cart.slabName})` : tr('Offers'), offers, true)}
          ${cart.billDiscount > 0 && sr(tr('Bill discount'), cart.billDiscount, true)}
          ${cart.couponDiscount > 0 && sr(`${tr('Coupon')} ${cart.coupon?.code || ''}`, cart.couponDiscount, true)}
          ${sr(cart.interstate ? 'IGST' : 'CGST + SGST', cart.tax)}
          ${Math.abs(cart.roundOff) > 0.004 && sr(tr('Round off'), cart.roundOff)}
          ${cart.exchangeValue > 0 && sr(tr('Less: exchange credit'), Math.min(cart.exchangeValue, cart.total), true)}`}
        <div class="grand"><span class="label">${tr('TOTAL')}</span><b>${money(cart.total)}</b></div>
        <div class="bill-actions">
          <button onClick=${hold}><${Icon} n="pause" />${tr('Hold')}</button>
          <button onClick=${recall}><${Icon} n="restore" />${tr('Recall')}</button>
          <button onClick=${billDiscount}><${Icon} n="percent" />${tr('Discount')}</button>
          <button onClick=${applyCoupon}><${Icon} n="ticket" />${tr('Coupon')}</button>
          <button onClick=${clearBill}><${Icon} n="trash" />${tr('Clear')}</button>
          <button onClick=${more}><${Icon} n="more" />${tr('More')}</button>
        </div>
        <button class="btn-primary btn-big" style="width:100%" disabled=${!cart.lines.length} onClick=${pay}><${Icon} n="cash" />${tr('PAY')} (F12) ${money(cart.total)}</button>
      </div>
    </div>
  </div>`;
}

function LineEdit({ l, close }) {
  const [qty, setQty] = useState(l.qty);
  const [price, setPrice] = useState(l.unitPrice);
  const [disc, setDisc] = useState(l.manualDiscount);
  const [pct, setPct] = useState(false);
  const canPrice = App.isManager || App.s('allow_price_edit', '0') === '1';
  return html`<${Modal} title=${itemName(l.item, App.lang)} size="narrow" onClose=${close}
    foot=${html`<button class="btn-danger" onClick=${() => close('remove')}><${Icon} n="trash" />${tr('Remove')}</button><span class="grow"></span>
      <button onClick=${() => close(null)}>${tr('Cancel')}</button><button class="btn-primary" onClick=${() => close({ qty, price, disc, pct })}>${tr('Save')}</button>`}>
    <${Field} label=${`${tr('Quantity')} (${l.item.unit})`}><${Num} value=${qty} onChange=${setQty} autofocus /></${Field}>
    <${Field} label=${tr('Rate')} hint=${canPrice ? '' : tr('Only a manager can change the rate')}>${canPrice ? html`<${Num} value=${price} onChange=${setPrice} />` : html`<input value=${amt(price)} disabled />`}</${Field}>
    <div class="row nowrap"><label class="field grow"><span>${tr('Discount')}</span><${Num} value=${disc} onChange=${setDisc} /></label>
      <div style="padding-top:20px"><${Seg} value=${pct} options=${[[false, '₹'], [true, '%']]} onChange=${setPct} /></div></div>
    ${l.offerName && html`<div class="pill good">${tr('Offer applied')}: ${l.offerName} (-${money(l.offerDiscount)})</div>`}
  </${Modal}>`;
}
function DiscountModal({ close }) {
  const [v, setV] = useState(0);
  const [pct, setPct] = useState(false);
  return html`<${Modal} title=${tr('Bill discount')} size="narrow" onClose=${close}
    foot=${html`<button onClick=${() => close(null)}>${tr('Cancel')}</button><button class="btn-primary" onClick=${() => close({ v, pct })}>${tr('Apply')}</button>`}>
    <div class="row nowrap"><label class="field grow"><span>${tr('Discount')}</span><${Num} value=${v} onChange=${setV} autofocus /></label>
      <div style="padding-top:20px"><${Seg} value=${pct} options=${[[false, '₹'], [true, '%']]} onChange=${setPct} /></div></div></${Modal}>`;
}

// ---------- returns & bills ----------
function ReturnsScreen() {
  useApp();
  const [q, setQ] = useState('');
  const [bills, reload] = useLoad(() => Sales.recentBills(q, 200), [q, App.version]);
  const open = async (b) => {
    const opts = [{ value: 'view', label: tr('View / reprint'), icon: 'print' }];
    if (b.kind === 'sale' && b.status === 'completed') {
      opts.push({ value: 'return', label: tr('Return items (credit note)'), icon: 'return' });
      opts.push({ value: 'cancel', label: tr('Cancel this bill'), icon: 'x' });
    }
    const v = await ask.choose(`${b.bill_no} • ${money(b.total)}`, opts);
    if (v === 'view') await showReceipt(b.id);
    if (v === 'return') {
      const r = await runReturnFlow(b.id);
      if (r) {
        if (r.voucherCode) toast(`${tr('Store credit created')}: ${r.voucherCode} (${money(r.voucherValue)})`);
        await showReceipt(r.saleId);
      }
    }
    if (v === 'cancel') {
      const reason = await ask.text(`${tr('Cancel bill')} ${b.bill_no}`, { hint: tr('Reason') });
      if (!reason?.trim()) return;
      const ap = await approve('Cancel bill');
      if (!ap) return;
      await Sales.cancelBill(b.id, reason.trim(), ap.id);
      App.touch();
      toast(tr('Bill cancelled. Stock restored.'));
    }
    reload();
  };
  return html`<div class="stack">
    <input placeholder=${tr('Search bill number, customer name or phone')} value=${q} onInput=${(e) => setQ(e.target.value)} />
    ${bills && (bills.length ? html`<div class="list">${bills.map((b) => {
      const tone = b.status === 'void' ? 'bad' : b.kind === 'return' ? 'gold' : b.kind === 'voucher' ? 'accent' : '';
      const label = b.status === 'void' ? tr('Cancelled') : b.kind === 'return' ? tr('Credit note') : b.kind === 'voucher' ? tr('Gift voucher sale') : '';
      return html`<div class="li" onClick=${() => open(b)}>
        <div class="avatar"><${Icon} n=${b.kind === 'return' ? 'return' : b.kind === 'voucher' ? 'gift' : 'pos'} /></div>
        <div class="grow"><div class="title mono">${b.bill_no}</div><div class="sub">${dateTimeFmt(b.date)}${b.customer_name ? ' • ' + b.customer_name : ''}</div></div>
        ${label && html`<span class=${'pill ' + tone}>${label}</span>`}
        <b class="num" style=${b.status === 'void' ? 'text-decoration:line-through' : ''}>${b.kind === 'return' ? '- ' : ''}${money(b.total)}</b></div>`;
    })}</div>` : html`<${Empty} icon="pos" text=${tr('No bills yet')} />`)}
  </div>`;
}

// ---------- shift ----------
const DENOMS = [500, 200, 100, 50, 20, 10, 5, 2, 1];
function ShiftScreen() {
  useApp();
  const [opening, setOpening] = useState(0);
  const [den, setDen] = useState({});
  const [sm, reload] = useLoad(() => (App.shiftId ? Shifts.summary(App.shiftId) : null), [App.shiftId, App.version]);
  const counted = DENOMS.reduce((s, d) => s + d * (parseInt(den[d], 10) || 0), 0);
  const open = async () => { await Shifts.open(opening); App.touch(); toast(tr('Shift opened. You can start billing.')); };
  const move = async (type) => {
    const a = await ask.number(type === 'in' ? tr('Cash in (pay-in)') : tr('Cash out (expense / pay-out)'));
    if (!a || a <= 0) return;
    const note = (await ask.text(tr('Note'), { hint: type === 'in' ? tr('e.g. change added') : tr('e.g. tea, courier, petty expense') })) || '';
    if (type === 'out' && a > App.d('cashier_max_payout', 500) && !App.isManager && !(await approve('Large cash pay-out'))) return;
    await Shifts.cashMove(type, a, note);
    reload();
  };
  const close = async () => {
    const diff = counted - sm.expected;
    if (!(await ask.confirm(tr('Close shift?'), `${tr('Expected cash')}: ${money(sm.expected)}\n${tr('Counted cash')}: ${money(counted)}\n${tr('Difference')}: ${money(diff)}`, 'Close shift'))) return;
    await Shifts.close(App.shiftId, counted, den);
    setDen({});
    App.touch();
    toast(tr('Shift closed.'));
    const phone = App.s('owner_phone');
    if (phone && (await ask.confirm(tr('Send day summary?'), tr("Send today's summary to the owner on WhatsApp."), 'Send'))) {
      openWhatsApp(phone, `${await Reports.daySummaryText()}\nShift closed by ${App.user.name}: counted Rs. ${amt(counted)}, difference Rs. ${amt(diff)}`);
    }
  };
  if (!App.shiftId) {
    return html`<div class="center-page"><div class="card auth-card stack">
      <h2>${tr('Open shift')}</h2><p class="muted" style="margin:0">${tr('Count the cash in the drawer and enter it below.')}</p>
      <${Field} label=${tr('Opening cash')}><${Num} id="opening-cash" value=${opening} onChange=${setOpening} autofocus /></${Field}>
      <button class="btn-primary" onClick=${open}>${tr('Open shift')}</button></div></div>`;
  }
  if (!sm) return html`<div class="empty">${tr('Loading...')}</div>`;
  const modes = ['cash', 'upi', 'card', 'wallet', 'credit', 'points', 'voucher'];
  return html`<div class="stack">
    <div class="grid">
      <${Stat} label=${tr('Bills')} value=${sm.bills} icon="pos" />
      <${Stat} label=${tr('Sales')} value=${money(sm.sales)} icon="cash" />
      <${Stat} label=${tr('Returns')} value=${money(sm.returns)} icon="return" tone="gold" />
      <${Stat} label=${tr('Expected cash')} value=${money(sm.expected)} icon="expenses" />
    </div>
    <h2 class="section-title">${tr('Collections by payment mode')}</h2>
    <${Table} columns=${['Mode', 'Received', 'Refunded']} numeric=${new Set([1, 2])}

// ---------- staff users ----------
function UsersScreen() {
  useApp();
  const [members, reloadMembers] = useLoad(() => (App.store.kind === 'cloud' ? App.store.members() : []), []);
  const edit = async (u) => {
    const r = await openModal((close) => html`<${UserModal} u=${u} close=${close} />`);
    if (!r) return;
    if (!r.name.trim() || !/^\d{4,6}$/.test(r.pin)) { toast(tr('Enter a name and a 4-6 digit PIN'), true); return; }
    if (App.users.some((x) => x.pin === r.pin && x.id !== u?.id)) { toast(tr('Another user already has this PIN'), true); return; }
    if (u?.id === App.user.id && (r.role !== 'owner' || !r.active)) { toast(tr('You cannot remove your own owner access'), true); return; }
    await Users.save({ ...r, id: u?.id });
    App.touch();
  };
  const addMember = async () => {
    const email = await ask.text(tr('Email of the login to allow'), { hint: 'staff@example.com' });
    if (!email?.includes('@')) return;
    try { await App.store.rpc('kb_add_member', { p_email: email, p_role: 'staff' }); toast(tr('Login allowed')); reloadMembers(); } catch (e) { toast(e.message, true); }
  };
  const removeMember = async (m) => {
    if (!(await ask.confirm(tr('Remove this login?'), m.email, 'Remove'))) return;
    try { await App.store.rpc('kb_remove_member', { p_email: m.email }); reloadMembers(); } catch (e) { toast(e.message, true); }
  };
  const roleName = (r) => tr(r === 'owner' ? 'Owner' : r === 'manager' ? 'Manager' : 'Cashier');
  return html`<div class="stack">
    <div class="row between"><h2>${tr('Staff and PINs')}</h2><button class="btn-primary" onClick=${() => edit(null)}><${Icon} n="plus" />${tr('Add user')}</button></div>
    <div class="list">${App.users.map((u) => html`<div class="li" onClick=${() => edit(u)}><div class="avatar"><${Icon} n="user" /></div>
      <div class="grow"><div class="title">${u.name}</div><div class="sub">${roleName(u.role)}${u.active ? '' : ' • ' + tr('Inactive')}</div></div><${Icon} n="edit" /></div>`)}</div>
    ${App.store.kind === 'cloud' && html`
      <div class="row between section-title"><div><h2>${tr('Logins allowed for this shop')}</h2><p class="muted small" style="margin:2px 0 0">${tr('Devices sign in with one of these emails, then staff pick their name and PIN.')}</p></div>
        ${App.memberRole === 'owner' && html`<button onClick=${addMember}><${Icon} n="plus" />${tr('Allow a login')}</button>`}</div>
      <div class="list">${(members || []).map((m) => html`<div class="li" style="cursor:default"><div class="avatar"><${Icon} n="cloud" /></div>
        <div class="grow"><div class="title">${m.email}</div><div class="sub">${m.role === 'owner' ? tr('Owner') : tr('Staff')}</div></div>
        ${App.memberRole === 'owner' && m.role !== 'owner' && html`<button class="btn-sm" onClick=${() => removeMember(m)}>${tr('Remove')}</button>`}</div>`)}</div>`}
  </div>`;
}
function UserModal({ u, close }) {
  const [f, setF] = useState({ name: u?.name || '', pin: u?.pin || '', role: u?.role || 'cashier', active: u ? !!u.active : true });
  const help = { cashier: 'Billing, returns (with approval), shift, customers.', manager: 'Everything except users and shop settings. Approves discounts and returns.', owner: 'Full access.' };
  return html`<${Modal} title=${u ? tr('Edit user') : tr('Add user')} size="narrow" onClose=${close}
    foot=${html`<button onClick=${() => close(null)}>${tr('Cancel')}</button><button class="btn-primary" onClick=${() => close(f)}>${tr('Save')}</button>`}>
    <${Field} label=${tr('Name')}><input value=${f.name} autofocus onInput=${(e) => setF({ ...f, name: e.target.value })} /></${Field}>
    <${Field} label=${tr('PIN (4-6 digits)')}><input inputmode="numeric" value=${f.pin} onInput=${(e) => setF({ ...f, pin: e.target.value.replace(/\D/g, '') })} /></${Field}>
    <${Seg} value=${f.role} options=${[['cashier', tr('Cashier')], ['manager', tr('Manager')], ['owner', tr('Owner')]]} onChange=${(role) => setF({ ...f, role })} />

}

function ItemForm({ item, close }) {
  const isNew = !item;
  const [f, setF] = useState(() => item ? { ...item } : { ...kbFillRow('items', {}), id: null, code: Inventory.nextCode(), unit: 'pcs' });
  const [opening, setOpening] = useState(0);
  const [batch, setBatch] = useState({ no: '', expiry: '' });
  const [tab, setTab] = useState('details');
  const set = (k, v) => setF({ ...f, [k]: v });
  const txt = (k) => (e) => set(k, e.target.value);
  const flag = (k) => App.flag(k);
  const save = async () => {
    const it = { ...f, code: toS(f.code).trim(), name: toS(f.name).trim() };
    if (!it.code || !it.name) { toast(tr('Code and name are required'), true); return; }
    if (Inventory.codeExists(it.code, it.id)) { toast(tr('This code is already used by another item'), true); return; }
    if (toD(it.price_retail) <= 0 && toD(it.mrp) > 0) it.price_retail = toD(it.mrp);
    if (toD(it.price_retail) <= 0) { toast(tr('Enter a selling price'), true); return; }
    if (toD(it.mrp) > 0 && toD(it.price_retail) > toD(it.mrp)) { toast(tr('Selling price cannot be more than MRP'), true); return; }
    if (toD(it.pack_qty) < 1) it.pack_qty = 1;
    try {
      await Inventory.saveItem(it, { openingStock: isNew ? opening : 0, batchNo: batch.no, expiry: batch.expiry });
      toast(tr('Item saved'));
      close(true);
    } catch (e) { toast(e.message, true); }
  };
  const variants = async () => {
    const r = await openModal((c) => html`<${VariantModal} close=${c} />`);

    const split = (s) => s.split(',').map((x) => x.trim()).filter(Boolean);

  };

      <${Field} label=${tr('Code / barcode')}><div class="row nowrap"><input id="item-code" class="grow" value=${f.code} onInput=${txt('code')} />
        <button class="icon-btn" title=${tr('Scan with camera')} aria-label=${tr('Scan with camera')} onClick=${scan}><${Icon} n="camera" /></button>
        <button class="icon-btn" title=${tr('Generate')} aria-label=${tr('Generate')} onClick=${() => set('code', Inventory.nextCode())}><${Icon} n="refresh" /></button></div></${Field}>

      <${Field} label=${tr('Category')}><input list="kb-cats" value=${f.category} onInput=${txt('category')} />

function StockAlerts() {

  const low = Inventory.lowStock();
  const today = isoDate();
  const sendLow = async () => {
    const phone = await ask.text(tr('Send low-stock list to (WhatsApp number)'), { initial: App.s('owner_phone'), numeric: true });
    if (phone?.trim()) openWhatsApp(phone.trim(), Reports.lowStockText());

function StockAdjust() {
  const [it, setIt] = useState(null);
  const [add, setAdd] = useState(false);
  const [reason, setReason] = useState('damage');
  const [qty, setQty] = useState(0);
  const [note, setNote] = useState('');
  const save = async () => {
    if (!it || qty <= 0) { toast(tr('Select an item and enter quantity'), true); return; }
    await Inventory.adjust(it, add ? qty : -qty, add ? 'adjust' : reason, note);
    App.touch();
    setQty(0); setNote('');
    setIt(App.itemMap.get(it.id));
    toast(tr('Stock updated'));
  };
  return html`<div class="stack" style="max-width:560px">
    <button onClick=${async () => { const x = await pickItem(); if (x) setIt(x); }}><${Icon} n="search" />${it ? `${it.name} (${it.code})` : tr('Select item')}</button>
    ${it && html`<b>${tr('Current stock')}: ${qtyFmt(it.stock)} ${it.unit}</b>`}
    <${Seg} value=${add} options=${[[false, tr('Reduce stock')], [true, tr('Add stock')]]} onChange=${setAdd} />
    ${!add && html`<${Chips} value=${reason} options=${[['damage', tr('Damaged')], ['expiry', tr('Expired')], ['own_use', tr('Own use / sample')], ['lost', tr('Lost / theft')], ['adjust', tr('Correction')]]} onChange=${setReason} />`}
    <${Field} label=${tr('Quantity')}><${Num} value=${qty} onChange=${setQty} /></${Field}>
    <${Field} label=${tr('Note')}><input value=${note} onInput=${(e) => setNote(e.target.value)} /></${Field}>
    <button class="btn-primary" onClick=${save}>${tr('Save adjustment')}</button>
  </div>`;
}
function StockAudit() {
  useApp();
  const [cat, setCat] = useState('');
  const [counts, setCounts] = useState({});
  const parents = Data.parentIds();
  const list = App.items.filter((i) => i.active && !parents.has(i.id) && (!cat || i.category === cat));
  const post = async () => {
    const c = {};
    for (const [id, v] of Object.entries(counts)) if (toS(v).trim() !== '') c[id] = toD(v);
    if (!Object.keys(c).length) { toast(tr('Enter physical counts first'), true); return; }
    if (!(await ask.confirm(tr('Post stock audit?'), `${Object.keys(c).length} ${tr('items counted. Differences will be adjusted in stock.')}`))) return;
    const n = await Inventory.postAudit(c);
    setCounts({});
    App.touch();
    toast(`${n} ${tr('items adjusted')}`);
  };
  return html`<div class="stack">
    <div class="row between"><select style="width:auto" value=${cat} onChange=${(e) => setCat(e.target.value)}><option value="">${tr('All categories')}</option>
      ${Data.categories().map((c) => html`<option value=${c}>${c}</option>`)}</select><button class="btn-primary" onClick=${post}><${Icon} n="check" />${tr('Post audit')}</button></div>
    <div class="list">${list.slice(0, 400).map((i) => {
      const v = counts[i.id];
      const diff = v != null && v !== '' ? toD(v) - toD(i.stock) : null;
      return html`<div class="li" style="cursor:default"><div class="grow"><div class="title">${i.name}</div>
        <div class="sub">${i.code}${variantLabel(i) ? ' • ' + variantLabel(i) : ''} • ${tr('System')}: ${qtyFmt(i.stock)} ${i.unit}${diff ? ` • ${tr('Difference')}: ${diff > 0 ? '+' : ''}${qtyFmt(diff)}` : ''}</div></div>
        <input style="width:110px" inputmode="decimal" placeholder=${tr('Counted')} value=${v || ''} onInput=${(e) => setCounts({ ...counts, [i.id]: e.target.value })} /></div>`;
    })}</div></div>`;
}

function GRNForm({ close }) {
  const [sup, setSup] = useState(null);

  const [lines, setLines] = useState([]);
  const [inv, setInv] = useState('');
  const [note, setNote] = useState('');
  const [freight, setFreight] = useState(0);
  const fromPO = async () => {
    if (!sup) { toast(tr('Select the supplier first'), true); return; }
    const pos = (await Purchase.purchaseOrders()).filter((p) => p.supplier_id === sup.id && ['open', 'partial'].includes(p.status));
    if (!pos.length) { toast(tr('No open orders for this supplier')); return; }
    const id = await ask.choose(tr('Select purchase order'), pos.map((p) => ({ value: p.id, label: p.po_no, sub: `${dateFmt(p.date)} • ${money(p.total)}` })));
    if (!id) return;
    const pl = await Purchase.poLines(id);
    setPo(pos.find((p) => p.id === id));
    setLines(pl.filter((l) => l.qty - l.received_qty > 0 && App.itemMap.get(l.item_id)).map((l) => newPurchaseLine(App.itemMap.get(l.item_id), { qty: l.qty - l.received_qty, cost: l.cost, inPacks: false, poLineId: l.id, ordered: l.qty - l.received_qty })));
  };
  const save = async () => {
    const ls = lines.filter((l) => l.qty > 0 || l.freeQty > 0);

  };
  return html`<${Modal} title=${tr('Receive goods (GRN)')} size="wide" onClose=${close}

// ---------- reports ----------
function ReportsScreen() {
  useApp();
  const [rep, setRep] = useState(null);
  const [preset, setPreset] = useState('today');
  const [range, setRange] = useState(() => ({ from: new Date(), to: new Date() }));
  const list = Reports.list.filter((r) => !r.ownerOnly || App.user.role === 'owner');
  const [data, , loading] = useLoad(() => (rep ? rep.run(range.from, range.to) : null), [rep, range.from.getTime(), range.to.getTime()]);
  const setP = (p) => {
    const t = startOfDay(new Date());
    let from = t, to = t;
    if (p === 'yesterday') from = to = addDays(t, -1);
    if (p === 'week') from = addDays(t, -((t.getDay() + 6) % 7));
    if (p === 'month') from = new Date(t.getFullYear(), t.getMonth(), 1);
    if (p === 'last_month') { from = new Date(t.getFullYear(), t.getMonth() - 1, 1); to = new Date(t.getFullYear(), t.getMonth(), 0); }
    if (p === 'fy') from = t.getMonth() >= 3 ? new Date(t.getFullYear(), 3, 1) : new Date(t.getFullYear() - 1, 3, 1);
    setPreset(p); setRange({ from, to });
  };
  const sub = rep && (rep.usesDates === false ? `${tr('As on')} ${dateFmt(new Date())}` : `${dateFmt(range.from)} - ${dateFmt(range.to)}`);
  const custom = (k) => (e) => { const d = e.target.value ? new Date(e.target.value + 'T00:00') : null; if (d) { setPreset('custom'); setRange({ ...range, [k]: d }); } };
  return html`<div class=${'report-layout' + (rep ? ' picked' : '')}>
    <div class="list" style="align-self:start">${list.map((r) => html`<div class=${'li' + (rep?.id === r.id ? ' on' : '')} style=${rep?.id === r.id ? 'background:var(--accent-soft)' : ''} onClick=${() => setRep(r)}>
      <${Icon} n="reports" /><div class="grow title" style="font-weight:500">${tr(r.title)}</div></div>`)}</div>
    <div class="stack" style="min-width:0">
      ${!rep ? html`<${Empty} icon="reports" text=${tr('Choose a report')} />` : html`
        <div><button class="btn-sm rep-back" onClick=${() => setRep(null)}><${Icon} n="back" s=${15} />${tr('All reports')}</button></div>
        <div class="row between"><div><h2>${tr(rep.title)}</h2><div class="muted small">${sub}</div></div>
          <div class="row">${data && html`<button class="btn-sm" onClick=${() => printTable(rep.title, sub, data, data.columns.length > 6)}><${Icon} n="print" s=${15} />${tr('Print')}</button>
            <button class="btn-sm" onClick=${() => ImportExport.exportReport(tr(rep.title), data, rep.usesDates === false ? null : range.from, range.to)}><${Icon} n="download" s=${15} />${tr('Excel')}</button>`}</div></div>
        ${rep.usesDates !== false && html`<div class="row"><${Chips} value=${preset} options=${[['today', tr('Today')], ['yesterday', tr('Yesterday')], ['week', tr('This week')], ['month', tr('This month')], ['last_month', tr('Last month')], ['fy', tr('This financial year')]]} onChange=${setP} />
          <input type="date" style="width:auto" value=${isoDate(range.from)} onChange=${custom('from')} aria-label=${tr('From date')} />
          <input type="date" style="width:auto" value=${isoDate(range.to)} onChange=${custom('to')} aria-label=${tr('To date')} /></div>`}
        ${loading ? html`<div class="muted">${tr('Loading...')}</div>` : data && (data.rows.length ? html`<${Table} ...${data} />` : html`<${Empty} icon="reports" text=${tr('No data for this period')} />`)}`}
    </div></div>`;
}

// ---------- import / export / backup ----------
function DataModal({ close }) {
  const [busy, setBusy] = useState('');
  const owner = App.can('settings');
  const fileRef = useRef();
  const pending = useRef(null);
  const pickFile = (kind) => { pending.current = kind; fileRef.current.value = ''; fileRef.current.click(); };
  const onFile = async (e) => {
    const file = e.target.files[0];
    const kind = pending.current;
    if (!file) return;
    try {
      if (kind === 'restore') return restore(file);
      const rows = await readSheet(file);
      const fields = Object.keys(ImportExport.mapHeaders(rows[0] || [], kind === 'items' ? ImportExport.itemColumns : ImportExport.customerColumns));
      const opts = await openModal((c) => html`<${ImportOptions} c=${c} name=${file.name} rows=${rows.length - 1} fields=${fields} items=${kind === 'items'} />`);
      if (!opts) return;
      setBusy(tr('Importing...'));
      const res = kind === 'items' ? await ImportExport.importItems(rows, { ...opts, onProgress: (i, n) => setBusy(`${tr('Importing...')} ${i}/${n}`) }) : await ImportExport.importCustomers(rows, opts);
      setBusy('');
      App.touch();
      openModal((c) => html`<${Modal} title=${tr('Import finished')} onClose=${c}><p style="margin:0">${tr('Added')}: ${res.added} • ${tr('Updated')}: ${res.updated} • ${tr('Skipped')}: ${res.skipped}</p>
        ${res.errors.slice(0, 30).map((x) => html`<div class="small muted">${x}</div>`)}</${Modal}>`);
    } catch (err) { setBusy(''); toast(err.message, true); }
  };
  const restore = async (file) => {
    const data = await Backup.parse(file);
    if (!(await ask.confirm(tr('Restore a backup?'), `${data.shop || ''} • ${dateTimeFmt(data.exported_at)}\n\n${tr('All current data will be replaced by the backup. A copy of the current data is downloaded first.')}`, 'Restore', true))) return;
    if (!(await approve('Restore backup'))) return;
    setBusy(tr('Restoring...'));
    try {
      await Backup.download();
      await Backup.restore(data, (d, n) => setBusy(`${tr('Restoring...')} ${d}/${n}`));
      setBusy('');
      await ask.confirm(tr('Backup restored'), tr('Please log in again.'));
      location.reload();
    } catch (err) { setBusy(''); toast(err.message, true); }
  };
  const tile = (icon, title, sub, fn) => html`<div class="li" onClick=${busy ? undefined : fn}><div class="avatar"><${Icon} n=${icon} /></div>
    <div class="grow"><div class="title">${tr(title)}</div><div class="sub">${tr(sub)}</div></div></div>`;
  return html`<${Modal} title=${tr('Import, export and backup')} size="wide" onClose=${close}>
    <input type="file" ref=${fileRef} hidden accept=".xlsx,.xls,.csv,.json" onChange=${onFile} />
    ${busy && html`<div class="notice">${busy}</div>`}
    <h3>${tr('Items')}</h3>
    <div class="list">${tile('upload', 'Import items from Excel', 'Add or update many items at once. Matches by code.', () => pickFile('items'))}
      ${tile('download', 'Export all items', 'Opens in Excel. Edit and import back.', () => ImportExport.exportItems())}
      ${tile('items', 'Download item template', 'Column names and two sample rows.', () => ImportExport.itemTemplate())}</div>
    <h3>${tr('Customers')}</h3>
    <div class="list">${tile('upload', 'Import customers from Excel', 'Brings opening khata balance and points too. Matches by mobile.', () => pickFile('customers'))}
      ${tile('download', 'Export all customers', 'Name, mobile, balance, points.', () => ImportExport.exportCustomers())}
      ${tile('customers', 'Download customer template', 'Column names and a sample row.', () => ImportExport.customerTemplate())}</div>
    ${owner && html`<h3>${tr('Backup')}</h3>
      <div class="list">${tile('download', 'Download a backup', 'One file with all shop data. Keep it on a pen drive or Google Drive.', async () => { setBusy(tr('Saving backup...')); try { await Backup.download(); } finally { setBusy(''); } })}
        ${tile('restore', 'Restore from a backup', 'Replaces all data. Also moves data from "this browser" to Supabase.', () => pickFile('restore'))}</div>`}
  </${Modal}>`;
}
function ImportOptions({ c, name, rows, fields, items }) {
  const [update, setUpdate] = useState(true);
  const [setStock, setSetStock] = useState(false);
  return html`<${Modal} title=${`${tr('Import')} ${name}`} size="narrow" onClose=${c}
    foot=${html`<button onClick=${() => c(null)}>${tr('Cancel')}</button><button class="btn-primary" onClick=${() => c({ updateExisting: update, setStock })}>${tr('Import')}</button>`}>
    <p style="margin:0">${tr('Rows')}: ${rows}</p>
    <p class="muted small" style="margin:0">${tr('Columns recognised')}: ${fields.join(', ') || '-'}</p>
    <${Check} label=${items ? tr('Update items that already exist (same code)') : tr('Update customers that already exist (same mobile)')} checked=${update} onChange=${setUpdate} />
    ${items && html`<${Check} label=${tr('Set stock of existing items to the file quantity')} checked=${setStock} onChange=${setSetStock} />`}
  </${Modal}>`;
}

// ---- ui_shell.js ----
// ===== Start-up: connect, sign in, shop setup, staff PIN, main layout =====

const CONFIG_KEY = 'kadaibill-config';
function readConfig() {
  if (KB_DEMO) return { mode: 'local' };
  if (typeof KB_CONFIG !== 'undefined' && KB_CONFIG.supabaseUrl && KB_CONFIG.supabaseAnonKey) {
    return { mode: 'cloud', url: KB_CONFIG.supabaseUrl, key: KB_CONFIG.supabaseAnonKey, fixed: true };
  }
  try { return JSON.parse(localStorage.getItem(CONFIG_KEY) || 'null'); } catch { return null; }
}
function writeConfig(c) { try { if (c) localStorage.setItem(CONFIG_KEY, JSON.stringify(c)); else localStorage.removeItem(CONFIG_KEY); } catch { /* storage blocked */ } }

function applyTheme() {
  const t = (() => { try { return localStorage.getItem('kadaibill-theme') || ''; } catch { return ''; } })();
  if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
}

function Root() {
  const [phase, setPhase] = useState('boot');
  const [err, setErr] = useState('');
  const boot = async () => {
    setErr('');
    const cfg = readConfig();
    if (!cfg) return setPhase('connect');
    try {
      if (cfg.mode === 'cloud') {
        if (!window.supabase) throw new Error(tr('Could not load the Supabase library. Check the internet connection.'));
        App.store = new SupabaseStore(cfg.url, cfg.key);
        const session = await App.store.session();
        if (!session) return setPhase('signin');
        App.email = session.user?.email || '';
        App.memberRole = await App.store.rpc('kb_join');
        if (!App.memberRole) return setPhase('denied');
      } else {
        App.store = new LocalStore();
        await App.store.open();
        App.memberRole = 'owner';
      }
      await Data.loadAll();
      App.cart = newCart();
      if (!App.isSetup) return setPhase('setup');
      setPhase('pin');
    } catch (e) {
      console.error(e);
      setErr(e.message || String(e));
      setPhase('error');
    }
  };
  useEffect(() => { boot(); }, []);
  App.reboot = boot;
  App.toPin = () => setPhase('pin');
  App.toApp = () => setPhase('app');

  let view;
  if (phase === 'boot') view = html`<div class="center-page"><div class="muted">${tr('Loading...')}</div></div>`;
  else if (phase === 'connect') view = html`<${ConnectScreen} done=${boot} />`;
  else if (phase === 'signin') view = html`<${SignInScreen} done=${boot} />`;
  else if (phase === 'denied') view = html`<${DeniedScreen} />`;
  else if (phase === 'setup') view = html`<${SetupScreen} done=${() => setPhase('pin')} />`;
  else if (phase === 'pin') view = html`<${PinScreen} done=${() => setPhase('app')} />`;
  else if (phase === 'app') view = html`<${Shell} />`;
  else view = html`<div class="center-page"><div class="card auth-card stack"><h2>${tr('Something went wrong')}</h2><p class="bad-text">${err}</p>
    <div class="row"><button class="btn-primary" onClick=${boot}>${tr('Try again')}</button>
    <button onClick=${() => { writeConfig(null); boot(); }}>${tr('Change connection')}</button></div></div></div>`;
  return html`${view}<${ModalHost} /><${ToastHost} />`;
}

function LangToggle() {

    App.settings.lang = next;

    if (App.store && App.isSetup) saveSettings({ lang: next }).catch(() => {});

  return html`<button class="btn-ghost" onClick=${flip} title=${tr('Language')}><${Icon} n="lang" />${App.lang === 'en' ? 'தமிழ்' : 'English'}</button>`;
}

  return html`<div class="center-page"><div class="stack" style="width:min(560px,100%)">
    <div class="row between"><div class="brand" style="padding:0"><div class="brand-mark">K</div><div><b>KadaiBill</b><span class="muted small">${tr('Billing for Indian shops')}</span></div></div><${LangToggle} /></div>
    <div class="card stack">
      <h2>${tr('Connect your shop to the cloud')}</h2>
      <p class="muted" style="margin:0">${tr('Bills, stock and customers are saved in your Supabase project, so every counter, phone and PC sees the same data.')}</p>
      <${Field} label=${tr('Supabase Project URL')}><input id="sb-url" placeholder="https://abcdxyz.supabase.co" value=${url} onInput=${(e) => setUrl(e.target.value)} /></${Field}>

      <button class="btn-primary" onClick=${cloud}><${Icon} n="cloud" />${tr('Connect')}</button>
    </div>
    <div class="card row between">
      <div class="grow"><h3>${tr('Try it first')}</h3><p class="muted small" style="margin:2px 0 0">${tr('Keeps data only in this browser. You can move it to Supabase later with a backup file.')}</p></div>
      <button id="try-local" onClick=${local}>${tr('Use in this browser')}</button>
    </div>

}

function SignInScreen({ done }) {
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');
  const [busy, setBusy] = useState(false);
  const go = async (signup) => {
    setBusy(true);
    try {
      const s = signup ? await App.store.signUp(email.trim(), pw) : await App.store.signIn(email.trim(), pw);
      if (!s) { toast(tr('Check your email to confirm the account, then sign in.')); setBusy(false); return; }
      done();
    } catch (e) { toast(e.message, true); setBusy(false); }
  };
  const cfg = readConfig();
  return html`<div class="center-page"><form class="card auth-card stack" onSubmit=${(e) => { e.preventDefault(); go(false); }}>
    <div class="row between"><h2>${tr('Sign in to your shop')}</h2><${LangToggle} /></div>
    <${Field} label=${tr('Email')}><input type="email" autocomplete="username" value=${email} onInput=${(e) => setEmail(e.target.value)} /></${Field}>
    <${Field} label=${tr('Password')}><input type="password" autocomplete="current-password" value=${pw} onInput=${(e) => setPw(e.target.value)} /></${Field}>
    <button class="btn-primary" disabled=${busy}>${tr('Sign in')}</button>
    <button type="button" disabled=${busy} onClick=${() => go(true)}>${tr('Create shop login')}</button>
    <p class="muted small" style="margin:0">${tr('The first login to sign in becomes the shop owner. The owner allows staff logins in Users.')}</p>
    ${!cfg?.fixed && html`<button type="button" class="btn-ghost" onClick=${() => { writeConfig(null); done(); }}>${tr('Change connection')}</button>`}
  </form></div>`;
}

function DeniedScreen() {
  return html`<div class="center-page"><div class="card auth-card stack">
    <h2>${tr('This login is not allowed for this shop')}</h2>
    <p class="muted" style="margin:0">${App.email}. ${tr('Ask the shop owner to allow this email in Users → Logins allowed.')}</p>

function SetupScreen({ done }) {
  const [f, setF] = useState({ shop: '', phone: '', gstin: '', upi: '', address: '', owner: '', pin: '', pin2: '', preset: 'kirana', samples: true });
  const [busy, setBusy] = useState(false);
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const p = SHOP_PRESETS.find((x) => x.id === f.preset);
  const save = async () => {
    if (!f.shop.trim() || !f.owner.trim()) { toast(tr('Enter shop name and owner name'), true); return; }
    if (!/^\d{4,6}$/.test(f.pin) || f.pin !== f.pin2) { toast(tr('PIN must be at least 4 digits and match'), true); return; }
    setBusy(true);
    try {
      if (!App.users.length) await App.store.apply([{ op: 'insert', t: 'users', v: { name: f.owner.trim(), pin: f.pin, role: 'owner', active: 1 } }]);
      await Data.loadUsers();
      App.user = App.users[0];
      await saveSettings({
        shop_name: f.shop.trim(), shop_phone: f.phone.trim(), shop_gstin: f.gstin.trim().toUpperCase(), upi_id: f.upi.trim(),
        upi_name: f.shop.trim(), shop_address: f.address.trim(), preset: p.id, ...presetFlags(p), bill_prefix: 'INV', receipt_size: '80',
        receipt_footer: 'Thank you! Visit again.', points_per_100: '1', point_value: '1', cashier_max_disc_pct: '5', require_shift: '1',
        round_off: '1', categories: p.cats, lang: App.lang,
      });
      if (f.samples) {
        await Data.loadItems();
        for (const s of p.samples) {
          if (Inventory.codeExists(s.code)) continue;
          const { stock, ...it } = s;
          await Inventory.saveItem({ ...it, id: null, active: 1 }, { openingStock: stock, noAudit: true });
        }
      }
      await saveSettings({ setup_done: '1' });
      App.user = null;
      done();
    } catch (e) { toast(e.message, true); setBusy(false); }
  };
  const on = [p.loose && 'Loose / weighed items', p.batches && 'Batch and expiry', p.variants && 'Size / colour variants', p.jewellery && 'Weight and making charges'].filter(Boolean);
  return html`<div class="content" style="max-width:860px;margin:0 auto;width:100%">
    <div class="row between" style="margin-bottom:12px"><h1>${tr('Welcome to KadaiBill')}</h1><${LangToggle} /></div>
    <p class="muted">${tr('Set up your shop in one step. You can change all of this later in Settings.')}</p>
    <h2 class="section-title">${tr('Shop details')}</h2>
    <div class="form-grid">
      <${Field} label=${tr('Shop name')}><input id="setup-shop" value=${f.shop} onInput=${set('shop')} /></${Field}>
      <${Field} label=${tr('Phone')}><input inputmode="tel" value=${f.phone} onInput=${set('phone')} /></${Field}>
      <${Field} label=${tr('GSTIN (optional)')}><input value=${f.gstin} onInput=${set('gstin')} /></${Field}>
      <${Field} label=${tr('UPI ID for QR payments (optional)')}><input value=${f.upi} onInput=${set('upi')} /></${Field}>
    </div>
    <div style="margin-top:12px"><${Field} label=${tr('Address')}><textarea value=${f.address} onInput=${set('address')}></textarea></${Field}></div>
    <h2 class="section-title">${tr('Shop type')}</h2>
    <${Chips} value=${f.preset} options=${SHOP_PRESETS.map((x) => [x.id, App.lang === 'ta' ? x.ta : x.name])} onChange=${(v) => setF({ ...f, preset: v })} />
    <p class="muted small">${on.length ? `${tr('Turns on')}: ${on.map(tr).join(', ')}` : tr('Standard billing and stock')}</p>
    <${Check} label=${tr('Add a few sample items to try billing')} checked=${f.samples} onChange=${(v) => setF({ ...f, samples: v })} />
    <h2 class="section-title">${tr('Owner login')}</h2>
    <div class="form-grid">
      <${Field} label=${tr('Owner name')}><input id="setup-owner" value=${f.owner} onInput=${set('owner')} /></${Field}>
      <${Field} label=${tr('PIN (4-6 digits)')}><input id="setup-pin" type="password" inputmode="numeric" value=${f.pin} onInput=${set('pin')} /></${Field}>
      <${Field} label=${tr('Confirm PIN')}><input id="setup-pin2" type="password" inputmode="numeric" value=${f.pin2} onInput=${set('pin2')} /></${Field}>
    </div>
    <div style="margin-top:20px"><button id="setup-save" class="btn-primary btn-big" disabled=${busy} onClick=${save}><${Icon} n="check" />${tr('Start billing')}</button></div>
  </div>`;
}

function PinScreen({ done }) {
  useApp();
  const users = App.users.filter((u) => u.active).sort((a, b) => ['owner', 'manager', 'cashier'].indexOf(a.role) - ['owner', 'manager', 'cashier'].indexOf(b.role));
  const [sel, setSelState] = useState(users.length === 1 ? users[0] : null);
  const selRef = useRef(sel);
  const setSel = (u) => { selRef.current = u; setSelState(u); };
  const [pin, setPinState] = useState('');
  const pinRef = useRef('');
  const busy = useRef(false);
  const setPin = (v) => { pinRef.current = v; setPinState(v); };
  const tryLogin = async (p) => {
    const sel = selRef.current;
    if (!sel || busy.current) return;
    if (p !== sel.pin) { setPin(''); toast(tr('Wrong PIN'), true); return; }
    busy.current = true;
    try {
      App.user = sel;
      const sh = await Shifts.current(sel.id);
      App.shiftId = sh?.id ?? null;
      App._draftChecked = false;
      App.cart = newCart();
      await audit('login', sel.name).catch(() => {});
      done();
    } catch (e) { App.user = null; setPin(''); toast(e.message, true); } finally { busy.current = false; }
  };
  const press = (k) => {
    const sel = selRef.current;
    if (!sel) return;
    const cur = pinRef.current;
    if (k === '<') return setPin(cur.slice(0, -1));
    if (k === 'OK') return tryLogin(cur);
    if (cur.length >= 6) return;
    const p = cur + k;
    setPin(p);
    if (p.length === sel.pin.length) tryLogin(p);
  };
  const pressRef = useRef(press);
  pressRef.current = press;
  useEffect(() => {
    const onKey = (e) => {
      if (Modals.stack.length || e.target.matches?.('input, textarea, select')) return;
      if (/^[0-9]$/.test(e.key)) { e.preventDefault(); pressRef.current(e.key); }
      if (e.key === 'Backspace') pressRef.current('<');
      if (e.key === 'Enter') { e.preventDefault(); pressRef.current('OK'); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);
  return html`<div class="center-page"><div class="auth-card stack" style="text-align:center">
    <div class="brand" style="justify-content:center"><div class="brand-mark">K</div><div style="text-align:left"><b>${App.s('shop_name', 'KadaiBill')}</b><span class="muted small">${tr('Select your name and enter PIN')}</span></div></div>
    <div class="chips" style="justify-content:center">${users.map((u) => html`<button class=${'chip' + (sel?.id === u.id ? ' on' : '')} onClick=${() => { setSel(u); setPin(''); }}><${Icon} n="user" s=${15} />${u.name}</button>`)}</div>
    <div class="pin-dots">${Array.from({ length: sel?.pin.length || 4 }, (_, i) => html`<i class=${i < pin.length ? 'on' : ''}></i>`)}</div>
    <div class="keypad">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '<', '0', 'OK'].map((k) => html`<button disabled=${!sel} onClick=${() => press(k)} aria-label=${k === '<' ? tr('Delete') : k}>${k === '<' ? html`<${Icon} n="back" />` : k === 'OK' ? tr('OK') : k}</button>`)}</div>
    <div class="row" style="justify-content:center"><${LangToggle} />
      ${App.store?.kind === 'cloud' && html`<button class="btn-ghost" onClick=${async () => { await App.store.signOut(); App.reboot(); }}><${Icon} n="logout" />${tr('Sign out of shop')}</button>`}</div>
  </div></div>`;
}

// ---------- main layout ----------
const NAV = [
  ['dashboard', 'Dashboard', 'dashboard', 'reports'],
  ['pos', 'Billing', 'pos', 'pos'],
  ['returns', 'Returns & bills', 'return', 'returns'],
  ['items', 'Items', 'items', 'items'],
  ['stock', 'Stock', 'stock', 'stock'],
  ['purchase', 'Purchase', 'purchase', 'purchase'],
  ['customers', 'Customers & khata', 'customers', 'customers'],
  ['offers', 'Offers & coupons', 'offers', 'offers'],
  ['reports', 'Reports', 'reports', 'reports'],
  ['shift', 'Shift & cash', 'shift', 'shift'],
  ['expenses', 'Expenses', 'expenses', 'expenses'],
  ['users', 'Users', 'users', 'users'],
  ['settings', 'Settings', 'settings', 'settings'],
];
const SCREENS = () => ({
  dashboard: DashboardScreen, pos: PosScreen, returns: ReturnsScreen, items: ItemsScreen, stock: StockScreen,
  purchase: PurchaseScreen, customers: CustomersScreen, offers: OffersScreen, reports: ReportsScreen, shift: ShiftScreen,
  expenses: ExpensesScreen, users: UsersScreen, settings: SettingsScreen,
});

function Shell() {
  useApp();
  const allowed = NAV.filter((n) => App.can(n[3]));
  const initial = () => {
    const h = location.hash.replace('#', '');
    if (allowed.some((n) => n[0] === h)) return h;
    return App.isManager ? 'dashboard' : 'pos';
  };
  const [route, setRoute] = useState(initial);
  const [drawer, setDrawer] = useState(false);
  const go = (r) => { setRoute(r); setDrawer(false); try { history.replaceState(null, '', '#' + r); } catch { /* sandboxed */ } };
  useEffect(() => {
    if (App.store.kind !== 'cloud') return undefined;
    // Pick up changes made on other counters.
    const t = setInterval(async () => {
      if (Modals.stack.length) return;
      try { await Promise.all([Data.loadItems(), Data.loadCustomers(), Data.loadOffers(), Data.loadSuppliers(), Data.loadUsers()]); App.touch(); } catch { /* offline for a moment */ }
    }, 120000);
    return () => clearInterval(t);
  }, []);
  const cur = allowed.find((n) => n[0] === route) || allowed[0];
  const Screen = SCREENS()[cur[0]];
  const logout = async () => { await audit('logout', App.user.name).catch(() => {}); App.user = null; App.shiftId = null; App.toPin(); };
  const theme = () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    try { localStorage.setItem('kadaibill-theme', dark ? 'light' : 'dark'); } catch { /* ignore */ }
    applyTheme();
  };
  return html`<div class="shell">
    <nav class=${'rail' + (drawer ? ' open' : '')} aria-label=${tr('Main menu')}>
      <div class="brand"><div class="brand-mark">K</div><div class="grow"><b>${App.s('shop_name', 'KadaiBill')}</b><span class="muted small">${KB_DEMO ? tr('Demo') : App.store.kind === 'cloud' ? tr('Cloud') : tr('This browser only')}</span></div></div>
      ${allowed.map((n) => html`<button class=${'nav-item' + (n[0] === cur[0] ? ' on' : '')} onClick=${() => go(n[0])}><${Icon} n=${n[2]} />${tr(n[1])}</button>`)}
      <div class="grow"></div>
      <div class="muted small" style="padding:8px 10px">${App.user.name} • ${tr(App.user.role === 'owner' ? 'Owner' : App.user.role === 'manager' ? 'Manager' : 'Cashier')}</div>
      <button class="nav-item" onClick=${theme}><${Icon} n="refresh" />${tr('Light / dark')}</button>
      <button class="nav-item" onClick=${logout}><${Icon} n="logout" />${tr('Switch user')}</button>
    </nav>
    <div class=${'drawer-back' + (drawer ? ' open' : '')} onClick=${() => setDrawer(false)}></div>
    <div class="main">
      <header class="topbar">
        <button class="btn-ghost icon-btn menu-btn" aria-label=${tr('Main menu')} onClick=${() => setDrawer(true)}><${Icon} n="menu" /></button>
        <h1 class="grow">${tr(cur[1])}</h1>
        ${App.shiftId == null && App.requireShift && App.can('pos') && html`<button class="chip" onClick=${() => go('shift')}><${Icon} n="warn" s=${15} />${tr('No shift open')}</button>`}
        <${LangToggle} />
      </header>
      <main class=${'content' + (cur[0] === 'pos' ? ' flush' : '')}><${Screen} go=${go} key=${cur[0]} /></main>
    </div>
  </div>`;
}

// ---- start ----
applyTheme();
render(html`<${Root} />`, document.getElementById('app'));
</script>
</body>
</html>
