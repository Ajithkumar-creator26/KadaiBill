  },
  async purchaseOrders() {
    const rows = await App.store.select('purchase_orders', { order: [['id', 'desc']], limit: 300 });
    return rows.map((r) => ({ ...r, supplier_name: Data.supplier(r.supplier_id)?.name || '' }));
  },
  async poLines(poId) {
    const rows = await App.store.select('po_lines', { eq: { po_id: poId } });
    return rows.map((r) => ({ ...r, name: App.itemMap.get(r.item_id)?.name || '?', code: App.itemMap.get(r.item_id)?.code || '', unit: App.itemMap.get(r.item_id)?.unit || '' }));
  },
  async cancelPO(id) { await App.store.apply([{ op: 'update', t: 'purchase_orders', id, v: { status: 'cancelled' } }, auditOp('po_cancel', String(id))]); },

  /** Items at/below reorder level, or with less than [coverDays] of stock at the last 30 days' sales rate. */
  async suggestions(coverDays = 15) {
    const since = addDays(new Date(), -30).toISOString();
    const moves = await App.store.select('stock_moves', { eq: { type: 'sale' }, gte: { date: since } });
    const sold = new Map();
    for (const m of moves) sold.set(m.item_id, (sold.get(m.item_id) || 0) - toD(m.qty));
    const parents = Data.parentIds();
    const out = [];
    for (const it of App.items) {
      if (!it.active || parents.has(it.id)) continue;
      const daily = (sold.get(it.id) || 0) / 30;
      const target = Math.max(toD(it.reorder_level) * 2, daily * coverDays);
      const need = target - toD(it.stock);
      const low = toD(it.reorder_level) > 0 && toD(it.stock) <= toD(it.reorder_level);
      if ((low || daily > 0) && need > 0) {
        const p = toD(it.pack_qty);
        out.push(p > 1 ? newPurchaseLine(it, { qty: Math.ceil(need / p), inPacks: true }) : newPurchaseLine(it, { qty: Math.ceil(need), inPacks: false }));
      }
    }
    return out;
  },

  /** Goods received: stock goes up now; the supplier invoice is posted later. */
  async saveGRN({ supplierId, poId, lines, invoiceNo, note, freight }) {
    freight = toD(freight);
    const taxable = sum(lines, PL.taxable), tax = sum(lines, PL.tax);
    const batches = [];
    const ops = [seqOp('grn', 'n'), {
      op: 'insert', t: 'grns', ref: 'g', v: {
        grn_no: docNoValue('grn', 'n'), po_id: poId ?? null, supplier_id: supplierId, date: nowIso(),
        invoice_no: invoiceNo || '', taxable: r2(taxable), tax: r2(tax), freight: r2(freight),
        total: r2(taxable + tax + freight), status: 'pending', note: note || '', user_id: App.user.id,
      },
    }];
    const changed = [];
    for (const l of lines) {
      if (l.qty <= 0 && l.freeQty <= 0) continue;
      const inQty = PL.baseQty(l) + PL.baseFree(l);
      const share = taxable > 0 ? freight * PL.taxable(l) / taxable : 0;
      const landed = inQty > 0 ? (PL.baseQty(l) * PL.baseCost(l) + share) / inQty : PL.baseCost(l);
      ops.push({ op: 'insert', t: 'grn_lines', v: { grn_id: { $ref: 'g' }, item_id: l.item.id, qty: PL.baseQty(l), free_qty: PL.baseFree(l), cost: PL.baseCost(l), gst_rate: l.gstRate, batch_no: l.batchNo, expiry: l.expiry, po_line_id: l.poLineId } });
      if (l.item.track_batch) ops.push({ op: 'insert', t: 'batches', v: { item_id: l.item.id, batch_no: l.batchNo, expiry: l.expiry, qty: inQty, cost: r2(landed), created_at: nowIso() } });
      ops.push(...stockOps(l.item, inQty, 'grn', docNoValue('grn', 'n'), PL.baseFree(l) > 0 ? `incl. ${qtyFmt(PL.baseFree(l))} free` : '', batches));
      ops.push({ op: 'update', t: 'items', id: l.item.id, v: { cost: r2(landed) } });
      if (l.poLineId != null) ops.push({ op: 'inc', t: 'po_lines', id: l.poLineId, v: { received_qty: PL.baseQty(l) } });
      changed.push(l.item.id);
    }
    ops.push(auditOp('grn', amt(taxable + tax + freight)));
    const refs = await App.store.apply(ops);
    if (poId != null) {
      const pl = await App.store.select('po_lines', { eq: { po_id: poId } });
      const pending = pl.some((x) => toD(x.received_qty) < toD(x.qty));
      await App.store.apply([{ op: 'update', t: 'purchase_orders', id: poId, v: { status: pending ? 'partial' : 'received' } }]);
    }
    await Data.refreshItems(changed);
    return docNo('grn', refs.n);
  },
  async grns(status) {
    const rows = await App.store.select('grns', { eq: status ? { status } : undefined, order: [['id', 'desc']], limit: 300 });
    const pos = await App.store.select('purchase_orders', { in: { id: rows.map((r) => r.po_id).filter((x) => x != null) } });
    return rows.map((r) => ({ ...r, supplier_name: Data.supplier(r.supplier_id)?.name || '', po_no: pos.find((p) => p.id === r.po_id)?.po_no || '' }));
  },
  async grnLines(id) {
    const rows = await App.store.select('grn_lines', { eq: { grn_id: id } });
    return rows.map((r) => ({ ...r, name: App.itemMap.get(r.item_id)?.name || '?' }));
  },
  async postEntry(grn, invoiceNo, invoiceDate, invoiceTotal) {
    await App.store.apply([
      { op: 'update', t: 'grns', id: grn.id, v: { invoice_no: invoiceNo, invoice_date: invoiceDate, total: invoiceTotal, status: 'posted' } },
      { op: 'insert', t: 'supplier_ledger', v: { supplier_id: grn.supplier_id, date: nowIso(), type: 'purchase', amount: invoiceTotal, ref: `${grn.grn_no} / ${invoiceNo}` } },
      { op: 'inc', t: 'suppliers', id: grn.supplier_id, v: { balance: invoiceTotal } },
      auditOp('purchase_entry', `${grn.grn_no} inv ${invoiceNo} ${amt(invoiceTotal)}`),
    ]);
    await Data.loadSuppliers();
  },
  async savePurchaseReturn(supplierId, lines, note) {
    const total = r2(sum(lines, PL.total));
    const batches = await batchesFor(lines.filter((l) => l.item.track_batch).map((l) => l.item.id));
    const ops = [seqOp('pret', 'n'), {
      op: 'insert', t: 'purchase_returns', ref: 'r', v: { ret_no: docNoValue('pret', 'n'), supplier_id: supplierId, date: nowIso(), total, note, user_id: App.user.id },
    }];
    for (const l of lines) {
      if (l.qty <= 0) continue;
      ops.push({ op: 'insert', t: 'purchase_return_lines', v: { ret_id: { $ref: 'r' }, item_id: l.item.id, qty: PL.baseQty(l), cost: PL.baseCost(l), gst_rate: l.gstRate } });
      ops.push(...stockOps(l.item, -PL.baseQty(l), 'purchase_return', docNoValue('pret', 'n'), note, batches));
    }
    ops.push({ op: 'insert', t: 'supplier_ledger', v: { supplier_id: supplierId, date: nowIso(), type: 'return', amount: total, ref: docNoValue('pret', 'n'), note } });
    ops.push({ op: 'inc', t: 'suppliers', id: supplierId, v: { balance: -total } });
    ops.push(auditOp('purchase_return', amt(total)));
    const refs = await App.store.apply(ops);
    await Data.refreshItems(lines.map((l) => l.item.id));
    await Data.loadSuppliers();
    return docNo('pret', refs.n);
  },
  async purchaseReturns() {
    const rows = await App.store.select('purchase_returns', { order: [['id', 'desc']], limit: 300 });
    return rows.map((r) => ({ ...r, supplier_name: Data.supplier(r.supplier_id)?.name || '' }));
  },
  async priceComparison(itemId) {
    const lines = await App.store.select('grn_lines', { eq: { item_id: itemId } });
    if (!lines.length) return [];
    const grns = await App.store.select('grns', { in: { id: [...new Set(lines.map((l) => l.grn_id))] } });
    const gmap = new Map(grns.map((g) => [g.id, g]));
    const bySup = groupBy(lines, (l) => gmap.get(l.grn_id)?.supplier_id);
    const out = [];
    for (const [sid, ls] of bySup) {
      ls.sort((a, b) => b.grn_id - a.grn_id);
      out.push({
        supplier: Data.supplier(sid)?.name || '?', times: ls.length, last_cost: ls[0].cost,
        min_cost: Math.min(...ls.map((l) => toD(l.cost))), max_cost: Math.max(...ls.map((l) => toD(l.cost))),
        last_date: gmap.get(ls[0].grn_id)?.date,
      });
    }
    return out.sort((a, b) => a.last_cost - b.last_cost);
  },
};

// ---------- customers ----------
const Crm = {
  byPhone(phone) { const p = toS(phone).trim(); return p ? App.customers.find((c) => c.phone === p) || null : null; },
  search(q, opts = {}) {
    const s = toS(q).trim().toLowerCase();
    let list = App.customers;
    if (s) list = list.filter((c) => c.name.toLowerCase().includes(s) || toS(c.phone).includes(s));
    if (opts.dueOnly) list = list.filter((c) => toD(c.credit_balance) > 0.009).sort((a, b) => b.credit_balance - a.credit_balance);
    if (opts.birthdayMonth) {
      const m = two(new Date().getMonth() + 1);
      list = list.filter((c) => c.birthday && (c.birthday.substring(5, 7) === m || (c.birthday.length === 5 && c.birthday.substring(0, 2) === m)));
    }
    return list;
  },
  async save(c) {
    const v = {
      name: c.name, phone: toS(c.phone), gstin: toS(c.gstin), address: toS(c.address), price_list: c.price_list || 'retail',
      credit_limit: toD(c.credit_limit), birthday: toS(c.birthday),
    };
    if (c.id == null) {
      const refs = await App.store.apply([{ op: 'insert', t: 'customers', ref: 'c', v: { ...v, created_at: nowIso() } }]);
      return Data.refreshCustomer(refs.c);
    }
    await App.store.apply([{ op: 'update', t: 'customers', id: c.id, v }]);
    return Data.refreshCustomer(c.id);
  },
  history(id) { return App.store.select('sales', { eq: { customer_id: id }, order: [['id', 'desc']], limit: 300 }); },
  khata(id) { return App.store.select('khata', { eq: { customer_id: id }, order: [['id', 'desc']] }); },
  pointsLog(id) { return App.store.select('points_log', { eq: { customer_id: id }, order: [['id', 'desc']] }); },
  async receivePayment(c, amount, mode, note) {
    await App.store.apply([
      { op: 'insert', t: 'khata', v: { customer_id: c.id, date: nowIso(), type: 'payment', amount, mode, note: toS(note), user_id: App.user.id, shift_id: App.shiftId } },
      { op: 'inc', t: 'customers', id: c.id, v: { credit_balance: -amount } },
      auditOp('khata_payment', `${c.name} ${amt(amount)} ${mode}`),
    ]);
    return Data.refreshCustomer(c.id);
  },
  async adjustPoints(c, points, note) {
    const p = toD(c.points) + points < 0 ? -toD(c.points) : points;
    await App.store.apply([
      { op: 'inc', t: 'customers', id: c.id, v: { points: p } },
      { op: 'insert', t: 'points_log', v: { customer_id: c.id, date: nowIso(), points: p, note } },
      auditOp('points_adjust', `${c.name} ${qtyFmt(p)} ${note}`),
    ]);
    return Data.refreshCustomer(c.id);
  },
  reminderText(c) {
    const upi = App.s('upi_id');
    return `Dear ${c.name}, a friendly reminder from ${App.s('shop_name', 'our shop')}: your pending balance is Rs. ${amt(c.credit_balance)}.` +
      (upi ? ` You can pay by UPI to ${upi}.` : '') + ' Thank you!';
  },
};

// ---- reports.js ----
// ===== Reports (computed in the browser from the period's rows) =====

const sgn = (s) => (s.kind === 'return' ? -1 : 1);
async function salesIn(from, to, q = {}) {
  const [a, b] = dayRange(from, to);
  return App.store.select('sales', { ...q, gte: { date: a }, lt: { date: b }, order: [['id', 'asc']] });
}
async function linesOf(sales) { return sales.length ? App.store.select('sale_lines', { in: { sale_id: sales.map((s) => s.id) } }) : []; }
async function paysOf(sales) { return sales.length ? App.store.select('payments', { in: { sale_id: sales.map((s) => s.id) } }) : []; }
const pct = (a, b) => (b > 0 ? `${(a / b * 100).toFixed(1)}%` : '');
const R = (columns, rows, totals, numeric) => ({ columns, rows, totals: totals || null, numeric: new Set(numeric || []) });

const Reports = {
  list: [
    { id: 'daily', title: 'Daily sales summary', async run(f, t) {
      const sales = await salesIn(f, t, { eq: { status: 'completed' } });
      const by = groupBy(sales, (s) => isoDate(new Date(s.date)));
      const rows = []; const T = [0, 0, 0, 0, 0];
      for (const [d, list] of [...by.entries()].sort()) {
        const bills = list.filter((s) => s.kind === 'sale');
        const sl = sum(bills, (s) => s.total), rt = sum(list.filter((s) => s.kind === 'return'), (s) => s.total);
        const tx = sum(list.filter((s) => s.kind !== 'voucher'), (s) => sgn(s) * s.taxable);
        const gst = sum(list.filter((s) => s.kind !== 'voucher'), (s) => sgn(s) * (s.cgst + s.sgst + s.igst));
        T[0] += bills.length; T[1] += sl; T[2] += rt; T[3] += tx; T[4] += gst;
        rows.push([dateFmt(d), String(bills.length), amt(sl), amt(rt), amt(sl - rt), amt(tx), amt(gst), amt(bills.length ? sl / bills.length : 0)]);
      }
      return R(['Date', 'Bills', 'Sales', 'Returns', 'Net sales', 'Taxable', 'GST', 'Avg bill'], rows,
        ['Total', String(T[0]), amt(T[1]), amt(T[2]), amt(T[1] - T[2]), amt(T[3]), amt(T[4]), amt(T[0] ? T[1] / T[0] : 0)], [1, 2, 3, 4, 5, 6, 7]);
    } },
    { id: 'bills', title: 'Bill register', async run(f, t) {
      const sales = await salesIn(f, t);
      const pays = groupBy(await paysOf(sales), (p) => p.sale_id);
      let total = 0;
      const rows = sales.map((s) => {
        const signed = sgn(s) * s.total;
        if (s.status === 'completed' && s.kind !== 'voucher') total += signed;
        return [s.bill_no, dateTimeFmt(s.date), ({ return: 'Return', voucher: 'Gift voucher' })[s.kind] || 'Sale',
          Data.customer(s.customer_id)?.name || '', Data.userName(s.user_id),
          (pays.get(s.id) || []).map((p) => `${p.mode} ${amt(p.amount)}`).join(', '), s.status, amt(signed)];
      });
      return R(['Bill no', 'Date', 'Type', 'Customer', 'Cashier', 'Payments', 'Status', 'Amount'], rows, ['Total', '', '', '', '', '', '', amt(total)], [7]);
    } },
    { id: 'modes', title: 'Payment-mode summary', async run(f, t) {
      const sales = await salesIn(f, t, { eq: { status: 'completed' } });
      const kind = new Map(sales.map((s) => [s.id, s.kind]));
      const pays = await paysOf(sales);
      const [a, b] = dayRange(f, t);
      const kh = await App.store.select('khata', { eq: { type: 'payment' }, gte: { date: a }, lt: { date: b } });
      const modes = new Map();
      const get = (m) => { if (!modes.has(m)) modes.set(m, { bills: new Set(), rec: 0, ref: 0, kh: 0 }); return modes.get(m); };
      for (const p of pays) {
        const x = get(p.mode); x.bills.add(p.sale_id);
        if (kind.get(p.sale_id) === 'return') x.ref += toD(p.amount); else x.rec += toD(p.amount);
      }
      for (const k of kh) if (['cash', 'upi', 'card', 'wallet', 'bank'].includes(k.mode)) get(k.mode).kh += toD(k.amount);
      const T = [0, 0, 0];
      const rows = [...modes.entries()].sort((x, y) => y[1].rec - x[1].rec).map(([m, x]) => {
        T[0] += x.rec; T[1] += x.ref; T[2] += x.kh;
        return [tr(modeLabel(m)), String(x.bills.size), amt(x.rec), amt(x.ref), amt(x.kh), amt(x.rec - x.ref + x.kh)];
      });
      return R(['Mode', 'Bills', 'Received', 'Refunded', 'Khata collected', 'Net'], rows, ['Total', '', amt(T[0]), amt(T[1]), amt(T[2]), amt(T[0] - T[1] + T[2])], [1, 2, 3, 4, 5]);
    } },
    { id: 'items', title: 'Item-wise sales and margin', ownerOnly: true, async run(f, t) {
      const sales = await salesIn(f, t, { eq: { status: 'completed' } });
      const sm = new Map(sales.map((s) => [s.id, s]));
      const lines = await linesOf(sales);
      const by = groupBy(lines, (l) => `${l.item_id}|${l.name}`);
      const T = [0, 0, 0, 0];
      const rows = [...by.values()].map((ls) => {
        const q = sum(ls, (l) => sgn(sm.get(l.sale_id)) * l.qty), tx = sum(ls, (l) => sgn(sm.get(l.sale_id)) * l.taxable);
        const tot = sum(ls, (l) => sgn(sm.get(l.sale_id)) * l.total), cost = sum(ls, (l) => sgn(sm.get(l.sale_id)) * l.qty * l.cost);
        T[0] += q; T[1] += tx; T[2] += tot; T[3] += cost;
        return { tot, row: [App.itemMap.get(ls[0].item_id)?.code || '', ls[0].name, qtyFmt(q), amt(tx), amt(tot), amt(cost), amt(tx - cost), pct(tx - cost, tx)] };
      }).sort((a, b) => b.tot - a.tot).map((x) => x.row);
      return R(['Code', 'Item', 'Qty', 'Taxable', 'Sales', 'Cost', 'Margin', 'Margin %'], rows,
        ['Total', '', qtyFmt(T[0]), amt(T[1]), amt(T[2]), amt(T[3]), amt(T[1] - T[3]), pct(T[1] - T[3], T[1])], [2, 3, 4, 5, 6, 7]);
    } },
    { id: 'category', title: 'Category-wise sales', async run(f, t) {
      const sales = await salesIn(f, t, { eq: { status: 'completed' } });
      const sm = new Map(sales.map((s) => [s.id, s]));
      const lines = await linesOf(sales);
      const by = groupBy(lines, (l) => App.itemMap.get(l.item_id)?.category || 'Uncategorised');
      const grand = sum(lines, (l) => sgn(sm.get(l.sale_id)) * l.total);
      const rows = [...by.entries()].map(([c, ls]) => {
        const tot = sum(ls, (l) => sgn(sm.get(l.sale_id)) * l.total);
        return { tot, row: [c, qtyFmt(sum(ls, (l) => sgn(sm.get(l.sale_id)) * l.qty)), amt(tot), pct(tot, grand)] };
      }).sort((a, b) => b.tot - a.tot).map((x) => x.row);
      return R(['Category', 'Qty', 'Sales', 'Share'], rows, ['Total', '', amt(grand), '100%'], [1, 2, 3]);
    } },
    { id: 'gst_rate', title: 'GST summary by rate (GSTR-3B)', async run(f, t) {
      const sales = (await salesIn(f, t, { eq: { status: 'completed' } })).filter((s) => s.kind !== 'voucher');
      const sm = new Map(sales.map((s) => [s.id, s]));
      const by = groupBy(await linesOf(sales), (l) => toD(l.gst_rate));
      const T = [0, 0, 0];
      const rows = [...by.entries()].sort((a, b) => a[0] - b[0]).map(([rate, ls]) => {
        const tx = sum(ls, (l) => sgn(sm.get(l.sale_id)) * l.taxable);
        const tax = sum(ls, (l) => sgn(sm.get(l.sale_id)) * l.tax);
        const ig = sum(ls.filter((l) => sm.get(l.sale_id).interstate === 1), (l) => sgn(sm.get(l.sale_id)) * l.tax);
        const loc = tax - ig;
        T[0] += tx; T[1] += loc; T[2] += ig;
        return [`${qtyFmt(rate)}%`, amt(tx), amt(loc / 2), amt(loc / 2), amt(ig), amt(tax)];
      });
      return R(['GST rate', 'Taxable', 'CGST', 'SGST', 'IGST', 'Total GST'], rows, ['Total', amt(T[0]), amt(T[1] / 2), amt(T[1] / 2), amt(T[2]), amt(T[1] + T[2])], [1, 2, 3, 4, 5]);
    } },
    { id: 'hsn', title: 'HSN summary (GSTR-1)', async run(f, t) {
      const sales = (await salesIn(f, t, { eq: { status: 'completed' } })).filter((s) => s.kind !== 'voucher');
      const sm = new Map(sales.map((s) => [s.id, s]));
      const by = groupBy(await linesOf(sales), (l) => `${l.hsn || '-'}|${l.unit}|${toD(l.gst_rate)}`);
      const rows = [...by.entries()].sort().map(([k, ls]) => {
        const [hsn, unit, rate] = k.split('|');
        const g = (fn) => sum(ls, (l) => sgn(sm.get(l.sale_id)) * fn(l));
        return [hsn, unit.toUpperCase(), `${rate}%`, qtyFmt(g((l) => l.qty)), amt(g((l) => l.total)), amt(g((l) => l.taxable)), amt(g((l) => l.tax))];
      });
      return R(['HSN', 'UQC', 'Rate', 'Qty', 'Total value', 'Taxable', 'Tax'], rows, null, [3, 4, 5, 6]);
    } },
    { id: 'b2b', title: 'B2B invoices (customers with GSTIN)', async run(f, t) {
      const sales = (await salesIn(f, t, { eq: { status: 'completed' } })).filter((s) => s.kind !== 'voucher' && Data.customer(s.customer_id)?.gstin);
      const rows = sales.map((s) => {
        const c = Data.customer(s.customer_id);
        return [s.bill_no, dateFmt(s.date), c.name, c.gstin, s.kind === 'return' ? 'Credit note' : 'Invoice', amt(s.taxable), amt(s.cgst), amt(s.sgst), amt(s.igst), amt(s.total)];
      });
      return R(['Invoice', 'Date', 'Customer', 'GSTIN', 'Type', 'Taxable', 'CGST', 'SGST', 'IGST', 'Total'], rows, null, [5, 6, 7, 8, 9]);
    } },
    { id: 'cashier', title: 'Cashier-wise sales', async run(f, t) {
      const sales = (await salesIn(f, t)).filter((s) => s.kind !== 'voucher');
      const by = groupBy(sales, (s) => s.user_id);
      const rows = [...by.entries()].map(([u, ls]) => [Data.userName(u),
        String(ls.filter((s) => s.kind === 'sale' && s.status === 'completed').length),
        amt(sum(ls.filter((s) => s.status === 'completed'), (s) => sgn(s) * s.total)),
        String(ls.filter((s) => s.kind === 'return' && s.status === 'completed').length),
        String(ls.filter((s) => s.status === 'void').length),
        amt(sum(ls.filter((s) => s.kind === 'sale'), (s) => s.line_discount + s.bill_discount))]);
      return R(['Cashier', 'Bills', 'Net sales', 'Returns', 'Cancelled', 'Manual discounts'], rows, null, [1, 2, 3, 4, 5]);
    } },
    { id: 'hourly', title: 'Hour-wise sales', async run(f, t) {
      const sales = await salesIn(f, t, { eq: { status: 'completed', kind: 'sale' } });
      const by = groupBy(sales, (s) => new Date(s.date).getHours());
      const lbl = (h) => `${h % 12 || 12} ${h < 12 ? 'AM' : 'PM'}`;
      const rows = [...by.entries()].sort((a, b) => a[0] - b[0]).map(([h, ls]) => [`${lbl(h)} - ${lbl((h + 1) % 24)}`, String(ls.length), amt(sum(ls, (s) => s.total))]);
      return R(['Hour', 'Bills', 'Sales'], rows, null, [1, 2]);
    } },
    { id: 'discounts', title: 'Discounts and offers given', async run(f, t) {
      const sales = await salesIn(f, t, { eq: { status: 'completed', kind: 'sale' } });
      const lines = (await linesOf(sales)).filter((l) => toD(l.discount) > 0);
      const by = groupBy(lines, (l) => l.offer_name || 'Manual / bill discount');
      let total = 0;
      const rows = [...by.entries()].map(([n, ls]) => {
        const d = sum(ls, (l) => l.discount); total += d;
        return { d, row: [n, String(new Set(ls.map((l) => l.sale_id)).size), amt(d)] };
      }).sort((a, b) => b.d - a.d).map((x) => x.row);
      return R(['Offer', 'Bills', 'Discount given'], rows, ['Total', '', amt(total)], [1, 2]);
    } },
    { id: 'fast', title: 'Fast-moving items', async run(f, t) {
      const [a, b] = dayRange(f, t);
      const days = Math.round((startOfDay(t) - startOfDay(f)) / 86400000) + 1;
      const moves = await App.store.select('stock_moves', { eq: { type: 'sale' }, gte: { date: a }, lt: { date: b } });
      const by = groupBy(moves, (m) => m.item_id);
      const rows = [...by.entries()].map(([id, ms]) => {
        const it = App.itemMap.get(id) || {};
        const sold = -sum(ms, (m) => m.qty), daily = sold / days;
        return { sold, row: [it.code || '', it.name || '?', qtyFmt(sold), qtyFmt(r2(daily)), qtyFmt(it.stock), daily > 0 ? (toD(it.stock) / daily).toFixed(0) : '-'] };
      }).sort((x, y) => y.sold - x.sold).slice(0, 100).map((x) => x.row);
      return R(['Code', 'Item', 'Sold', 'Per day', 'In stock', 'Days of cover'], rows, null, [2, 3, 4, 5]);
    } },
    { id: 'valuation', title: 'Stock valuation', usesDates: false, ownerOnly: true, async run() {
      const list = App.items.filter((i) => i.active && toD(i.stock) !== 0).sort((a, b) => b.stock * b.cost - a.stock * a.cost);
      const v = sum(list, (i) => i.stock * i.cost), rv = sum(list, (i) => i.stock * i.price_retail);
      const rows = list.map((i) => [i.code, i.name, i.category, `${qtyFmt(i.stock)} ${i.unit}`, amt(i.cost), amt(i.stock * i.cost), amt(i.stock * i.price_retail)]);
      return R(['Code', 'Item', 'Category', 'Stock', 'Cost', 'Value at cost', 'Value at retail'], rows, ['Total', '', '', '', '', amt(v), amt(rv)], [4, 5, 6]);
    } },
    { id: 'khata', title: 'Khata outstanding', usesDates: false, async run() {
      const list = Crm.search('', { dueOnly: true });
      const kh = await App.store.select('khata', { eq: { type: 'payment' }, in: { customer_id: list.map((c) => c.id) } });
      const last = new Map();
      for (const k of kh) if (!last.has(k.customer_id) || last.get(k.customer_id) < k.date) last.set(k.customer_id, k.date);
      const rows = list.map((c) => [c.name, c.phone, last.has(c.id) ? dateFmt(last.get(c.id)) : '', amt(c.credit_balance)]);
      return R(['Customer', 'Phone', 'Last payment', 'Balance due'], rows, ['Total', '', '', amt(sum(list, (c) => c.credit_balance))], [3]);
    } },
    { id: 'supplier_due', title: 'Supplier outstanding', usesDates: false, async run() {
      const list = App.suppliers.filter((s) => Math.abs(toD(s.balance)) > 0.009).sort((a, b) => b.balance - a.balance);
      return R(['Supplier', 'Phone', 'Payable'], list.map((s) => [s.name, s.phone, amt(s.balance)]), ['Total', '', amt(sum(list, (s) => s.balance))], [2]);
    } },
    { id: 'purchases', title: 'Purchase register', async run(f, t) {
      const [a, b] = dayRange(f, t);
      const grns = await App.store.select('grns', { gte: { date: a }, lt: { date: b }, order: [['id', 'asc']] });
      const rows = grns.map((g) => [g.grn_no, dateFmt(g.date), Data.supplier(g.supplier_id)?.name || '', g.invoice_no, g.status === 'posted' ? 'Posted' : 'Pending entry', amt(g.taxable), amt(g.tax), amt(g.total)]);
      return R(['GRN', 'Date', 'Supplier', 'Invoice', 'Status', 'Taxable', 'GST', 'Total'], rows,
        ['Total', '', '', '', '', amt(sum(grns, (g) => g.taxable)), amt(sum(grns, (g) => g.tax)), amt(sum(grns, (g) => g.total))], [5, 6, 7]);
    } },
    { id: 'cancelled', title: 'Cancelled bills', async run(f, t) {
      const sales = await salesIn(f, t, { eq: { status: 'void' } });
      return R(['Bill no', 'Date', 'Billed by', 'Reason', 'Amount'], sales.map((s) => [s.bill_no, dateTimeFmt(s.date), Data.userName(s.user_id), s.note, amt(s.total)]), null, [4]);
    } },
    { id: 'shifts', title: 'Shift closing report', async run(f, t) {
      const [a, b] = dayRange(f, t);
      const list = await App.store.select('shifts', { gte: { opened_at: a }, lt: { opened_at: b }, order: [['id', 'asc']] });
      const rows = list.map((s) => {
        const closed = s.status === 'closed';
        return [Data.userName(s.user_id), dateTimeFmt(s.opened_at), closed ? dateTimeFmt(s.closed_at) : 'Open', amt(s.opening_cash),
          closed ? amt(s.expected_cash) : '', closed ? amt(s.closing_cash) : '', closed ? amt(s.closing_cash - s.expected_cash) : ''];
      });
      return R(['Cashier', 'Opened', 'Closed', 'Opening cash', 'Expected', 'Counted', 'Difference'], rows, null, [3, 4, 5, 6]);
    } },
    { id: 'purchase_gst', title: 'Purchase GST (input tax credit)', async run(f, t) {
      const m = await Reports.inputByRate(f, t);
      const T = [0, 0, 0, 0];
      const rows = [...m.entries()].sort((a, b) => a[0] - b[0]).map(([rate, v]) => {
        v.forEach((x, i) => { T[i] += x; });
        return [`${qtyFmt(rate)}%`, amt(v[0]), amt(v[1]), amt(v[2]), amt(v[3]), amt(v[1] + v[2] + v[3])];
      });
      return R(['GST rate', 'Taxable', 'CGST', 'SGST', 'IGST', 'Input GST'], rows, ['Total', amt(T[0]), amt(T[1]), amt(T[2]), amt(T[3]), amt(T[1] + T[2] + T[3])], [1, 2, 3, 4, 5]);
    } },
    { id: 'gst_net', title: 'GST payable (output - input)', async run(f, t) {
      const sales = (await salesIn(f, t, { eq: { status: 'completed' } })).filter((s) => s.kind !== 'voucher');
      const oc = sum(sales, (s) => sgn(s) * s.cgst), os = sum(sales, (s) => sgn(s) * s.sgst), oi = sum(sales, (s) => sgn(s) * s.igst);
      let ic = 0, is = 0, ii = 0;
      for (const v of (await Reports.inputByRate(f, t)).values()) { ic += v[1]; is += v[2]; ii += v[3]; }
      return R(['Head', 'CGST', 'SGST', 'IGST', 'Total'], [
        ['Output GST (sales)', amt(oc), amt(os), amt(oi), amt(oc + os + oi)],
        ['Input GST (purchases)', amt(ic), amt(is), amt(ii), amt(ic + is + ii)],
      ], ['Net payable (estimate)', amt(oc - ic), amt(os - is), amt(oi - ii), amt(oc + os + oi - ic - is - ii)], [1, 2, 3, 4]);
    } },
    { id: 'salesperson', title: 'Salesperson-wise sales and commission', async run(f, t) {
      const p = App.d('commission_pct', 0);
      const sales = (await salesIn(f, t, { eq: { status: 'completed' } })).filter((s) => s.kind !== 'voucher');
      const by = groupBy(sales, (s) => s.salesperson || '(not set)');
      let tot = 0, com = 0;
      const rows = [...by.entries()].map(([sp, ls]) => {
        const tx = sum(ls, (s) => sgn(s) * s.taxable), net = sum(ls, (s) => sgn(s) * s.total);
        const c = sp === '(not set)' ? 0 : tx * p / 100;
        tot += net; com += c;
        return [sp, String(ls.filter((s) => s.kind === 'sale').length), amt(tx), amt(net), amt(c)];
      });
      return R(['Salesperson', 'Bills', 'Taxable', 'Net sales', `Commission (${qtyFmt(p)}%)`], rows, ['Total', '', '', amt(tot), amt(com)], [1, 2, 3, 4]);
    } },
    { id: 'expenses', title: 'Expense register', async run(f, t) {
      const list = (await Expenses.list(f, t)).reverse();
      return R(['Date', 'Category', 'Mode', 'Note', 'Entered by', 'Amount'],
        list.map((e) => [dateFmt(e.date), e.category, e.mode, e.note, Data.userName(e.user_id), amt(e.amount)]),
        ['Total', '', '', '', '', amt(sum(list, (e) => e.amount))], [5]);
    } },
    { id: 'pnl', title: 'Profit and loss (estimate)', ownerOnly: true, async run(f, t) {
      const sales = await salesIn(f, t, { eq: { status: 'completed' } });
      const sm = new Map(sales.map((s) => [s.id, s]));
      const lines = await linesOf(sales);
      const net = sum(lines, (l) => sgn(sm.get(l.sale_id)) * l.taxable);
      const cogs = sum(lines, (l) => sgn(sm.get(l.sale_id)) * l.qty * l.cost);
      const [a, b] = dayRange(f, t);
      const moves = await App.store.select('stock_moves', { in: { type: ['damage', 'expiry', 'lost', 'own_use'] }, gte: { date: a }, lt: { date: b } });
      const writeOff = sum(moves, (m) => -m.qty * toD(App.itemMap.get(m.item_id)?.cost));
      const exp = groupBy(await Expenses.list(f, t), (e) => e.category);
      const expRows = [...exp.entries()].map(([c, ls]) => [c, sum(ls, (e) => e.amount)]).sort((x, y) => y[1] - x[1]);
      const totalExp = sum(expRows, (x) => x[1]);
      return R(['Head', 'Amount'], [
        ['Net sales (excluding GST)', amt(net)],
        ['Less: cost of goods sold', amt(cogs)],
        ['Gross profit', amt(net - cogs)],
        ['Less: stock written off (damage, expiry, lost)', amt(writeOff)],
        ...expRows.map(([c, v]) => [`Less: ${c}`, amt(v)]),
      ], ['Net profit (estimate)', amt(net - cogs - writeOff - totalExp)], [1]);
    } },
    { id: 'vouchers', title: 'Gift vouchers and store credit outstanding', usesDates: false, async run() {
      const list = await App.store.select('coupons', { eq: { kind: 'voucher' }, gt: { balance: 0.009 }, order: [['expiry', 'asc']] });
      const today = isoDate();
      let total = 0;
      const rows = list.map((c) => {
        const expired = c.expiry && today > c.expiry;
        if (!expired) total += toD(c.balance);
        return [c.code, c.code.startsWith('SC') ? 'Store credit' : 'Gift voucher', Data.customer(c.customer_id)?.name || '', dateFmt(c.created_at), c.expiry, expired ? 'Expired' : 'Active', amt(c.value), amt(c.balance)];
      });
      return R(['Code', 'Type', 'Customer', 'Issued', 'Valid until', 'Status', 'Value', 'Balance'], rows, ['Active balance', '', '', '', '', '', '', amt(total)], [6, 7]);
    } },
    { id: 'audit', title: 'Audit trail', async run(f, t) {
      const [a, b] = dayRange(f, t);
      const list = await App.store.select('audit_log', { gte: { date: a }, lt: { date: b }, order: [['id', 'desc']], limit: 3000 });
      return R(['When', 'User', 'Action', 'Detail'], list.map((x) => [dateTimeFmt(x.date), Data.userName(x.user_id), x.action, x.detail]));
    } },
  ],

  /** Input GST by rate from posted purchases minus purchase returns. */
  async inputByRate(f, t) {
    const [a, b] = dayRange(f, t);
    const state = (g) => (toS(g).trim().length >= 2 ? g.trim().substring(0, 2) : '');
    const shop = state(App.s('shop_gstin'));
    const out = new Map();
    const add = (rate, taxable, supId, sign) => {
      const tax = taxable * rate / 100;
      const sup = state(Data.supplier(supId)?.gstin);
      const inter = shop && sup && sup !== shop;
      if (!out.has(rate)) out.set(rate, [0, 0, 0, 0]);
      const v = out.get(rate);
      v[0] += sign * taxable;
      if (inter) v[3] += sign * tax; else { v[1] += sign * tax / 2; v[2] += sign * tax / 2; }
    };
    const grns = await App.store.select('grns', { eq: { status: 'posted' }, gte: { date: a }, lt: { date: b } });
    const gl = grns.length ? await App.store.select('grn_lines', { in: { grn_id: grns.map((g) => g.id) } }) : [];
    const gm = new Map(grns.map((g) => [g.id, g]));
    for (const l of gl) add(toD(l.gst_rate), l.qty * l.cost, gm.get(l.grn_id).supplier_id, 1);
    const rets = await App.store.select('purchase_returns', { gte: { date: a }, lt: { date: b } });
    const rl = rets.length ? await App.store.select('purchase_return_lines', { in: { ret_id: rets.map((r) => r.id) } }) : [];
    const rm = new Map(rets.map((r) => [r.id, r]));
    for (const l of rl) add(toD(l.gst_rate), l.qty * l.cost, rm.get(l.ret_id).supplier_id, -1);
    return out;
  },

  // ---------- dashboard ----------
  async today() {
    const d = new Date();
    const sales = await salesIn(d, d);
    const ok = sales.filter((s) => s.status === 'completed');
    const bills = ok.filter((s) => s.kind === 'sale');
    const out = {
      bills: bills.length, sales: sum(bills, (s) => s.total), returns: sum(ok.filter((s) => s.kind === 'return'), (s) => s.total),
      cancelled: sales.filter((s) => s.status === 'void').length, vouchers: sum(ok.filter((s) => s.kind === 'voucher'), (s) => s.total),
    };
    for (const p of await paysOf(bills)) out[`mode_${p.mode}`] = (out[`mode_${p.mode}`] || 0) + toD(p.amount);
    const sm = new Map(ok.map((s) => [s.id, s]));
    const lines = await linesOf(ok.filter((s) => s.kind !== 'voucher'));
    out.profit = sum(lines, (l) => sgn(sm.get(l.sale_id)) * (l.taxable - l.qty * l.cost));
    out.top = [...groupBy(lines.filter((l) => sm.get(l.sale_id).kind === 'sale'), (l) => l.name).entries()]
      .map(([name, ls]) => ({ name, qty: sum(ls, (l) => l.qty), total: sum(ls, (l) => l.total) }))
      .sort((a, b) => b.total - a.total).slice(0, 8);
    out.khata = sum(App.customers.filter((c) => c.credit_balance > 0), (c) => c.credit_balance);
    out.low = Inventory.lowStock().length;
    out.expiring = (await Inventory.expiring(30)).length;
    out.expenses = sum(await Expenses.list(d, d), (e) => e.amount);
    return out;
  },
  async last7() {
    const from = addDays(new Date(), -6);
    const sales = await salesIn(from, new Date(), { eq: { status: 'completed' } });
    const out = [];
    for (let i = 0; i < 7; i++) {
      const day = isoDate(addDays(from, i));
      const ls = sales.filter((s) => isoDate(new Date(s.date)) === day && s.kind !== 'voucher');
      out.push({ d: day, net: sum(ls, (s) => sgn(s) * s.total) });
    }
    return out;
  },
  async alerts() {
    const list = await App.store.select('audit_log', { in: { action: ['bill_cancel', 'return', 'discount', 'stock_damage', 'stock_audit', 'cash_out', 'bulk_price'] }, order: [['id', 'desc']], limit: 15 });
    return list.map((a) => ({ ...a, uname: Data.userName(a.user_id) }));
  },
  async daySummaryText() {
    const st = await Reports.today();
    const low = Inventory.lowStock().slice(0, 15);
    const lines = [
      `*${App.s('shop_name', 'KadaiBill')}* - ${dateFmt(new Date())}`,
      `Bills: ${st.bills}`,
      `Net sales: Rs. ${amt(st.sales - st.returns)}`,
      `Cash: Rs. ${amt(st.mode_cash || 0)} | UPI: Rs. ${amt(st.mode_upi || 0)} | Card: Rs. ${amt(st.mode_card || 0)}`,
      `Khata given: Rs. ${amt(st.mode_credit || 0)}`,
      `Returns: Rs. ${amt(st.returns)}`,
    ];
    if (st.vouchers) lines.push(`Gift vouchers sold: Rs. ${amt(st.vouchers)}`);
    if (st.expenses) lines.push(`Expenses: Rs. ${amt(st.expenses)}`);
    lines.push(`Gross profit (est.): Rs. ${amt(st.profit)}`);
    if (st.cancelled) lines.push(`Cancelled bills: ${st.cancelled}`);
    lines.push(`Khata outstanding: Rs. ${amt(st.khata)}`);
    if (st.top.length) lines.push('', `Top items: ${st.top.slice(0, 5).map((t) => `${t.name} (${qtyFmt(t.qty)})`).join(', ')}`);
    if (low.length) lines.push('', `Low stock: ${low.map((i) => `${i.name} (${qtyFmt(i.stock)})`).join(', ')}`);
    return lines.join('\n');
  },
  lowStockText() {
    const low = Inventory.lowStock();
    const out = [`*${App.s('shop_name', 'KadaiBill')}* - low stock ${dateFmt(new Date())}`];
    for (const i of low) out.push(`- ${i.name} (${i.code}): ${qtyFmt(i.stock)} ${i.unit}, reorder at ${qtyFmt(i.reorder_level)}`);
    if (!low.length) out.push('All items are above reorder level.');
    return out.join('\n');
  },
};

// ---- dataio.js ----
// ===== Excel import/export and backup/restore =====

function downloadBlob(name, blob) {
  if (KB_DEMO) { toast(tr('Downloads work in the hosted version of KadaiBill, not in this demo.'), true); return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

function writeXlsx(name, sheets) {
  const wb = XLSX.utils.book_new();
  for (const [title, rows] of sheets) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), title.substring(0, 31));
  XLSX.writeFile(wb, name);
}

/** Reads the first sheet of an Excel/CSV file as rows of strings. */
async function readSheet(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array' });
  const ws = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false, blankrows: false })
    .map((r) => r.map((c) => toS(c).trim()))
    .filter((r) => r.some((c) => c));
}

const headerKey = (h) => toS(h).toLowerCase().replace(/[^a-z0-9%]/g, '');

const ImportExport = {
  itemColumns: {
    code: ['code', 'barcode', 'itemcode', 'sku', 'productcode'],
    name: ['name', 'itemname', 'productname', 'item', 'product', 'description'],
    name_ta: ['nameta', 'tamilname', 'nametamil', 'itemnametamil'],
    category: ['category', 'group', 'department', 'itemgroup'],
    hsn: ['hsn', 'hsncode', 'hsnsac', 'sac'],
    unit: ['unit', 'uom', 'units'],
    gst_rate: ['gstrate', 'gst', 'gst%', 'gstpercent', 'tax', 'taxrate', 'tax%'],
    mrp: ['mrp'],
    price_retail: ['priceretail', 'sellingprice', 'saleprice', 'retailprice', 'price', 'rate', 'salesrate'],
    price_wholesale: ['pricewholesale', 'wholesaleprice', 'wholesale', 'wholesalerate'],
    price_member: ['pricemember', 'memberprice', 'member'],
    cost: ['cost', 'purchaseprice', 'costprice', 'purchaserate', 'landingcost'],
    tax_inclusive: ['taxinclusive', 'priceincludesgst', 'inclusive', 'inclusiveoftax'],
    stock: ['stock', 'openingstock', 'qty', 'quantity', 'closingstock', 'currentstock'],
    reorder_level: ['reorderlevel', 'minstock', 'reorder', 'minimumstock'],
    size: ['size'], color: ['color', 'colour'], style: ['style', 'design'],
    pack_qty: ['packqty', 'piecesperpack', 'packsize', 'pack'],
    purchase_unit: ['purchaseunit', 'packunit'],
    favourite: ['favourite', 'favorite', 'quick', 'quickitem'],
  },
  customerColumns: {
    name: ['name', 'customername', 'customer', 'partyname'],
    phone: ['phone', 'mobile', 'mobilenumber', 'phonenumber', 'contact', 'whatsapp'],
    gstin: ['gstin', 'gst', 'gstno', 'gstnumber'],
    address: ['address', 'city', 'area'],
    price_list: ['pricelist', 'pricetype', 'customertype'],
    credit_limit: ['creditlimit', 'limit'],
    birthday: ['birthday', 'dob', 'dateofbirth'],
    balance: ['balance', 'openingbalance', 'due', 'outstanding', 'khata'],
    points: ['points', 'loyaltypoints'],
  },
  mapHeaders(header, columns) {
    const keys = header.map(headerKey);
    const out = {};
    for (const f in columns) {
      for (const n of columns[f]) { const i = keys.indexOf(n); if (i >= 0) { out[f] = i; break; } }
    }
    return out;
  },
  yes: (v) => ['1', 'y', 'yes', 'true', 'inclusive', 'incl'].includes(toS(v).trim().toLowerCase()),

  /** Adds or updates items. Sends work in batches so large files are quick. */
  async importItems(rows, { updateExisting = true, setStock = false, onProgress } = {}) {
    const res = { added: 0, updated: 0, skipped: 0, errors: [] };
    if (rows.length < 2) { res.errors.push('The file has no data rows.'); return res; }
    const cols = ImportExport.mapHeaders(rows[0], ImportExport.itemColumns);
    if (!('name' in cols)) { res.errors.push('No "Name" column found. Download the template to see the column names.'); return res; }
    const has = (f) => f in cols;
    const cell = (r, f) => (has(f) && cols[f] < r.length ? toS(r[cols[f]]).trim() : '');
    let next = parseInt(Inventory.nextCode(), 10);
    const seen = new Set();
    let ops = [];
    let n = 0;
    const flush = async () => {
      if (!ops.length) return;
      await App.store.apply(ops);
      ops = [];
    };
    for (let i = 1; i < rows.length; i++) {
      const r = rows[i];
      const name = cell(r, 'name');
      if (!name) { res.skipped++; continue; }
      let code = cell(r, 'code');
      if (code && seen.has(code)) { res.errors.push(`Row ${i + 1} (${name}): code ${code} appears twice in the file`); res.skipped++; continue; }
      const existing = code ? App.items.find((x) => x.code === code) : null;
      if (existing && !updateExisting) { res.skipped++; continue; }
      if (!code) code = String(next++);
      seen.add(code);
      const v = {};
      v.code = code; v.name = name;
      for (const f of ['name_ta', 'category', 'hsn', 'size', 'color', 'style', 'purchase_unit']) if (has(f)) v[f] = cell(r, f);
      if (has('unit') && cell(r, 'unit')) v.unit = cell(r, 'unit').toLowerCase();
      for (const f of ['gst_rate', 'mrp', 'price_retail', 'price_wholesale', 'price_member', 'cost', 'reorder_level']) if (has(f)) v[f] = toD(cell(r, f));
      if (has('pack_qty') && toD(cell(r, 'pack_qty')) > 0) v.pack_qty = toD(cell(r, 'pack_qty'));
      if (has('tax_inclusive') && cell(r, 'tax_inclusive')) v.tax_inclusive = ImportExport.yes(cell(r, 'tax_inclusive')) ? 1 : 0;
      if (has('favourite') && cell(r, 'favourite')) v.favourite = ImportExport.yes(cell(r, 'favourite')) ? 1 : 0;
      const retail = v.price_retail ?? toD(existing?.price_retail);
      const mrp = v.mrp ?? toD(existing?.mrp);
      if (retail <= 0 && mrp > 0) v.price_retail = mrp;
      if ((v.price_retail ?? retail) <= 0) { res.errors.push(`Row ${i + 1} (${name}): no selling price`); res.skipped++; continue; }
      if (mrp > 0 && (v.price_retail ?? retail) > mrp) v.mrp = v.price_retail ?? retail;
      v.active = 1;
      const qty = toD(cell(r, 'stock'));
      if (!existing) {
        const ref = `i${n++}`;
        ops.push({ op: 'insert', t: 'items', ref, v: { unit: 'pcs', ...v, stock: 0, created_at: nowIso() } });
        if (has('stock') && qty) {
          ops.push({ op: 'inc', t: 'items', id: { $ref: ref }, v: { stock: qty } });
          ops.push({ op: 'insert', t: 'stock_moves', v: { item_id: { $ref: ref }, date: nowIso(), type: 'opening', qty, ref: 'Import', user_id: App.user?.id ?? null, note: 'Opening stock (import)' } });
        }
        res.added++;
      } else {
        ops.push({ op: 'update', t: 'items', id: existing.id, v });
        if (setStock && has('stock')) {
          const delta = r2(qty - toD(existing.stock));
          if (Math.abs(delta) > 0.0005) {
            ops.push({ op: 'inc', t: 'items', id: existing.id, v: { stock: delta } });
            ops.push({ op: 'insert', t: 'stock_moves', v: { item_id: existing.id, date: nowIso(), type: 'audit', qty: delta, ref: 'Import', user_id: App.user?.id ?? null, note: 'Stock from import file' } });
          }
        }
        res.updated++;
      }
      if (ops.length >= 300) {
        try { await flush(); } catch (e) { res.errors.push(`Rows up to ${i + 1}: ${e.message}`); ops = []; }
        onProgress?.(i, rows.length);
      }
    }
    try { await flush(); } catch (e) { res.errors.push(`Last rows: ${e.message}`); }
    await audit('import_items', `added ${res.added} updated ${res.updated} skipped ${res.skipped}`);
    await Data.loadItems();
    return res;
  },

  async importCustomers(rows, { updateExisting = true } = {}) {
    const res = { added: 0, updated: 0, skipped: 0, errors: [] };
    if (rows.length < 2) { res.errors.push('The file has no data rows.'); return res; }
    const cols = ImportExport.mapHeaders(rows[0], ImportExport.customerColumns);
    if (!('name' in cols)) { res.errors.push('No "Name" column found.'); return res; }
    const cell = (r, f) => (f in cols && cols[f] < r.length ? toS(r[cols[f]]).trim() : '');
    let ops = [];
    let n = 0;
    const seen = new Set();
    for (let i = 1; i < rows.length; i++) {
      const r = rows[i];
      const name = cell(r, 'name');
      if (!name) { res.skipped++; continue; }
      let phone = cell(r, 'phone').replace(/[^0-9+]/g, '');
      if (phone.startsWith('+91')) phone = phone.substring(3);
      if (phone.length === 12 && phone.startsWith('91')) phone = phone.substring(2);
      if (phone && seen.has(phone)) { res.skipped++; continue; }
      if (phone) seen.add(phone);
      const existing = phone ? Crm.byPhone(phone) : null;
      if (existing && !updateExisting) { res.skipped++; continue; }
      const v = { name, phone };
      if ('gstin' in cols) v.gstin = cell(r, 'gstin').toUpperCase();
      if ('address' in cols) v.address = cell(r, 'address');
      if ('price_list' in cols) { const pl = cell(r, 'price_list').toLowerCase(); v.price_list = pl.startsWith('w') ? 'wholesale' : pl.startsWith('m') ? 'member' : 'retail'; }
      if ('credit_limit' in cols) v.credit_limit = toD(cell(r, 'credit_limit'));
      if ('birthday' in cols) v.birthday = cell(r, 'birthday');
      if (existing) { ops.push({ op: 'update', t: 'customers', id: existing.id, v }); res.updated++; }
      else {
        const ref = `c${n++}`;
        const balance = toD(cell(r, 'balance')), points = toD(cell(r, 'points'));
        ops.push({ op: 'insert', t: 'customers', ref, v: { price_list: 'retail', ...v, credit_balance: balance > 0 ? balance : 0, points: points > 0 ? points : 0, created_at: nowIso() } });
        if (balance > 0) ops.push({ op: 'insert', t: 'khata', v: { customer_id: { $ref: ref }, date: nowIso(), type: 'credit', amount: balance, note: 'Opening balance (import)', user_id: App.user?.id ?? null } });
        if (points > 0) ops.push({ op: 'insert', t: 'points_log', v: { customer_id: { $ref: ref }, date: nowIso(), points, note: 'Opening points (import)' } });
        res.added++;
      }
      if (ops.length >= 300) { try { await App.store.apply(ops); } catch (e) { res.errors.push(`Rows up to ${i + 1}: ${e.message}`); } ops = []; }
    }
    if (ops.length) { try { await App.store.apply(ops); } catch (e) { res.errors.push(`Last rows: ${e.message}`); } }
    await audit('import_customers', `added ${res.added} updated ${res.updated} skipped ${res.skipped}`);
    await Data.loadCustomers();
    return res;
  },

// ---------- backup ----------
const Backup = {
  async collect() {
    const tables = {};
    for (const t of KB_TABLES) tables[t] = await App.store.select(t);
    return { app: 'kadaibill', format: 1, exported_at: nowIso(), shop: App.s('shop_name'), tables };
  },
  async download() {
    const data = await Backup.collect();
    downloadBlob(`kadaibill-backup-${isoDate()}.json`, new Blob([JSON.stringify(data)], { type: 'application/json' }));
  },
  async parse(file) {
    let data;
    try { data = JSON.parse(await file.text()); } catch { throw new Error(tr('This file is not a KadaiBill backup.')); }
    if (data?.app !== 'kadaibill' || !data.tables || !data.tables.items || !data.tables.sales) throw new Error(tr('This file is not a KadaiBill backup.'));
    return data;
  },
  /** Replaces all data with the backup. */
  async restore(data, onProgress) {
    const first = KB_TABLES.map((t) => ({ op: 'clear', t }));
    await App.store.apply(first);
    let done = 0;
    const total = sum(KB_TABLES, (t) => (data.tables[t] || []).length);
    for (const t of KB_TABLES) {
      const cols = KB_SCHEMA[t];
      const rows = (data.tables[t] || []).map((r) => Object.fromEntries(Object.entries(r).filter(([k]) => k in cols)));
      for (const part of chunk(rows, 400)) {
        await App.store.apply(part.map((v) => ({ op: 'insert', t, v })));
        done += part.length;
        onProgress?.(done, total);
      }
      if ('id' in cols) await App.store.apply([{ op: 'resync', t }]);
    }
  },
};

/** Re-render when shared app data changes. */
function useApp() {
  const [, set] = useState(0);
  useEffect(() => { const f = (v) => set(v); App.listeners.add(f); return () => App.listeners.delete(f); }, []);
  return App;
}
/** Runs an async loader; returns [data, reload, loading]. */
function useLoad(fn, deps = []) {
  const [state, setState] = useState({ data: null, loading: true });
  const alive = useRef(true);
  const run = useCallback(async () => {
    setState((s) => ({ ...s, loading: true }));
    try { const data = await fn(); if (alive.current) setState({ data, loading: false }); }
    catch (e) { console.error(e); toast(e.message, true); if (alive.current) setState({ data: null, loading: false }); }
  }, deps);
  useEffect(() => { alive.current = true; run(); return () => { alive.current = false; }; }, [run]);
  return [state.data, run, state.loading];
}

// ---------- toasts ----------
const Toasts = { list: [], set: null, n: 0 };
function toast(msg, err = false) {
  const id = ++Toasts.n;
  Toasts.list = [...Toasts.list, { id, msg, err }];
  Toasts.set?.(Toasts.list);
  setTimeout(() => { Toasts.list = Toasts.list.filter((t) => t.id !== id); Toasts.set?.(Toasts.list); }, err ? 6000 : 3500);
}
function ToastHost() {
  const [list, set] = useState([]);
  Toasts.set = set;
  return html`<div class="toasts" role="status" aria-live="polite">${list.map((t) => html`<div class=${'toast' + (t.err ? ' err' : '')} key=${t.id}>${t.msg}</div>`)}</div>`;
}

// ---------- modals ----------
const Modals = { stack: [], set: null, n: 0 };
/** Opens a modal. render(close) returns its content; resolves with close(value). */
function openModal(renderFn) {
  return new Promise((resolve) => {
    const id = ++Modals.n;
    const close = (v) => { Modals.stack = Modals.stack.filter((m) => m.id !== id); Modals.set?.([...Modals.stack]); resolve(v); };
    Modals.stack = [...Modals.stack, { id, renderFn, close }];
    Modals.set?.([...Modals.stack]);
  });
}
function ModalHost() {
  const [stack, set] = useState([]);
  Modals.set = set;
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape' && Modals.stack.length) { e.preventDefault(); Modals.stack[Modals.stack.length - 1].close(null); } };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);
  return stack.map((m) => html`<${ModalFrame} key=${m.id} m=${m} />`);
}
function ModalFrame({ m }) {
  return html`<div class="modal-back" onMouseDown=${(e) => { if (e.target === e.currentTarget) m.close(null); }}>${m.renderFn(m.close)}</div>`;
}
function Modal({ title, children, foot, size, onClose }) {
  return html`<div class=${'modal ' + (size || '')} role="dialog" aria-modal="true" aria-label=${title}>
    <div class="modal-head"><h2 class="grow">${title}</h2>${onClose && html`<button class="btn-ghost icon-btn" aria-label=${tr('Close')} onClick=${() => onClose(null)}><${Icon} n="x" /></button>`}</div>
    <div class="modal-body">${children}</div>
    ${foot && html`<div class="modal-foot">${foot}</div>`}
  </div>`;
}

const ask = {
  confirm(title, message, ok = 'OK', danger = false) {
    return openModal((close) => html`<${Modal} title=${title} size="narrow" onClose=${close}
      foot=${html`<button onClick=${() => close(false)}>${tr('Cancel')}</button>
        <button class=${danger ? 'btn-primary' : 'btn-primary'} autofocus onClick=${() => close(true)}>${tr(ok)}</button>`}>
      <p style="margin:0;white-space:pre-line">${message}</p></${Modal}>`).then((v) => v === true);
  },
  text(title, o = {}) {
    return openModal((close) => html`<${TextAsk} title=${title} o=${o} close=${close} />`);
  },
  async number(title, o = {}) {
    const v = await ask.text(title, { ...o, type: 'number' });
    if (v == null || toS(v).trim() === '') return null;
    const n = parseFloat(v);
    return isNaN(n) ? null : n;
  },
  choose(title, options) {
    return openModal((close) => html`<${Modal} title=${title} size="narrow" onClose=${close}>
      <div class="list">${options.map((o) => html`<div class="li" tabindex="0" onClick=${() => close(o.value)} onKeyDown=${(e) => e.key === 'Enter' && close(o.value)}>
        ${o.icon && html`<div class="avatar"><${Icon} n=${o.icon} /></div>`}
        <div class="grow"><div class="title">${o.label}</div>${o.sub && html`<div class="sub">${o.sub}</div>`}</div>
      </div>`)}</div></${Modal}>`);
  },
};
function TextAsk({ title, o, close }) {
  const [v, setV] = useState(o.initial ?? '');
  const ref = useRef();
  useEffect(() => { ref.current?.focus(); ref.current?.select?.(); }, []);
  const submit = (e) => { e.preventDefault(); close(v); };
  return html`<${Modal} title=${title} size="narrow" onClose=${close}
    foot=${html`<button onClick=${() => close(null)}>${tr('Cancel')}</button><button class="btn-primary" onClick=${submit}>${tr(o.ok || 'OK')}</button>`}>
    <form onSubmit=${submit} class="stack">
      ${o.message && html`<p style="margin:0">${o.message}</p>`}
      <label class="field">${o.label && html`<span>${o.label}</span>`}
        <input ref=${ref} id="ask-input" type=${o.type === 'number' ? 'text' : (o.type || 'text')} inputmode=${o.type === 'number' || o.numeric ? 'decimal' : undefined}
          value=${v} placeholder=${o.hint || ''} onInput=${(e) => setV(e.target.value)} autocomplete="off" /></label>
    </form></${Modal}>`;
}

/** Manager approval: owners/managers pass; cashiers need a manager PIN. */
async function approve(reason) {
  if (App.isManager) return App.user;
  const pin = await ask.text(tr('Manager approval'), { message: `${tr(reason)} - ${tr('enter manager PIN')}`, type: 'password', numeric: true });
  if (!pin) return null;
  const u = App.users.find((x) => x.pin === pin && x.active && (x.role === 'owner' || x.role === 'manager'));
  if (!u) { toast(tr('Wrong PIN'), true); return null; }
  await audit('approval', `${reason} by ${u.name}`);
  return u;
}

// ---------- printing ----------
const PRINT_FONTS = '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Madurai:wght@400;600;700&display=swap">';
/** Prints an HTML document through a hidden frame (receipts, labels, reports). */
function printHtml(body, { page = 'A4', css = '' } = {}) {
  if (KB_DEMO) { toast(tr('Printing works in the hosted version of KadaiBill, not in this demo.'), true); return; }
  const f = document.createElement('iframe');
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
  document.body.appendChild(f);
  const doc = f.contentDocument;
  doc.open();
  doc.write(`<!doctype html><html><head><meta charset="utf-8">${PRINT_FONTS}<style>
    @page { size: ${page}; margin: ${page.startsWith('58') || page.startsWith('80') ? '0' : '12mm'}; }
    body { font-family: "Hind Madurai", "Nirmala UI", "Latha", sans-serif; color: #000; margin: 0; }
    ${css}</style></head><body>${body}</body></html>`);
  doc.close();
  const go = () => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { toast(e.message, true); } setTimeout(() => f.remove(), 60000); };
  const fonts = doc.fonts ? doc.fonts.ready : Promise.resolve();
  Promise.race([fonts, new Promise((r) => setTimeout(r, 1500))]).then(() => setTimeout(go, 150));
}

function tableHtml(columns, rows, totals, numeric) {

    ${totals ? `<tr class="t">${totals.map((c, i) => `<td${n(i)}>${esc(tr(c))}</td>`).join('')}</tr>` : ''}</tbody></table>`;

  });

function qrSvg(text, cell = 5) {
  if (typeof qrcode === 'undefined') return '';
  const q = qrcode(0, 'M');
  q.addData(text);
  q.make();
  return q.createSvgTag({ cellSize: cell, margin: 2, scalable: true });
}
function barcodeSvg(code) {
  if (typeof JsBarcode === 'undefined') return esc(code);
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  try { JsBarcode(svg, code, { format: 'CODE128', height: 34, width: 1.4, fontSize: 11, margin: 0 }); } catch { return esc(code); }
  return svg.outerHTML;
}

      .s{font-size:8px;font-weight:700}.n{font-size:10px;white-space:nowrap;overflow:hidden}.v{font-size:9px}.p{font-size:11px;font-weight:700}svg{max-width:100%;height:12mm}`,
  });

// ---------- camera scanning ----------
let _scannerLib;
function loadScanner() {
  if (window.Html5Qrcode) return Promise.resolve();
  if (!_scannerLib) {
    _scannerLib = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';
      s.onload = res; s.onerror = () => rej(new Error('Could not load the scanner'));
      document.head.appendChild(s);
    });
  }
  return _scannerLib;
}
/** Opens the camera. With onCode it keeps scanning; otherwise returns the first code. */
function scanBarcode(onCode) {
  return openModal((close) => html`<${ScanModal} close=${close} onCode=${onCode} />`);
}
function ScanModal({ close, onCode }) {
  const [count, setCount] = useState(0);
  const [err, setErr] = useState('');
  useEffect(() => {
    let scanner, last = '', lastAt = 0, busy = false, stopped = false;
    loadScanner().then(() => {
      if (stopped) return;
      scanner = new Html5Qrcode('kb-scan');
      return scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 260, height: 140 } }, async (code) => {
        const now = Date.now();
        if (busy || (code === last && now - lastAt < 2000)) return;
        last = code; lastAt = now;
        if (!onCode) { close(code); return; }
        busy = true; await onCode(code); busy = false; setCount((c) => c + 1);
      });
    }).catch((e) => setErr(e?.message || String(e)));
    return () => { stopped = true; if (scanner) scanner.stop().catch(() => {}); };
  }, []);
  return html`<${Modal} title=${onCode ? `${tr('Scanning')} • ${count}` : tr('Scan barcode')} onClose=${close}
    foot=${html`<button class="btn-primary" onClick=${() => close(null)}>${tr('Done scanning')}</button>`}>
    ${err ? html`<p class="bad-text">${err}. ${tr('Allow camera access for this site, or type the code instead.')}</p>` : html`<div id="kb-scan" style="width:100%;min-height:260px"></div>`}
  </${Modal}>`;
}

// ===== Printed bill layout (thermal 58/80 mm or A4) =====

function receiptHtml(sale, lines, pays) {
  const st = App.settings;
  const lang = st.bill_lang || 'en';
  const t = (x) => esc(trIn(x, lang));
  const kind = sale.kind;
  const isReturn = kind === 'return', isEst = kind === 'estimate', isGV = kind === 'voucher', isVoid = sale.status === 'void';
  const inter = sale.interstate === 1;
  const saved = toD(sale.line_discount) + toD(sale.offer_discount) + toD(sale.bill_discount);
  const title = isVoid ? 'CANCELLED' : isReturn ? 'CREDIT NOTE' : isEst ? 'ESTIMATE / QUOTATION' : isGV ? 'GIFT VOUCHER' : (st.shop_gstin ? 'TAX INVOICE' : 'BILL');
  const row = (a, b, cls = '') => `<div class="r ${cls}"><span>${a}</span><span>${b}</span></div>`;
  const hr = '<div class="hr"></div>';
  const out = [];
  out.push(`<div class="c b big">${esc(st.shop_name || '')}</div>`);
  if (st.shop_address) out.push(`<div class="c">${esc(st.shop_address)}</div>`);
  if (st.shop_phone) out.push(`<div class="c">${t('Phone')}: ${esc(st.shop_phone)}</div>`);
  if (st.shop_gstin) out.push(`<div class="c">GSTIN: ${esc(st.shop_gstin)}</div>`);
  out.push(`<div class="c b" style="margin-top:4px">${t(title)}</div>`, hr);
  out.push(row(`${t('Bill no')}: ${esc(sale.bill_no)}`, dateFmt(sale.date)));
  out.push(row(`${t('Cashier')}: ${esc(sale.user_name || '')}`, timeFmt(sale.date)));
  if (sale.salesperson) out.push(row(`${t('Salesperson')}: ${esc(sale.salesperson)}`, ''));
  if (isReturn && sale.ref_bill_no) out.push(row(`${t('Against bill')}: ${esc(sale.ref_bill_no)}`, ''));
  if (sale.customer_name) {
    out.push(row(`${t('Customer')}: ${esc(sale.customer_name)}`, esc(sale.customer_phone || '')));
    if (sale.customer_gstin) out.push(row(`GSTIN: ${esc(sale.customer_gstin)}`, ''));
  }
  out.push(hr);
  if (isGV) {
    out.push(`<div class="c" style="margin-top:6px">${t('Voucher code')}</div><div class="c b code">${esc(sale.coupon_code)}</div>`);
    out.push(`<div class="c b big">Rs. ${amt(sale.total)}</div><div class="c">${esc(sale.note)}</div>`);
    out.push(`<div class="c" style="margin:6px 0">${t('Show this code at billing to pay with the voucher.')}</div>`, hr);
    for (const p of pays) out.push(row(`${t('Paid by')} ${t(modeLabel(p.mode))}`, amt(p.amount)));
  } else {
    out.push(`<div class="r b"><span class="w5">${t('Item')}</span><span class="w2 n">${t('Qty')}</span><span class="w3 n">${t('Rate')}</span><span class="w3 n">${t('Amount')}</span></div>`, hr);
    for (const l of lines) {
      out.push(`<div>${esc(lang === 'ta' && l.name_ta ? l.name_ta : l.name)}</div>`);
      out.push(`<div class="r"><span class="w5 sm">${l.hsn ? 'HSN ' + esc(l.hsn) + ' ' : ''}${qtyFmt(l.gst_rate)}%</span><span class="w2 n">${qtyFmt(l.qty)}</span><span class="w3 n">${amt(l.unit_price)}</span><span class="w3 n">${amt(l.total)}</span></div>`);
      if (toD(l.discount) > 0.004) out.push(`<div class="sm">&nbsp;&nbsp;${t('Discount')} ${amt(l.discount)}${l.offer_name ? ` (${esc(l.offer_name)})` : ''}</div>`);
    }
    out.push(hr);
    out.push(row(t('Items / Qty'), `${lines.length} / ${qtyFmt(sum(lines, (l) => l.qty))}`));
    if (saved > 0.004) { out.push(row(t('MRP / Gross'), amt(sale.subtotal))); out.push(row(t('Discounts'), '- ' + amt(saved))); }
    out.push(row(t('Taxable value'), amt(sale.taxable)));
    if (inter) out.push(row('IGST', amt(sale.igst))); else { out.push(row('CGST', amt(sale.cgst))); out.push(row('SGST', amt(sale.sgst))); }
    if (Math.abs(toD(sale.round_off)) > 0.004) out.push(row(t('Round off'), amt(sale.round_off)));
    out.push(row(isReturn ? t('REFUND') : t('TOTAL'), 'Rs. ' + amt(sale.total), 'b big'), hr);
    const gst = Billing.gstByRate(lines);
    if (gst.length > 1 || (gst.length && gst[0][0] > 0)) {
      out.push(`<div class="r b"><span>GST %</span><span class="n">${t('Taxable')}</span><span class="n">${inter ? 'IGST' : 'CGST+SGST'}</span></div>`);
      for (const [rate, [tx, tax]] of gst) out.push(`<div class="r"><span>${qtyFmt(rate)}%</span><span class="n">${amt(tx)}</span><span class="n">${amt(tax)}</span></div>`);
      out.push(hr);
    }
    for (const p of pays) {
      const lbl = p.mode === 'voucher' ? `${isReturn || toS(p.ref).startsWith('SC') ? t('Store credit') : t('Gift voucher')} ${esc(p.ref)}` : t(modeLabel(p.mode));
      out.push(row(lbl, amt(p.amount)));
    }
    if (isReturn && pays.some((p) => p.mode === 'voucher')) out.push(`<div class="c">${t('Use the store credit code on your next purchase.')}</div>`);
    if (isEst) out.push(`<div class="c">${t('This is an estimate, not a bill. Prices may change.')}</div>`);
    if (saved > 0.004 && !isReturn) out.push(`<div class="c b">${t('You saved')} Rs. ${amt(saved)}</div>`);
    if (!isEst && sale.customer_name) {
      if (toD(sale.points_earned) > 0) out.push(`<div class="c">${t('Points earned')}: ${qtyFmt(sale.points_earned)}</div>`);
      out.push(`<div class="c">${t('Points balance')}: ${qtyFmt(sale.customer_points)}</div>`);
      if (toD(sale.customer_credit) > 0.009) out.push(`<div class="c">${t('Khata balance')}: Rs. ${amt(sale.customer_credit)}</div>`);
    }
    if (!isEst && !isReturn && st.upi_id && sale.payQr) out.push(`<div class="c">${sale.payQr}</div>`);
  }
  if (st.receipt_footer) out.push(`<div class="c" style="margin-top:6px">${esc(st.receipt_footer)}</div>`);
  return `<div class="rcpt">${out.join('')}</div>`;
}

function printReceipt(sale, lines, pays) {
  const size = App.s('receipt_size', '80');
  printHtml(receiptHtml(sale, lines, pays), { page: receiptPage(size), css: receiptCss(size) });
}

function receiptWhatsappText(sale, lines, pays) {
  const title = ({ return: 'Credit note', estimate: 'Estimate', voucher: 'Gift voucher' })[sale.kind] || 'Bill';
  const out = [`*${App.s('shop_name')}*`, `${title}: ${sale.bill_no}`, dateTimeFmt(sale.date), ''];
  if (sale.kind === 'voucher') out.push(`Code: *${sale.coupon_code}*`, `Value: Rs. ${amt(sale.total)}`, toS(sale.note));
  for (const l of lines) out.push(`${l.name}  ${qtyFmt(l.qty)} x ${amt(l.unit_price)} = ${amt(l.total)}`);
  for (const p of pays) if (p.mode === 'voucher' && p.ref && sale.kind === 'return') out.push(`Store credit code: *${p.ref}*`);
  out.push('', `*Total: Rs. ${amt(sale.total)}*`);
  const saved = toD(sale.line_discount) + toD(sale.offer_discount) + toD(sale.bill_discount);
  if (saved > 0) out.push(`You saved Rs. ${amt(saved)}`);
  if (toD(sale.points_earned) > 0) out.push(`Points earned: ${qtyFmt(sale.points_earned)}`);
  out.push(App.s('receipt_footer', 'Thank you!'));
  return out.join('\n');
}

// ---------- bill preview / print ----------
async function showReceipt(saleId, opts = {}) {
  const sale = await Sales.sale(saleId);
  const lines = await Sales.lines(saleId);
  const pays = await Sales.payments(saleId);
  return showDocument(sale, lines, pays, opts);
}
function showDocument(sale, lines, pays, opts = {}) {
  if (opts.autoPrint) printReceipt(sale, lines, pays);
  return openModal((close) => {
    const size = App.s('receipt_size', '80');
    const doc = `<!doctype html><html><head><meta charset="utf-8">${PRINT_FONTS}<style>body{margin:0;padding:8px;background:#fff;font-family:"Hind Madurai","Nirmala UI",sans-serif}${receiptCss(size)}</style></head><body>${receiptHtml(sale, lines, pays)}</body></html>`;
    return html`<${Modal} title=${sale.bill_no} onClose=${close}
      foot=${html`
        ${sale.customer_phone && html`<button onClick=${() => openWhatsApp(sale.customer_phone, receiptWhatsappText(sale, lines, pays))}><${Icon} n="chat" />${tr('WhatsApp')}</button>`}
        <button onClick=${() => printReceipt(sale, lines, pays)}><${Icon} n="print" />${tr('Print')}</button>
        <button class="btn-primary" autofocus onClick=${() => close(true)}>${tr('Done')}</button>`}>
      <iframe class="receipt-frame" title=${tr('Bill preview')} srcdoc=${doc}></iframe>
    </${Modal}>`;
  });
}

// ---------- payment ----------
function showPayment(cart) { return openModal((close) => html`<${PaymentModal} cart=${cart} close=${close} />`); }
function PaymentModal({ cart, close }) {
  const [tenders, setTenders] = useState([]);
  const [mode, setMode] = useState('cash');
  const [amount, setAmount] = useState('');
  const [ref, setRef] = useState('');
  const [change, setChange] = useState(0);
  const [voucher, setVoucher] = useState({ code: '', balance: 0 });
  const otpOk = useRef(false);
  const c = cart.customer;
  const paid = sum(tenders, (t) => t.amount);
  const remaining = r2(cart.total - paid);
  const pointsValue = c ? r2(toD(c.points) * App.d('point_value', 1) - sum(tenders.filter((t) => t.mode === 'points'), (t) => t.amount)) : 0;

  useEffect(() => { setAmount(remaining > 0 ? remaining.toFixed(2) : ''); }, [tenders.length]);
  useEffect(() => {
    // An exchange's store credit is applied to the new bill automatically.
    if (!cart.exchangeCode) return;
    Sales.findCoupon(cart.exchangeCode, 'voucher').then((v) => {
      if (!v || toD(v.balance) <= 0) return;
      const use = r2(Math.min(toD(v.balance), cart.total));
      if (use > 0) {
        setTenders([{ mode: 'voucher', amount: use, ref: v.code }]);
        setVoucher({ code: v.code, balance: r2(toD(v.balance) - use) });
      }
    });
  }, []);

  const complete = (list) => { if (r2(cart.total - sum(list, (t) => t.amount)) <= 0.009) close({ tenders: list, change }); };
  const pick = (m) => {
    setMode(m); setRef('');
    let a = remaining;
    if (m === 'points') a = Math.min(a, pointsValue);
    if (m === 'voucher' && voucher.code) a = Math.min(a, voucher.balance);
    setAmount(a > 0 ? a.toFixed(2) : '');
  };

  const verifyOtp = async () => {
    if (otpOk.current || App.s('points_otp', '0') !== '1' || !c) return true;
    if (!toS(c.phone).trim()) return !!(await approve('Redeem points without OTP'));
    const otp = String(1000 + Math.floor(Math.random() * 9000));
    openWhatsApp(c.phone, `${App.s('shop_name')}: your OTP to redeem loyalty points is ${otp}. Share it with the cashier only if you are making this purchase.`);
    const entered = await ask.text(tr('Enter the OTP the customer received'), { numeric: true });
    if (toS(entered).trim() === otp) { otpOk.current = true; return true; }
    toast(tr('Wrong OTP'), true);
    return false;
  };

  const add = async () => {
    let a = toD(amount);
    if (a <= 0 || remaining <= 0) return;
    let ch = 0;
    if (mode === 'cash' && a > remaining) { ch = r2(a - remaining); a = remaining; }
    if (mode === 'points') {
      if (a > pointsValue + 0.009) { toast(tr('Not enough points'), true); return; }
      if (!(await verifyOtp())) return;
    }
    if (mode === 'voucher') {
      if (!voucher.code) { toast(tr('Check the voucher code first'), true); return; }
      a = Math.min(a, voucher.balance);
    }
    if (mode === 'credit') {
      if (!c) return;
      if (toD(c.credit_limit) > 0 && toD(c.credit_balance) + a > toD(c.credit_limit)) {
        if (!(await approve('Credit limit exceeded'))) return;
      }
    }
    a = r2(Math.min(a, remaining));
    if (a <= 0) return;
    const list = [...tenders, { mode, amount: a, ref: mode === 'voucher' ? voucher.code : ref.trim() }];
    if (mode === 'voucher') setVoucher({ ...voucher, balance: r2(voucher.balance - a) });
    setTenders(list);
    setChange(ch);
    setRef('');
    if (r2(cart.total - sum(list, (t) => t.amount)) > 0 && mode !== 'cash') setMode('cash');
    if (r2(cart.total - sum(list, (t) => t.amount)) <= 0.009 && mode === 'cash' && ch === 0 && App.s('auto_complete_payment', '1') === '1') complete(list);
  };
  const checkVoucher = async () => {
    const code = await ask.text(tr('Gift voucher code'));
    if (!code) return;
    const v = await Sales.findCoupon(code, 'voucher');
    if (!v || couponExpired(v) || toD(v.balance) <= 0) { toast(tr('Voucher not valid or no balance'), true); return; }
    setVoucher({ code: v.code, balance: toD(v.balance) });
    setAmount(Math.min(toD(v.balance), remaining).toFixed(2));
  };
  const removeAt = (i) => {
    const t = tenders[i];
    if (t.mode === 'voucher' && t.ref === voucher.code) setVoucher({ ...voucher, balance: r2(voucher.balance + t.amount) });
    if (t.mode === 'cash') setChange(0);
    setTenders(tenders.filter((_, j) => j !== i));
  };
  const quick = (m) => { const list = [...tenders, { mode: m, amount: remaining, ref: '' }]; setTenders(list); complete(list); };

  const modes = [['cash', 'Cash', 'cash'], ['upi', 'UPI', 'qr'], ['card', 'Card', 'ticket'], ['wallet', 'Wallet', 'expenses'],
    ...(c ? [['credit', 'Khata (credit)', 'customers']] : []), ...(c && toD(c.points) > 0 ? [['points', 'Loyalty points', 'gift']] : []),
    ['voucher', 'Gift voucher', 'gift']];
  const amtNow = toD(amount);
  const upi = App.s('upi_id');
  const showQr = mode === 'upi' && remaining > 0;

  return html`<${Modal} title=${tr('Payment')} size="wide" onClose=${close}
    foot=${html`<button onClick=${() => close(null)}>${tr('Back to bill')}</button>
      ${!tenders.length && html`<button onClick=${() => quick('upi')}>${tr('UPI full')}</button><button onClick=${() => quick('cash')}>${tr('Exact cash')}</button>`}
      <button class="btn-primary" disabled=${remaining > 0.009} onClick=${() => complete(tenders)}><${Icon} n="check" />${tr('Complete bill')}</button>`}>
    <div class="split">
      <div class="stack">
        <div class="due-box">
          <div>${tr('Amount due')}${c ? ` • ${c.name}` : ''}</div>
          <div class="big">${money(cart.total)}</div>
          ${paid > 0 && html`<div><b>${tr('Remaining')}: ${money(Math.max(remaining, 0))}</b></div>`}
          ${change > 0 && html`<div class="change">${tr('Return change')}: ${money(change)}</div>`}
        </div>
        <div class="chips">${modes.map(([m, l, ic]) => html`<button class=${'chip' + (mode === m ? ' on' : '')} disabled=${remaining <= 0} onClick=${() => pick(m)}><${Icon} n=${ic} s=${16} />${tr(l)}</button>`)}</div>
        ${mode === 'voucher' && html`<div class="row"><span class="grow">${voucher.code ? `${voucher.code} • ${tr('Balance')} ${money(voucher.balance)}` : tr('No voucher selected')}</span><button class="btn-sm" onClick=${checkVoucher}>${tr('Enter code')}</button></div>`}
        ${mode === 'points' && c && html`<div class="muted">${tr('Points')}: ${qtyFmt(c.points)} = ${money(pointsValue)}</div>`}
        ${mode === 'credit' && c && html`<div class="muted">${tr('Current due')} ${money(c.credit_balance)}${toD(c.credit_limit) > 0 ? ` / ${tr('Limit')} ${money(c.credit_limit)}` : ''}</div>`}
        <div class="row nowrap">
          <label class="field grow"><span>${mode === 'cash' ? tr('Cash received') : tr('Amount')}</span>
            <input id="pay-amount" inputmode="decimal" autofocus value=${amount} style="font-size:1.25rem;font-weight:700"
              onInput=${(e) => setAmount(e.target.value)} onKeyDown=${(e) => e.key === 'Enter' && add()} /></label>
          ${['card', 'upi', 'wallet'].includes(mode) && html`<label class="field" style="width:40%"><span>${tr('Ref / last 4 digits')}</span><input value=${ref} onInput=${(e) => setRef(e.target.value)} /></label>`}
        </div>
        ${mode === 'cash' && amtNow > remaining && remaining > 0 && html`<div class="change">${tr('Change to return')}: ${money(amtNow - remaining)}</div>`}
        ${mode === 'cash' && html`<div class="chips">${[10, 20, 50, 100, 200, 500, 2000].filter((n) => n >= remaining).map((n) => html`<button class="chip" onClick=${() => setAmount(String(n))}>₹${n}</button>`)}</div>`}
        <button onClick=${add} disabled=${remaining <= 0}><${Icon} n="plus" />${tr('Add payment')}</button>
        ${tenders.length > 0 && html`<div class="list">${tenders.map((t, i) => html`<div class="li" style="cursor:default">
          <${Icon} n="check" /><div class="grow"><div class="title">${t.mode === 'voucher' && toS(t.ref).startsWith('SC') ? tr('Store credit') : tr(modeLabel(t.mode))}</div>${t.ref && html`<div class="sub">${t.ref}</div>`}</div>
          <b class="num">${money(t.amount)}</b><button class="btn-ghost icon-btn" aria-label=${tr('Remove')} onClick=${() => removeAt(i)}><${Icon} n="x" /></button></div>`)}</div>`}
      </div>
      ${showQr && html`<div class="stack" style="align-items:center;text-align:center">
        ${upi ? html`<div class="qr-box" dangerouslySetInnerHTML=${{ __html: qrSvg(upiLink(upi, App.s('upi_name', App.s('shop_name')), amtNow > 0 ? amtNow : remaining, 'Bill payment')) }}></div>
          <b>${tr('Scan to pay')} ${money(amtNow > 0 ? amtNow : remaining)}</b><div class="muted small">${upi}</div>
          <div class="muted small">${tr('Press "Add payment" after the customer pays.')}</div>`
        : html`<p class="muted">${tr('Add your UPI ID in Settings to show a payment QR.')}</p>`}
      </div>`}
    </div>
  </${Modal}>`;
}

function pickBill() { return openModal((close) => html`<${BillPicker} close=${close} />`); }
function BillPicker({ close }) {
  const [q, setQ] = useState('');

      <div class="grow"><div class="title mono">${b.bill_no}</div><div class="sub">${dateTimeFmt(b.date)}${b.customer_name ? ' • ' + b.customer_name : ''}</div></div>
      <b class="num">${money(b.total)}</b></div>`)}${!list.length && html`<div class="empty">${tr('No bills yet')}</div>`}</div></${Modal}>`;
}

async function runReturnFlow(saleId, exchange = false) {
  const sale = await Sales.sale(saleId);
  const lines = await Sales.lines(saleId);
  const r = await openModal((close) => html`<${ReturnModal} sale=${sale} lines=${lines} exchange=${exchange} close=${close} />`);
  if (!r) return null;
  const approver = await approve(exchange ? 'Exchange' : 'Sales return');
  if (!approver) return null;
  const res = await Sales.saveReturn({ saleId, qtyByLine: r.qty, refundMode: r.mode, reason: r.reason, approvedBy: approver.id });
  App.touch();
  return res;
}
function ReturnModal({ sale, lines, exchange, close }) {
  const [qty, setQty] = useState({});
  const [reason, setReason] = useState(exchange ? 'Exchange' : '');
  const [mode, setMode] = useState(exchange ? 'voucher' : 'cash');
  const ok = () => {
    const q = {};
    for (const l of lines) {
      const left = toD(l.qty) - toD(l.returned_qty);
      const v = Math.min(toD(qty[l.id]), left);
      if (v > 0) q[l.id] = v;
    }
    if (!Object.keys(q).length) { toast(tr('Enter the quantity to return'), true); return; }
    close({ qty: q, reason, mode });
  };
  const modes = [['cash', tr('Cash')], ['upi', 'UPI'], ['voucher', tr('Store credit')], ...(sale.customer_id != null ? [['credit', tr('Khata')]] : [])];
  return html`<${Modal} title=${`${exchange ? tr('Exchange - return items from') : tr('Return against')} ${sale.bill_no}`} onClose=${close}
    foot=${html`<button onClick=${() => close(null)}>${tr('Cancel')}</button><button class="btn-primary" onClick=${ok}>${exchange ? tr('Continue exchange') : tr('Create credit note')}</button>`}>
    <div class="list">${lines.map((l) => {
      const left = toD(l.qty) - toD(l.returned_qty);
      return html`<div class="li" style="cursor:default"><div class="grow"><div class="title">${l.name}</div>
        <div class="sub">${tr('Sold')} ${qtyFmt(l.qty)} • ${tr('Already returned')} ${qtyFmt(l.returned_qty)} • ${money(toD(l.total) / (toD(l.qty) || 1))} ${tr('each')}</div></div>
        ${left <= 0 ? html`<span class="pill">${tr('Returned')}</span>` : html`<input style="width:90px" inputmode="decimal" placeholder=${`${tr('Max')} ${qtyFmt(left)}`} onInput=${(e) => setQty({ ...qty, [l.id]: e.target.value })} />`}</div>`;
    })}</div>
    <${Field} label=${tr('Reason for return')}><input value=${reason} onInput=${(e) => setReason(e.target.value)} /></${Field}>
    ${exchange ? html`<p class="muted small" style="margin:0">${tr('The returned value becomes store credit and is applied to the new bill.')}</p>`
      : html`<div class="row"><span>${tr('Refund by')}</span><${Seg} value=${mode} options=${modes} onChange=${setMode} /></div>`}
  </${Modal}>`;
}
