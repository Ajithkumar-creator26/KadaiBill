<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0f6e66">
<title>KadaiBill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,800&family=Hind+Madurai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: counter-first. A slim navigation rail, the work area, and the bill pane
   on the right of the billing screen. Teal of a shop shutter, marigold for money. */
:root {
  --bg: #f3f6f5;
  --surface: #ffffff;
  --surface-2: #eaf0ee;
  --line: #d5dfdc;
  --fg: #16201e;
  --muted: #5a6a66;
  --accent: #0f6e66;
  --accent-fg: #ffffff;
  --accent-soft: #d9eeeb;
  --gold: #c98410;
  --gold-soft: #fbefd6;
  --good: #1d7a3e;
  --good-soft: #def3e5;
  --warn: #a8640a;
  --bad: #be3426;
  --bad-soft: #fbe2de;
  --shadow: 0 1px 2px rgba(15, 40, 36, .06), 0 6px 24px rgba(15, 40, 36, .08);
  --font-display: "Bricolage Grotesque", "Hind Madurai", system-ui, sans-serif;
  --font-body: "Hind Madurai", "Noto Sans Tamil", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 10px;
  --rail: 232px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1513; --surface: #16201e; --surface-2: #1c2927; --line: #2a3a37; --fg: #e4eeeb; --muted: #93a6a1;
    --accent: #43b3a7; --accent-fg: #04201c; --accent-soft: #15403b; --gold: #f0b555; --gold-soft: #3b2c12;
    --good: #57c785; --good-soft: #17352a; --warn: #f0a945; --bad: #ff8070; --bad-soft: #3e1d18;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1513; --surface: #16201e; --surface-2: #1c2927; --line: #2a3a37; --fg: #e4eeeb; --muted: #93a6a1;
  --accent: #43b3a7; --accent-fg: #04201c; --accent-soft: #15403b; --gold: #f0b555; --gold-soft: #3b2c12;
  --good: #57c785; --good-soft: #17352a; --warn: #f0a945; --bad: #ff8070; --bad-soft: #3e1d18;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
#app { height: 100%; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 650; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
h1 { font-size: 1.5rem; } h2 { font-size: 1.2rem; } h3 { font-size: 1.02rem; }
a { color: var(--accent); }
.num, .money { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: .92em; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.bad-text { color: var(--bad); }
.good-text { color: var(--good); }
.right { text-align: right; }
.grow { flex: 1; min-width: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.nowrap { flex-wrap: nowrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.between { justify-content: space-between; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); }
.label { font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }

/* ---------- controls ---------- */
button, .btn {
  font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  border-radius: 8px; padding: 8px 14px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; min-height: 40px; text-decoration: none; white-space: nowrap;
}
button:hover { border-color: var(--accent); }
button:disabled { opacity: .5; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.btn-primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn-primary:hover { filter: brightness(1.07); }
.btn-gold { background: var(--gold); color: #1b1203; border-color: var(--gold); }
.btn-danger { color: var(--bad); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--surface-2); border-color: transparent; }
.btn-sm { min-height: 32px; padding: 4px 10px; font-size: .88rem; }
.btn-big { min-height: 56px; font-size: 1.1rem; }
.icon-btn { min-height: 36px; min-width: 36px; padding: 4px; border-radius: 8px; }

input, select, textarea {
  font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 10px; min-height: 40px; width: 100%;
}
textarea { min-height: 70px; resize: vertical; }
input[type="checkbox"] { width: 18px; height: 18px; min-height: 0; accent-color: var(--accent); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: .82rem; color: var(--muted); font-weight: 600; }
.field .hint { font-size: .78rem; color: var(--muted); }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
.check small { display: block; color: var(--muted); }
.form-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); }

.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); font-size: .88rem; font-weight: 600; cursor: pointer; min-height: 34px; color: var(--fg);
}
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .76rem; font-weight: 700; background: var(--surface-2); color: var(--muted); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.gold { background: var(--gold-soft); color: var(--warn); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; min-height: 36px; }
.seg button.on { background: var(--accent); color: var(--accent-fg); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.section-title { margin: 18px 0 8px; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: var(--rail) 1fr; height: 100%; }
.rail {
  background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column;
  padding: 12px 10px; gap: 2px; overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--accent-fg); display: grid;
  place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 1.05rem;
}
.brand b { font-family: var(--font-display); font-size: 1.02rem; display: block; line-height: 1.1; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; border: 0;
  background: transparent; width: 100%; justify-content: flex-start; font-weight: 500; min-height: 38px; color: var(--fg);
}
.nav-item:hover { background: var(--surface-2); }
.nav-item.on { background: var(--accent-soft); color: var(--fg); font-weight: 700; }
.nav-item svg { flex: none; }
.main { display: flex; flex-direction: column; min-width: 0; height: 100%; }
.topbar {
  display: flex; align-items: center; gap: 10px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid var(--line); background: var(--surface); min-height: 58px;
}
.topbar h1 { font-size: 1.2rem; }
.content { flex: 1; overflow: auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 80px max(16px, env(safe-area-inset-left, 0px)); }
.content.flush { padding: 0; overflow: hidden; }
.menu-btn { display: none; }
.drawer-back { display: none; }
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .rail { position: fixed; inset: 0 auto 0 0; width: 260px; z-index: 40; transform: translateX(-105%); transition: transform .2s; box-shadow: var(--shadow); padding-top: max(12px, env(safe-area-inset-top, 0px)); }
  .rail.open { transform: none; }
  .drawer-back.open { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, .35); z-index: 39; }
  .menu-btn { display: inline-flex; }
}

/* ---------- tables and lists ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--surface-2); white-space: nowrap; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.total td { font-weight: 700; background: var(--surface-2); }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.li { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.li:last-child { border-bottom: 0; }
.li:hover { background: var(--surface-2); }
.li .title { font-weight: 600; }
.li .sub { font-size: .84rem; color: var(--muted); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; flex: none; color: var(--accent); }
.empty { text-align: center; color: var(--muted); padding: 40px 16px; }
.empty svg { opacity: .6; margin-bottom: 8px; }

.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; gap: 12px; align-items: center; justify-content: flex-start; cursor: default; text-align: left; min-width: 0; }
.stat.click { cursor: pointer; }
.stat .v { font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .k { font-size: .8rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stat > div:last-child { min-width: 0; }
.stat .ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.stat.bad .ic { background: var(--bad-soft); color: var(--bad); }
.stat.gold .ic { background: var(--gold-soft); color: var(--warn); }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
.tabs button { border: 0; border-radius: 0; border-bottom: 2px solid transparent; background: transparent; min-height: 42px; color: var(--muted); }
.tabs button.on { color: var(--fg); border-bottom-color: var(--accent); }

/* ---------- modal & toast ---------- */
.modal-back {
  position: fixed; inset: 0; background: rgba(8, 20, 18, .45); z-index: 50; display: grid; place-items: center;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
}
.modal {
  background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); width: min(560px, 100%); max-height: 100%;
  display: flex; flex-direction: column; overflow: hidden;
}
.modal.wide { width: min(860px, 100%); }
.modal.narrow { width: min(400px, 100%); }
.modal-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.modal-body { padding: 16px 18px; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.modal-foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.toasts { position: fixed; bottom: max(16px, env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 6px; align-items: center; width: min(520px, calc(100% - 32px)); }
.toast { background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow); font-weight: 600; }
.toast.err { background: var(--bad); color: #fff; }
.fab { position: fixed; right: max(20px, env(safe-area-inset-right, 0px)); bottom: max(20px, env(safe-area-inset-bottom, 0px)); z-index: 20; box-shadow: var(--shadow); }

/* ---------- billing counter ---------- */
.pos { display: grid; grid-template-columns: 1fr 440px; height: 100%; }
.pos-left { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); }
.pos-right { display: flex; flex-direction: column; min-width: 0; background: var(--surface); }
.pos-search { padding: 12px; display: flex; gap: 8px; }
.pos-search input { font-size: 1.05rem; min-height: 48px; }
.quick { flex: 1; overflow: auto; padding: 0 12px 12px; }
.quick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.tile {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-height: 86px; text-align: left;
  display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; align-items: stretch; white-space: normal;
}
.tile:hover { border-color: var(--accent); }
.tile .nm { font-weight: 600; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.tile .pr { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
.bill-head { padding: 10px 12px; display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); align-items: center; }
.bill-head select { width: auto; min-height: 34px; padding: 4px 8px; }
.cart { flex: 1; overflow: auto; }
.cart-line { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.cart-line .nm { font-weight: 600; cursor: pointer; }
.cart-line .meta { font-size: .8rem; color: var(--muted); }
.cart-line .off { font-size: .8rem; color: var(--good); font-weight: 600; }
.qty { display: flex; align-items: center; gap: 2px; }
.qty b { min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; }
.qty button { min-height: 32px; min-width: 32px; padding: 0; border-radius: 50%; }
.cart-line .amt { min-width: 84px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.summary { padding: 10px 12px 12px; border-top: 1px solid var(--line); background: var(--surface-2); }
.sum-row { display: flex; justify-content: space-between; font-size: .9rem; padding: 1px 0; font-variant-numeric: tabular-nums; }
.grand { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 0 8px; }
.grand b { font-family: var(--font-display); font-size: 1.9rem; color: var(--accent); font-variant-numeric: tabular-nums; }
.bill-actions { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-bottom: 8px; }
.bill-actions button { flex-direction: column; gap: 0; font-size: .72rem; min-height: 50px; padding: 4px 2px; font-weight: 600; }
.results .li { padding: 8px 14px; }
@media (max-width: 1100px) { .pos { grid-template-columns: 1fr 380px; } }
@media (max-width: 860px) {
  .pos { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; min-height: 100%; }
  .pos-left { border-right: 0; }
  .content.flush { overflow: auto; }
  .quick { max-height: 40vh; }
}

/* ---------- payment ---------- */
.due-box { background: var(--accent-soft); border-radius: 12px; padding: 14px; text-align: center; }
.due-box .big { font-family: var(--font-display); font-size: 2.1rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.change { color: var(--bad); font-weight: 800; font-size: 1.1rem; }
.qr-box { background: #fff; padding: 10px; border-radius: 10px; display: inline-block; }
.qr-box svg { display: block; width: 210px; height: 210px; }

/* ---------- PIN login ---------- */
.center-page { min-height: 100%; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.auth-card { width: min(440px, 100%); }
.pin-dots { display: flex; gap: 12px; justify-content: center; margin: 14px 0; }
.pin-dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }
.pin-dots i.on { background: var(--accent); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.keypad button { min-height: 60px; font-size: 1.35rem; font-family: var(--font-display); }

/* ---------- receipt preview ---------- */
.receipt-frame { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: #fff; height: 60vh; }

/* ---------- bars ---------- */
.bars { display: flex; align-items: flex-end; gap: 10px; height: 170px; padding: 6px 4px 0; }
.bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; justify-content: flex-end; height: 100%; min-width: 0; }
.bar i { display: block; width: 100%; max-width: 46px; border-radius: 6px 6px 2px 2px; background: var(--accent); opacity: .55; }
.bar.today i { opacity: 1; }
.bar small { font-size: .74rem; color: var(--muted); white-space: nowrap; }
.split { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); }
.report-layout { display: grid; grid-template-columns: 290px 1fr; gap: 16px; }
.rep-back { display: none; }
@media (max-width: 900px) {
  .report-layout { grid-template-columns: 1fr; }
  .report-layout.picked > .list { display: none; }
  .report-layout.picked .rep-back { display: inline-flex; }
}
@media (max-width: 600px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .stat { padding: 10px; gap: 8px; }
  .stat .ic { width: 30px; height: 30px; }
  .stat .v { font-size: 1.1rem; }
}
.notice { border: 1px solid var(--gold); background: var(--gold-soft); border-radius: var(--radius); padding: 10px 14px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== Shop connection (optional) =====
   Fill these two values to connect every device to your Supabase project
   automatically. Leave them empty and the app asks on first open.
   The anon key is safe to publish: Row Level Security protects the data. */
var KB_CONFIG = {
  supabaseUrl: "",
  supabaseAnonKey: ""
};
</script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/standalone.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

// ---- util.js ----
// ===== Formatting and small helpers =====
const _inr2 = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const _inrQty = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 3 });

/** ₹1,23,456.00 */
// True only in the try-out build published as a Claude artifact.
const KB_DEMO = typeof KB_DEMO_BUILD !== 'undefined' && KB_DEMO_BUILD;

function money(v) {
  const n = Number(v) || 0;
  return (n < 0 ? '-₹' : '₹') + _inr2.format(Math.abs(n));
}
/** 1,23,456.00 (no symbol) */
function amt(v) { return _inr2.format(Number(v) || 0); }
function qtyFmt(v) { return _inrQty.format(Number(v) || 0); }
function r2(v) { return Math.round((Number(v) || 0) * 100 + Number.EPSILON * 100) / 100; }
function toD(v) { const n = typeof v === 'number' ? v : parseFloat(String(v ?? '').replace(/[^0-9.\-]/g, '')); return isFinite(n) ? n : 0; }
function toS(v) { return v == null ? '' : String(v); }
function two(n) { return String(n).padStart(2, '0'); }

function nowIso() { return new Date().toISOString(); }
/** yyyy-mm-dd in local time */
function isoDate(d) { d = d || new Date(); return `${d.getFullYear()}-${two(d.getMonth() + 1)}-${two(d.getDate())}`; }
function parseDate(v) { const d = v instanceof Date ? v : new Date(v); return isNaN(d) ? null : d; }
function dateFmt(v) { const d = parseDate(v); return d ? `${two(d.getDate())}-${two(d.getMonth() + 1)}-${d.getFullYear()}` : ''; }
function timeFmt(v) {
  const d = parseDate(v); if (!d) return '';
  const h = d.getHours() % 12 || 12;
  return `${two(h)}:${two(d.getMinutes())} ${d.getHours() < 12 ? 'AM' : 'PM'}`;
}
function dateTimeFmt(v) { const d = parseDate(v); return d ? `${dateFmt(d)} ${timeFmt(d)}` : ''; }

/** Local-day range [from 00:00, to+1 00:00) as UTC ISO strings for queries. */
function dayRange(from, to) {
  const a = new Date(from.getFullYear(), from.getMonth(), from.getDate());
  const b = new Date(to.getFullYear(), to.getMonth(), to.getDate() + 1);
  return [a.toISOString(), b.toISOString()];
}
function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }

/** Indian financial year label, e.g. "26-27". */
function fyLabel(d) {
  d = d || new Date();
  const start = d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1;
  return `${two(start % 100)}-${two((start + 1) % 100)}`;
}

function uid(prefix) {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const a = new Uint32Array(6);
  (globalThis.crypto || require('crypto').webcrypto).getRandomValues(a);
  return prefix + Array.from(a, (x) => chars[x % chars.length]).join('');
}

function groupBy(rows, keyFn) {
  const m = new Map();
  for (const r of rows) {
    const k = keyFn(r);
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(r);
  }
  return m;
}
function sum(rows, fn) { let s = 0; for (const r of rows) s += Number(fn(r)) || 0; return s; }
function chunk(arr, n) { const out = []; for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n)); return out; }

function waLink(phone, text) {
  let p = toS(phone).replace(/[^0-9]/g, '');
  if (p.length === 10) p = '91' + p;
  return `https://wa.me/${p}?text=${encodeURIComponent(text)}`;
}
function openWhatsApp(phone, text) {
  const w = window.open(waLink(phone, text), '_blank', 'noopener');
  if (!w) location.href = waLink(phone, text);
}

/** UPI payment link understood by GPay, PhonePe, Paytm, BHIM. */
function upiLink(id, name, amount, note) {
  return `upi://pay?pa=${encodeURIComponent(id)}&pn=${encodeURIComponent(name)}&am=${Number(amount).toFixed(2)}&cu=INR&tn=${encodeURIComponent(note || 'Bill payment')}`;
}

}

function esc(s) {
  return toS(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

// Tables the app writes through apply(); everything except internal ones.

function kbDefault(type) {
  switch (type) {
    case 't': return '';
    case 'n': case 'i': return 0;
    case 'i1': case 'n1': return 1;
    default: return null;
  }
}

/** Row with every column filled (defaults for missing ones). */
function kbFillRow(table, v) {
  const cols = KB_SCHEMA[table];
  const out = {};
  for (const c in cols) {
    out[c] = v[c] === undefined ? kbDefault(cols[c]) : v[c];
  }
  return out;
}

// ---- db.js ----
// ===== Data layer =====
// Two interchangeable stores with the same API:
//   select(table, query) -> rows
//   apply(ops)           -> refs  (all-or-nothing list of writes)
//   rpc(name, args)
// SupabaseStore keeps data in the cloud (Postgres, shared by all devices).
// LocalStore keeps data in this browser (IndexedDB) for trying the app.
//
// query = { eq:{col:v}, neq:{}, gt:{}, gte:{}, lt:{}, lte:{}, in:{col:[...]},
//           like:{col:'text'} (case-insensitive contains), order:[['col','desc']], limit:n }

function _cmp(a, b) {
  if (a == null && b == null) return 0;
  if (a == null) return -1;
  if (b == null) return 1;
  if (typeof a === 'number' || typeof b === 'number') {
    const x = Number(a), y = Number(b);
    if (!isNaN(x) && !isNaN(y)) return x < y ? -1 : x > y ? 1 : 0;
  }
  const s = String(a), t = String(b);
  return s < t ? -1 : s > t ? 1 : 0;
}

function _match(row, q) {
  if (q.eq) for (const c in q.eq) {
    const v = q.eq[c];
    if (v === null) { if (row[c] != null) return false; } else if (_cmp(row[c], v) !== 0) return false;
  }
  // Like SQL, comparisons never match a missing (null) value.
  if (q.neq) for (const c in q.neq) if (row[c] == null || _cmp(row[c], q.neq[c]) === 0) return false;
  if (q.gt) for (const c in q.gt) if (row[c] == null || !(_cmp(row[c], q.gt[c]) > 0)) return false;
  if (q.gte) for (const c in q.gte) if (row[c] == null || !(_cmp(row[c], q.gte[c]) >= 0)) return false;
  if (q.lt) for (const c in q.lt) if (row[c] == null || !(_cmp(row[c], q.lt[c]) < 0)) return false;
  if (q.lte) for (const c in q.lte) if (row[c] == null || !(_cmp(row[c], q.lte[c]) <= 0)) return false;
  if (q.in) for (const c in q.in) if (!q.in[c].some((v) => _cmp(row[c], v) === 0)) return false;
  if (q.like) for (const c in q.like) {
    if (!toS(row[c]).toLowerCase().includes(toS(q.like[c]).toLowerCase())) return false;
  }
  return true;
}

function _order(rows, order) {
  if (!order || !order.length) return rows;
  const ord = typeof order === 'string' ? [[order, 'asc']] : order;
  return rows.sort((a, b) => {
    for (const [c, dir] of ord) {
      const r = _cmp(a[c], b[c]);
      if (r) return dir === 'desc' ? -r : r;
    }
    return 0;
  });
}

function _subst(v, refs) {
  const out = {};
  for (const k in v) {
    const x = v[k];
    if (x && typeof x === 'object' && !Array.isArray(x) && '$ref' in x) out[k] = refs[x.$ref];
    else if (x && typeof x === 'object' && !Array.isArray(x) && '$pad' in x) {
      out[k] = (x.prefix || '') + String(refs[x.$pad]).padStart(x.width || 4, '0');
    } else out[k] = x;
  }
  return out;
}
function _id(x, refs) { return x && typeof x === 'object' ? refs[x.$ref] : x; }

class LocalStore {
  constructor(dbName) {
    this.dbName = dbName || 'kadaibill-local';
    this.kind = 'local';
    this.data = {};
    this.seq = {};
    for (const t of KB_TABLES) { this.data[t] = []; this.seq[t] = 0; }
  }

  async open() {
    if (typeof indexedDB === 'undefined') return;
    try {
      this.idb = await new Promise((res, rej) => {
        const r = indexedDB.open(this.dbName, 1);
        r.onupgradeneeded = () => r.result.createObjectStore('tables');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
      const all = await new Promise((res, rej) => {
        const out = {};
        const tx = this.idb.transaction('tables', 'readonly');
        const st = tx.objectStore('tables');
        const req = st.openCursor();
        req.onsuccess = () => {
          const c = req.result;
          if (c) { out[c.key] = c.value; c.continue(); } else res(out);
        };
        req.onerror = () => rej(req.error);
      });
      for (const t in all) {
        if (!KB_SCHEMA[t]) continue;
        this.data[t] = all[t].rows || [];
        this.seq[t] = all[t].seq || 0;
      }
    } catch (e) {
      console.warn('Browser storage unavailable; data will not be kept', e);
      this.idb = null;
    }
  }

  async _persist(tables) {
    if (!this.idb) return;
    await new Promise((res, rej) => {
      const tx = this.idb.transaction('tables', 'readwrite');
      const st = tx.objectStore('tables');
      for (const t of tables) st.put({ rows: this.data[t], seq: this.seq[t] }, t);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  }

  async select(table, q = {}) {
    if (!KB_SCHEMA[table]) throw new Error('Unknown table ' + table);
    if (q.in && Object.values(q.in).some((v) => !v.length)) return [];
    let rows = this.data[table].filter((r) => _match(r, q));
    rows = _order(rows, q.order);
    if (q.limit) rows = rows.slice(0, q.limit);
    return rows.map((r) => ({ ...r }));
  }

  _checkUnique(t, row) {
    for (const c of KB_UNIQUE[t] || []) {
      if (this.data[t].some((r) => r !== row && r[c] === row[c] && row[c] !== '' && row[c] != null)) {
        throw new Error(`duplicate key value violates unique constraint "${t}_${c}_key"`);
      }
    }
  }

  async apply(ops) {
    const backup = {};
    const touch = (t) => {
      if (!backup[t]) backup[t] = { rows: this.data[t].map((r) => ({ ...r })), seq: this.seq[t] };
    };
    const refs = {};
    try {
      for (const op of ops) {
        const t = op.t;
        if (op.op !== 'seq' && !KB_SCHEMA[t]) throw new Error(`Table ${t} is not allowed`);
        const v = _subst(op.v || {}, refs);
        const cols = KB_SCHEMA[t] || {};
        switch (op.op) {
          case 'insert': {
            touch(t);
            const row = kbFillRow(t, v);
            if ('id' in cols) {
              if (row.id == null) row.id = ++this.seq[t];
              else this.seq[t] = Math.max(this.seq[t], Number(row.id));
              if (this.data[t].some((r) => r.id === row.id)) throw new Error('duplicate id');
            } else if (this.data[t].some((r) => r.key === row.key)) {
              throw new Error(`duplicate key value violates unique constraint "${t}_pkey"`);
            }
            this._checkUnique(t, row);
            this.data[t].push(row);
            if (op.ref) refs[op.ref] = row.id;
            break;
          }
          case 'update': {
            touch(t);
            const id = _id(op.id, refs);
            const row = this.data[t].find((r) => r.id === id);
            if (row) {
              for (const k in v) if (k in cols) row[k] = v[k];
              this._checkUnique(t, row);
            }
            break;
          }
          case 'inc': {
            touch(t);
            const id = _id(op.id, refs);
            const row = this.data[t].find((r) => r.id === id);
            if (row) for (const k in v) row[k] = (Number(row[k]) || 0) + Number(v[k]);
            break;
          }
          case 'upsert': {
            touch(t);
            const on = op.on;
            const row = this.data[t].find((r) => _cmp(r[on], v[on]) === 0);
            if (row) { for (const k in v) if (k in cols) row[k] = v[k]; }
            else {
              const nr = kbFillRow(t, v);
              if ('id' in cols && nr.id == null) nr.id = ++this.seq[t];
              this.data[t].push(nr);
            }
            break;
          }
          case 'delete': {
            touch(t);
            if (op.id !== undefined) {
              const id = _id(op.id, refs);
              this.data[t] = this.data[t].filter((r) => r.id !== id);
            } else {
              const w = op.where || {};
              if (!Object.keys(w).length) throw new Error('delete needs a condition');
              this.data[t] = this.data[t].filter((r) => !Object.keys(w).every((k) => String(r[k]) === String(w[k])));
            }
            break;
          }
          case 'clear':
            touch(t);
            this.data[t] = [];
            break;
          case 'resync':
            touch(t);
            this.seq[t] = this.data[t].reduce((m, r) => Math.max(m, Number(r.id) || 0), 0);
            break;
          case 'seq': {
            touch('kb_counters');
            let c = this.data.kb_counters.find((r) => r.key === op.key);
            if (!c) { c = { key: op.key, fy: op.fy, value: 1 }; this.data.kb_counters.push(c); }
            else { c.value = c.fy === op.fy ? c.value + 1 : 1; c.fy = op.fy; }
            refs[op.ref] = c.value;
            break;
          }
          default:
            throw new Error('Unknown operation ' + op.op);
        }
      }
    } catch (e) {
      for (const t in backup) { this.data[t] = backup[t].rows; this.seq[t] = backup[t].seq; }
      throw e;
    }
    await this._persist(Object.keys(backup));
    return refs;
  }

  async rpc(name) {
    if (name === 'kb_join') return 'owner';
    return null;
  }

  /** Deletes everything stored in this browser. */
  async wipe() {
    for (const t of KB_TABLES) { this.data[t] = []; this.seq[t] = 0; }
    await this._persist(KB_TABLES);
  }
}

class SupabaseStore {
  constructor(url, key) {
    this.kind = 'cloud';
    this.url = url;
    this.sb = window.supabase.createClient(url, key, {
      auth: { persistSession: true, autoRefreshToken: true, storageKey: 'kadaibill-auth' },
    });
  }

  async open() {}

  _build(table, q, from, to) {
    let b = this.sb.from(table).select('*');
    if (q.eq) for (const c in q.eq) b = q.eq[c] === null ? b.is(c, null) : b.eq(c, q.eq[c]);
    if (q.neq) for (const c in q.neq) b = b.neq(c, q.neq[c]);
    if (q.gt) for (const c in q.gt) b = b.gt(c, q.gt[c]);
    if (q.gte) for (const c in q.gte) b = b.gte(c, q.gte[c]);
    if (q.lt) for (const c in q.lt) b = b.lt(c, q.lt[c]);
    if (q.lte) for (const c in q.lte) b = b.lte(c, q.lte[c]);
    if (q.in) for (const c in q.in) b = b.in(c, q.in[c]);
    if (q.like) for (const c in q.like) b = b.ilike(c, `%${toS(q.like[c]).replace(/[%_]/g, '')}%`);
    const ord = typeof q.order === 'string' ? [[q.order, 'asc']] : (q.order || []);
    for (const [c, dir] of ord) b = b.order(c, { ascending: dir !== 'desc' });
    if ('id' in KB_SCHEMA[table] && !ord.some(([c]) => c === 'id')) b = b.order('id', { ascending: true });
    return b.range(from, to);
  }

  async _selectOne(table, q) {
    const page = 1000;
    const limit = q.limit || Infinity;
    const out = [];
    for (let from = 0; out.length < limit; from += page) {
      const to = Math.min(from + page, limit) - 1;
      const { data, error } = await this._build(table, q, from, to);
      if (error) throw new Error(error.message);
      out.push(...data);
      if (data.length < to - from + 1) break;
    }
    return out;
  }

  async select(table, q = {}) {
    if (!KB_SCHEMA[table]) throw new Error('Unknown table ' + table);
    if (q.in && Object.values(q.in).some((v) => !v.length)) return [];
    // Long "in" lists are split so the request URL stays short.
    const big = q.in && Object.keys(q.in).find((c) => q.in[c].length > 150);
    if (!big) return this._selectOne(table, q);
    const out = [];
    for (const part of chunk(q.in[big], 150)) {
      out.push(...(await this._selectOne(table, { ...q, in: { ...q.in, [big]: part }, limit: undefined })));
    }
    _order(out, q.order);
    return q.limit ? out.slice(0, q.limit) : out;
  }

  async apply(ops) {
    const { data, error } = await this.sb.rpc('kb_apply', { ops });
    if (error) throw new Error(error.message);
    return data || {};
  }

  async rpc(name, args) {
    const { data, error } = await this.sb.rpc(name, args || {});
    if (error) throw new Error(error.message);
    return data;
  }

  async session() {
    const { data } = await this.sb.auth.getSession();
    return data.session;
  }
  async signIn(email, password) {
    const { data, error } = await this.sb.auth.signInWithPassword({ email, password });
    if (error) throw new Error(error.message);
    return data.session;
  }
  async signUp(email, password) {
    const { data, error } = await this.sb.auth.signUp({ email, password });
    if (error) throw new Error(error.message);
    return data.session;
  }
  async signOut() { await this.sb.auth.signOut(); }
  async members() {
    const { data, error } = await this.sb.from('shop_members').select('*').order('email');
    if (error) throw new Error(error.message);
    return data;
  }
}

// ---- engine.js ----
// ===== Billing engine: GST, discounts, offers, round-off =====

function itemPrice(it, list) {
  let p = toD(it.price_retail);
  if (list === 'wholesale' && toD(it.price_wholesale) > 0) p = toD(it.price_wholesale);
  if (list === 'member' && toD(it.price_member) > 0) p = toD(it.price_member);
  return p + toD(it.making_charge);
}
function itemName(it, lang) { return lang === 'ta' && toS(it.name_ta).trim() ? it.name_ta : it.name; }
function variantLabel(it) { return [it.size, it.color, it.style].filter((s) => toS(s).trim()).join(' / '); }
function isLoose(it) { return it.loose === 1 || ['kg', 'g', 'l', 'm'].includes(it.unit); }

function newCart() {
  return {
    lines: [], customer: null, priceList: 'retail', interstate: false, billDiscount: 0, coupon: null,
    note: '', salesperson: '', exchangeCode: '', exchangeValue: 0,
    couponDiscount: 0, slabDiscount: 0, slabName: '', subtotal: 0, lineDiscounts: 0, offerDiscounts: 0,
    taxable: 0, cgst: 0, sgst: 0, igst: 0, tax: 0, roundOff: 0, total: 0,
  };
}
function newLine(item, qty, unitPrice, manualDiscount) {
  return {
    item, qty, unitPrice, manualDiscount: manualDiscount || 0,
    offerDiscount: 0, offerName: '', billShare: 0, taxable: 0, tax: 0, total: 0,
  };
}
const lineGross = (l) => l.unitPrice * l.qty;
const lineNet = (l) => lineGross(l) - l.manualDiscount - l.offerDiscount;

function couponExpired(c) { return !!c.expiry && isoDate() > c.expiry; }

const Offers = {
  isLive(o, now) {
    if (!o.active) return false;
    const d = isoDate(now);
    if (o.start_date && d < o.start_date) return false;
    if (o.end_date && d > o.end_date) return false;
    if (o.start_time && o.end_time) {
      const t = `${two(now.getHours())}:${two(now.getMinutes())}`;
      if (t < o.start_time || t > o.end_time) return false;
    }
    return true;
  },
  ids(o) { return toS(o.item_ids).split(',').map((s) => parseInt(s.trim(), 10)).filter((n) => !isNaN(n)); },
  matches(o, it) {
    const ids = Offers.ids(o);
    if (ids.length) return ids.includes(it.id) || (it.parent_id != null && ids.includes(it.parent_id));
    if (toS(o.category).trim()) return o.category.trim().toLowerCase() === toS(it.category).trim().toLowerCase();
    return true;
  },
  apply(cart, offers, now) {
    for (const l of cart.lines) { l.offerDiscount = 0; l.offerName = ''; }
    cart.slabDiscount = 0;
    cart.slabName = '';
    const live = offers.filter((o) => Offers.isLive(o, now));
    if (!live.length) return;

    // Line offers: the best single offer per line wins (no stacking).
    for (const l of cart.lines) {
      const base = lineGross(l) - l.manualDiscount;
      let best = 0, name = '';
      for (const o of live) {
        if (o.type === 'combo' || o.type === 'slab' || !Offers.matches(o, l.item)) continue;
        let d = 0;
        if (o.type === 'percent' && l.qty >= toD(o.min_qty)) d = base * toD(o.value) / 100;
        if (o.type === 'flat' && l.qty >= toD(o.min_qty)) d = toD(o.value) * l.qty;
        if (o.type === 'bxgy' && toD(o.buy_qty) > 0 && toD(o.get_qty) > 0) {
          const set = toD(o.buy_qty) + toD(o.get_qty);
          d = Math.floor(l.qty / set) * toD(o.get_qty) * l.unitPrice;
        }
        if (d > best) { best = d; name = o.name; }
      }
      if (best > base) best = base;
      l.offerDiscount = r2(best);
      l.offerName = name;
    }

    // Combos: fixed price for one of each listed item.
    for (const o of live.filter((o) => o.type === 'combo')) {
      const ids = Offers.ids(o);
      if (ids.length < 2 || toD(o.combo_price) <= 0) continue;
      const lines = [];
      let sets = Infinity;
      let ok = true;
      for (const id of ids) {
        const found = cart.lines.find((l) => l.item.id === id && l.offerDiscount === 0);
        if (!found) { ok = false; break; }
        lines.push(found);
        sets = Math.min(sets, Math.floor(found.qty));
      }
      if (!ok || sets < 1) continue;
      const regular = sum(lines, (l) => l.unitPrice);
      const saving = (regular - toD(o.combo_price)) * sets;
      if (saving <= 0 || regular <= 0) continue;
      for (const l of lines) { l.offerDiscount = r2(saving * l.unitPrice / regular); l.offerName = o.name; }
    }

    // Bill slabs: "1000:5,2000:10" = 5% above ₹1000, 10% above ₹2000.
    const billValue = sum(cart.lines, lineNet);
    for (const o of live.filter((o) => o.type === 'slab')) {
      let pct = 0;
      for (const part of toS(o.slabs).split(',')) {
        const [a, b] = part.split(':');
        if (b === undefined) continue;
        if (billValue >= toD(a) && toD(b) > pct) pct = toD(b);
      }
      const d = r2(billValue * pct / 100);
      if (d > cart.slabDiscount) { cart.slabDiscount = d; cart.slabName = o.name; }
    }
  },
};

const Billing = {
  /** Recomputes offers, discounts, GST and totals. */
  compute(c, offers, opts = {}) {
    const now = opts.now || new Date();
    const roundOff = opts.roundOff !== false;
    Offers.apply(c, offers || [], now);
    for (const l of c.lines) {
      if (l.manualDiscount > lineGross(l)) l.manualDiscount = lineGross(l);
      if (l.manualDiscount < 0) l.manualDiscount = 0;
    }
    const sumNet = sum(c.lines, lineNet);
    c.couponDiscount = 0;
    const cp = c.coupon;
    if (cp && !couponExpired(cp) && !cp.used && sumNet >= toD(cp.min_bill)) {
      c.couponDiscount = r2(cp.is_percent ? sumNet * toD(cp.value) / 100 : toD(cp.value));
    }
    let billLevel = c.billDiscount + c.slabDiscount + c.couponDiscount;
    if (billLevel > sumNet) billLevel = sumNet;
    if (billLevel < 0) billLevel = 0;

    let subtotal = 0, lineDisc = 0, offerDisc = 0, taxable = 0, tax = 0;
    for (const l of c.lines) {
      l.billShare = sumNet > 0 ? billLevel * lineNet(l) / sumNet : 0;
      const value = lineNet(l) - l.billShare;
      const rate = toD(l.item.gst_rate);
      if (l.item.tax_inclusive) {
        l.taxable = r2(value / (1 + rate / 100));
        l.tax = r2(value - l.taxable);
        l.total = r2(value);
      } else {
        l.taxable = r2(value);
        l.tax = r2(value * rate / 100);
        l.total = r2(l.taxable + l.tax);
      }
      subtotal += lineGross(l);
      lineDisc += l.manualDiscount;
      offerDisc += l.offerDiscount;
      taxable += l.taxable;
      tax += l.tax;
    }
    c.subtotal = r2(subtotal);
    c.lineDiscounts = r2(lineDisc);
    c.offerDiscounts = r2(offerDisc);
    c.taxable = r2(taxable);
    tax = r2(tax);
    if (c.interstate) { c.igst = tax; c.cgst = 0; c.sgst = 0; }
    else { c.cgst = r2(tax / 2); c.sgst = r2(tax - c.cgst); c.igst = 0; }
    c.tax = tax;
    const raw = r2(c.taxable + tax);
    const rounded = roundOff ? Math.round(raw) : raw;
    c.roundOff = r2(rounded - raw);
    c.total = r2(rounded);
    return c;
  },

  gstByRate(lines) {
    const out = new Map();
    for (const l of lines) {
      const rate = toD(l.gst_rate);
      const p = out.get(rate) || [0, 0];
      out.set(rate, [p[0] + toD(l.taxable), p[1] + toD(l.tax)]);
    }
    return [...out.entries()].sort((a, b) => a[0] - b[0]);
  },
};

/** Weighing-scale EAN-13 labels: prefix + item code + 5 digits + check digit. */
const ScaleBarcode = {
  parse(raw, prefix) {
    const s = toS(raw).trim();
    if (!prefix || s.length !== 13 || !s.startsWith(prefix) || !/^\d{13}$/.test(s)) return null;
    const codeEnd = 7;
    if (codeEnd <= prefix.length) return null;
    return { itemCode: s.substring(prefix.length, codeEnd), value: parseInt(s.substring(codeEnd, 12), 10) };
  },
  matches(itemCode, code) {
    if (itemCode === code) return true;
    return /^\d+$/.test(itemCode) && /^\d+$/.test(toS(code)) && parseInt(itemCode, 10) === parseInt(code, 10);
  },
};

const Data = {

  },
  async loadItems() {
    App.items = await App.store.select('items', { order: [['name', 'asc']] });
    App.itemMap = new Map(App.items.map((i) => [i.id, i]));
  },
  async loadCustomers() { App.customers = await App.store.select('customers', { order: [['name', 'asc']] }); },
  async loadSuppliers() { App.suppliers = await App.store.select('suppliers', { order: [['name', 'asc']] }); },
  async loadUsers() { App.users = await App.store.select('users', { order: [['name', 'asc']] }); },
  async loadOffers() { App.offers = await App.store.select('offers', { eq: { active: 1 } }); },
  async loadAll() {
    await Promise.all([Data.loadSettings(), Data.loadItems(), Data.loadCustomers(), Data.loadSuppliers(),
      Data.loadUsers(), Data.loadOffers()]);
  },
  async refreshCustomer(id) {
    if (id == null) return null;
    const [row] = await App.store.select('customers', { eq: { id } });
    if (!row) return null;
    const i = App.customers.findIndex((c) => c.id === id);
    if (i >= 0) App.customers[i] = row; else App.customers.push(row);
    return row;
  },
  async refreshItems(ids) {
    if (!ids.length) return;
    const rows = await App.store.select('items', { in: { id: ids } });
    for (const r of rows) {
      App.itemMap.set(r.id, r);
      const i = App.items.findIndex((x) => x.id === r.id);
      if (i >= 0) App.items[i] = r; else App.items.push(r);
    }
  },
  customer(id) { return App.customers.find((c) => c.id === id) || null; },
  supplier(id) { return App.suppliers.find((c) => c.id === id) || null; },
  userName(id) { return App.users.find((u) => u.id === id)?.name || ''; },
  parentIds() { return new Set(App.items.filter((i) => i.parent_id != null && i.active).map((i) => i.parent_id)); },
  categories() { return [...new Set(App.items.map((i) => i.category).filter(Boolean))].sort(); },
};

// ---------- operation helpers ----------
function auditOp(action, detail) {
  return { op: 'insert', t: 'audit_log', v: { date: nowIso(), user_id: App.user?.id ?? null, action, detail: toS(detail) } };
}
async function audit(action, detail) { await App.store.apply([auditOp(action, detail)]); }

const DOC_PREFIX = { bill: () => App.s('bill_prefix', 'INV'), return: () => 'CN', po: () => 'PO', grn: () => 'GRN', pret: () => 'PR', gv: () => 'GV' };
/** Operation that takes the next document number (resets each financial year). */
function seqOp(kind, ref) { return { op: 'seq', key: kind, fy: fyLabel(), ref }; }
function docPrefix(kind) { return `${DOC_PREFIX[kind]()}/${fyLabel()}/`; }
function docNoValue(kind, ref) { return { $pad: ref, prefix: docPrefix(kind), width: 4 }; }
function docNo(kind, n) { return docPrefix(kind) + String(n).padStart(4, '0'); }

async function saveSettings(map) {
  const ops = Object.entries(map).map(([key, value]) => ({ op: 'upsert', t: 'settings', on: 'key', v: { key, value: toS(value) } }));
  if (!ops.length) return;
  await App.store.apply(ops);
  Object.assign(App.settings, Object.fromEntries(Object.entries(map).map(([k, v]) => [k, toS(v)])));
  LANG = App.lang;
  App.touch();
}

/**
 * Operations that change stock and record the movement. Batch-tracked items
 * use the earliest-expiring batches first. [batches] is a working copy of the
 * item's batch rows, updated here so several lines stay consistent.
 */
function stockOps(item, qty, type, refValue, note, batches) {
  const ops = [
    { op: 'inc', t: 'items', id: item.id, v: { stock: qty } },
    { op: 'insert', t: 'stock_moves', v: { item_id: item.id, date: nowIso(), type, qty, ref: refValue, user_id: App.user?.id ?? null, note: toS(note) } },
  ];
  if (!item.track_batch || !qty || !batches) return ops;
  if (qty < 0) {
    let remaining = -qty;
    const list = batches.filter((b) => b.item_id === item.id && b.qty > 0)
      .sort((a, b) => (a.expiry ? 0 : 1) - (b.expiry ? 0 : 1) || toS(a.expiry).localeCompare(toS(b.expiry)) || a.id - b.id);
    for (const b of list) {
      if (remaining <= 0) break;
      const take = Math.min(b.qty, remaining);
      ops.push({ op: 'inc', t: 'batches', id: b.id, v: { qty: -take } });
      b.qty -= take;
      remaining -= take;
    }
  } else {
    const latest = batches.filter((b) => b.item_id === item.id).sort((a, b) => b.id - a.id)[0];
    if (latest) { ops.push({ op: 'inc', t: 'batches', id: latest.id, v: { qty } }); latest.qty += qty; }
  }
  return ops;
}

async function batchesFor(itemIds) {
  if (!itemIds.length) return [];
  return App.store.select('batches', { in: { item_id: itemIds } });
}

function adjustCachedStock(itemId, qty) {
  const it = App.itemMap.get(itemId);
  if (it) it.stock = r2((Number(it.stock) || 0) + qty);
}

// ===== Bills, returns, cancellations, vouchers, shifts, held bills =====

const Sales = {
  /** Saves a completed bill with stock, payments, khata, loyalty and vouchers. */
  async saveSale(cart, tenders) {
    const user = App.user;
    const now = nowIso();
    const earnRate = App.d('points_per_100', 1);
    const pointValue = App.d('point_value', 1);
    const redeemedRs = sum(tenders.filter((t) => t.mode === 'points'), (t) => t.amount);
    const pointsRedeemed = pointValue > 0 ? r2(redeemedRs / pointValue) : 0;
    const pointsEarned = cart.customer ? Math.floor((cart.total - redeemedRs) / 100 * earnRate) : 0;
    const billNo = docNoValue('bill', 'n');
    const batches = await batchesFor(cart.lines.filter((l) => l.item.track_batch).map((l) => l.item.id));
    const voucherCodes = tenders.filter((t) => t.mode === 'voucher' && t.ref).map((t) => t.ref);
    const vouchers = voucherCodes.length
      ? await App.store.select('coupons', { in: { code: voucherCodes } }) : [];

    const ops = [seqOp('bill', 'n')];
    ops.push({
      op: 'insert', t: 'sales', ref: 'sale', v: {
        bill_no: billNo, kind: 'sale', date: now, customer_id: cart.customer?.id ?? null, user_id: user.id,
        shift_id: App.shiftId, price_list: cart.priceList, interstate: cart.interstate ? 1 : 0,
        subtotal: cart.subtotal, line_discount: cart.lineDiscounts,
        offer_discount: r2(cart.offerDiscounts + cart.slabDiscount),
        bill_discount: r2(cart.billDiscount + cart.couponDiscount), coupon_code: cart.coupon?.code || '',
        taxable: cart.taxable, cgst: cart.cgst, sgst: cart.sgst, igst: cart.igst, round_off: cart.roundOff,
        total: cart.total, points_earned: pointsEarned, points_redeemed: pointsRedeemed, status: 'completed',
        note: cart.note, salesperson: cart.salesperson,
      },
    });
    for (const l of cart.lines) {
      const vl = variantLabel(l.item);
      ops.push({
        op: 'insert', t: 'sale_lines', v: {
          sale_id: { $ref: 'sale' }, item_id: l.item.id, name: vl ? `${l.item.name} (${vl})` : l.item.name,
          hsn: l.item.hsn, unit: l.item.unit, qty: l.qty, unit_price: l.unitPrice, mrp: toD(l.item.mrp),
          discount: r2(l.manualDiscount + l.offerDiscount + l.billShare), offer_name: l.offerName,
          gst_rate: toD(l.item.gst_rate), taxable: l.taxable, tax: l.tax, total: l.total, cost: toD(l.item.cost),
        },
      });
      ops.push(...stockOps(l.item, -l.qty, 'sale', billNo, '', batches));
    }
    for (const t of tenders) {
      ops.push({ op: 'insert', t: 'payments', v: { sale_id: { $ref: 'sale' }, mode: t.mode, amount: r2(t.amount), ref: t.ref || '' } });
      if (t.mode === 'credit' && cart.customer) {
        ops.push({ op: 'insert', t: 'khata', v: { customer_id: cart.customer.id, date: now, type: 'credit', amount: r2(t.amount), sale_id: { $ref: 'sale' }, note: billNo, user_id: user.id, shift_id: App.shiftId } });
        ops.push({ op: 'inc', t: 'customers', id: cart.customer.id, v: { credit_balance: r2(t.amount) } });
      }
      if (t.mode === 'voucher' && t.ref) {
        const v = vouchers.find((x) => x.code === t.ref);
        if (!v || toD(v.balance) + 0.009 < t.amount) throw new Error(tr('Voucher not valid or no balance'));
        ops.push({ op: 'inc', t: 'coupons', id: v.id, v: { balance: -r2(t.amount) } });
        if (toD(v.balance) - t.amount <= 0.009) ops.push({ op: 'update', t: 'coupons', id: v.id, v: { used: 1 } });
        v.balance = toD(v.balance) - t.amount;
      }
    }
    if (cart.coupon && cart.couponDiscount > 0) ops.push({ op: 'update', t: 'coupons', id: cart.coupon.id, v: { used: 1 } });
    if (cart.customer) {
      const delta = pointsEarned - pointsRedeemed;
      if (delta) ops.push({ op: 'inc', t: 'customers', id: cart.customer.id, v: { points: delta } });
      if (pointsEarned > 0) ops.push({ op: 'insert', t: 'points_log', v: { customer_id: cart.customer.id, date: now, points: pointsEarned, sale_id: { $ref: 'sale' }, note: 'Earned' } });
      if (pointsRedeemed > 0) ops.push({ op: 'insert', t: 'points_log', v: { customer_id: cart.customer.id, date: now, points: -pointsRedeemed, sale_id: { $ref: 'sale' }, note: 'Redeemed' } });
    }
    if (cart.billDiscount > 0 || cart.lineDiscounts > 0) {
      ops.push(auditOp('discount', `line ${amt(cart.lineDiscounts)} bill ${amt(cart.billDiscount)}`));
    }
    const refs = await App.store.apply(ops);
    for (const l of cart.lines) adjustCachedStock(l.item.id, -l.qty);
    if (cart.customer) await Data.refreshCustomer(cart.customer.id);
    return { saleId: refs.sale, billNo: docNo('bill', refs.n) };
  },

  async sale(id) {
    const [s] = await App.store.select('sales', { eq: { id } });
    if (!s) return null;
    const c = s.customer_id != null ? (Data.customer(s.customer_id) || (await Data.refreshCustomer(s.customer_id))) : null;
    let refBill = '';
    if (s.ref_sale_id != null) {
      const [r] = await App.store.select('sales', { eq: { id: s.ref_sale_id } });
      refBill = r?.bill_no || '';
    }
    return {
      ...s, customer_name: c?.name || '', customer_phone: c?.phone || '', customer_gstin: c?.gstin || '',
      customer_points: c?.points || 0, customer_credit: c?.credit_balance || 0, user_name: Data.userName(s.user_id),
      ref_bill_no: refBill,
    };
  },
  async lines(saleId) {
    const rows = await App.store.select('sale_lines', { eq: { sale_id: saleId }, order: [['id', 'asc']] });
    return rows.map((l) => ({ ...l, name_ta: App.itemMap.get(l.item_id)?.name_ta || '' }));
  },
  payments(saleId) { return App.store.select('payments', { eq: { sale_id: saleId }, order: [['id', 'asc']] }); },

  async recentBills(query = '', limit = 200) {
    const q = query.trim().toLowerCase();
    let rows;
    if (!q) rows = await App.store.select('sales', { order: [['id', 'desc']], limit });
    else {
      const custIds = App.customers.filter((c) => c.name.toLowerCase().includes(q) || toS(c.phone).includes(q)).map((c) => c.id);
      const byNo = await App.store.select('sales', { like: { bill_no: q }, order: [['id', 'desc']], limit });
      const byCust = custIds.length ? await App.store.select('sales', { in: { customer_id: custIds.slice(0, 300) }, order: [['id', 'desc']], limit }) : [];
      const m = new Map([...byNo, ...byCust].map((r) => [r.id, r]));
      rows = [...m.values()].sort((a, b) => b.id - a.id).slice(0, limit);
    }
    return rows.map((r) => ({ ...r, customer_name: Data.customer(r.customer_id)?.name || '', customer_phone: Data.customer(r.customer_id)?.phone || '' }));
  },

  /** Credit note for returned quantities. refundMode: cash | upi | credit (khata) | voucher (store credit). */
  async saveReturn({ saleId, qtyByLine, refundMode, reason, approvedBy }) {
    const user = App.user;
    const original = await Sales.sale(saleId);
    const origLines = await Sales.lines(saleId);
    const now = nowIso();
    let taxable = 0, tax = 0, subtotal = 0;
    const ret = [];
    for (const l of origLines) {
      const q = qtyByLine[l.id] || 0;
      if (q <= 0 || toD(l.qty) <= 0) continue;
      const f = q / toD(l.qty);
      const lt = r2(toD(l.taxable) * f), lx = r2(toD(l.tax) * f), lTotal = r2(toD(l.total) * f);
      taxable += lt; tax += lx; subtotal += toD(l.unit_price) * q;
      ret.push({ l, q, lt, lx, lTotal });
    }
    if (!ret.length) throw new Error(tr('Enter the quantity to return'));
    tax = r2(tax);
    const inter = original.interstate === 1;
    const cg = inter ? 0 : r2(tax / 2), sg = inter ? 0 : r2(tax - cg), ig = inter ? tax : 0;
    const raw = r2(taxable + tax);
    const rounded = Math.round(raw);
    const no = docNoValue('return', 'n');
    const custId = original.customer_id;
    const items = ret.map((x) => App.itemMap.get(x.l.item_id)).filter(Boolean);
    const batches = await batchesFor(items.filter((i) => i.track_batch).map((i) => i.id));

    const ops = [seqOp('return', 'n')];
    ops.push({
      op: 'insert', t: 'sales', ref: 'ret', v: {
        bill_no: no, kind: 'return', ref_sale_id: saleId, date: now, customer_id: custId, user_id: user.id,
        shift_id: App.shiftId, price_list: original.price_list, interstate: inter ? 1 : 0, subtotal: r2(subtotal),
        taxable: r2(taxable), cgst: cg, sgst: sg, igst: ig, round_off: r2(rounded - raw), total: rounded,
        status: 'completed', note: reason || '',
      },
    });
    for (const x of ret) {
      ops.push({
        op: 'insert', t: 'sale_lines', v: {
          sale_id: { $ref: 'ret' }, item_id: x.l.item_id, name: x.l.name, hsn: x.l.hsn, unit: x.l.unit, qty: x.q,
          unit_price: x.l.unit_price, mrp: x.l.mrp, discount: r2(toD(x.l.discount) * x.q / toD(x.l.qty)),
          gst_rate: x.l.gst_rate, taxable: x.lt, tax: x.lx, total: x.lTotal, cost: x.l.cost, ref_line_id: x.l.id,
        },
      });
      ops.push({ op: 'inc', t: 'sale_lines', id: x.l.id, v: { returned_qty: x.q } });
      const it = App.itemMap.get(x.l.item_id);
      if (it) ops.push(...stockOps(it, x.q, 'return', no, '', batches));
    }
    let voucherCode = '';
    if (refundMode === 'voucher') {
      voucherCode = uid('SC');
      const days = parseInt(App.s('store_credit_days', '365'), 10) || 365;
      ops.push({ op: 'insert', t: 'coupons', v: { code: voucherCode, kind: 'voucher', value: rounded, balance: rounded, expiry: isoDate(addDays(new Date(), days)), customer_id: custId, created_at: now } });
    }
    ops.push({ op: 'insert', t: 'payments', v: { sale_id: { $ref: 'ret' }, mode: refundMode, amount: rounded, ref: voucherCode } });
    if (refundMode === 'credit' && custId != null) {
      ops.push({ op: 'insert', t: 'khata', v: { customer_id: custId, date: now, type: 'payment', amount: rounded, sale_id: { $ref: 'ret' }, mode: 'return', note: 'Return', user_id: user.id, shift_id: App.shiftId } });
      ops.push({ op: 'inc', t: 'customers', id: custId, v: { credit_balance: -rounded } });
    }
    const earned = toD(original.points_earned);
    if (custId != null && earned > 0 && toD(original.total) > 0) {
      const back = Math.min(Math.floor(earned * rounded / toD(original.total)), toD(original.customer_points));
      if (back > 0) {
        ops.push({ op: 'inc', t: 'customers', id: custId, v: { points: -back } });
        ops.push({ op: 'insert', t: 'points_log', v: { customer_id: custId, date: now, points: -back, sale_id: { $ref: 'ret' }, note: 'Reversed for return' } });
      }
    }
    ops.push(auditOp('return', `against ${original.bill_no} ${amt(rounded)} approved by ${approvedBy ?? user.id}: ${reason || ''}`));
    const refs = await App.store.apply(ops);
    for (const x of ret) adjustCachedStock(x.l.item_id, x.q);
    if (custId != null) await Data.refreshCustomer(custId);
    return { saleId: refs.ret, billNo: docNo('return', refs.n), voucherCode, voucherValue: rounded };
  },

  /** Cancels a bill: restores stock, reverses khata, points and vouchers. */
  async cancelBill(saleId, reason, approvedBy) {
    const s = await Sales.sale(saleId);
    if (!s || s.status !== 'completed' || s.kind !== 'sale') return;
    const ls = await Sales.lines(saleId);
    const pays = await Sales.payments(saleId);
    const items = ls.map((l) => App.itemMap.get(l.item_id)).filter(Boolean);
    const batches = await batchesFor(items.filter((i) => i.track_batch).map((i) => i.id));
    const ops = [];
    const restore = [];
    for (const l of ls) {
      const q = toD(l.qty) - toD(l.returned_qty);
      const it = App.itemMap.get(l.item_id);
      if (!it || q <= 0) continue;
      ops.push(...stockOps(it, q, 'cancel', s.bill_no, '', batches));
      restore.push([it.id, q]);
    }
    const custId = s.customer_id;
    const codes = pays.filter((p) => p.mode === 'voucher' && p.ref).map((p) => p.ref);
    const vouchers = codes.length ? await App.store.select('coupons', { in: { code: codes } }) : [];
    for (const p of pays) {
      if (p.mode === 'credit' && custId != null) {
        ops.push({ op: 'inc', t: 'customers', id: custId, v: { credit_balance: -toD(p.amount) } });
        ops.push({ op: 'insert', t: 'khata', v: { customer_id: custId, date: nowIso(), type: 'payment', amount: toD(p.amount), sale_id: saleId, mode: 'cancel', note: `Cancelled ${s.bill_no}`, user_id: App.user.id } });
      }
      if (p.mode === 'voucher' && p.ref) {
        const v = vouchers.find((x) => x.code === p.ref);
        if (v) {
          ops.push({ op: 'inc', t: 'coupons', id: v.id, v: { balance: toD(p.amount) } });
          ops.push({ op: 'update', t: 'coupons', id: v.id, v: { used: 0 } });
        }
      }
    }
    if (custId != null) {
      const c = Data.customer(custId);
      let delta = toD(s.points_redeemed) - toD(s.points_earned);
      if (c && toD(c.points) + delta < 0) delta = -toD(c.points);
      if (delta) ops.push({ op: 'inc', t: 'customers', id: custId, v: { points: delta } });
    }
    ops.push({ op: 'update', t: 'sales', id: saleId, v: { status: 'void', note: `Cancelled: ${reason}` } });
    ops.push(auditOp('bill_cancel', `${s.bill_no} ${amt(s.total)} approved by ${approvedBy}: ${reason}`));
    await App.store.apply(ops);
    for (const [id, q] of restore) adjustCachedStock(id, q);
    if (custId != null) await Data.refreshCustomer(custId);
  },

  async findCoupon(code, kind) {
    const c = toS(code).trim().toUpperCase();
    if (!c) return null;
    const rows = await App.store.select('coupons', { eq: { code: c, kind } });
    return rows[0] || null;
  },

  /** Sells a gift voucher. The money is an advance, not a sale. */
  async sellVoucher({ value, mode, ref, customerId }) {
    const days = parseInt(App.s('voucher_days', '365'), 10) || 365;
    const code = uid('GV');
    const expiry = isoDate(addDays(new Date(), days));
    const now = nowIso();
    const refs = await App.store.apply([
      seqOp('gv', 'n'),
      { op: 'insert', t: 'coupons', v: { code, kind: 'voucher', value, balance: value, expiry, customer_id: customerId ?? null, created_at: now } },
      {
        op: 'insert', t: 'sales', ref: 'sale', v: {
          bill_no: docNoValue('gv', 'n'), kind: 'voucher', date: now, customer_id: customerId ?? null,
          user_id: App.user.id, shift_id: App.shiftId, subtotal: value, total: value, coupon_code: code,
          status: 'completed', note: `Valid until ${expiry}`,
        },
      },
      { op: 'insert', t: 'payments', v: { sale_id: { $ref: 'sale' }, mode, amount: value, ref: ref || '' } },
      auditOp('voucher_sale', `${code} ${amt(value)} ${mode}`),
    ]);
    return { saleId: refs.sale, billNo: docNo('gv', refs.n), voucherCode: code, voucherValue: value };
  },
};

const Shifts = {
  async current(userId) {
    const rows = await App.store.select('shifts', { eq: { user_id: userId, status: 'open' }, order: [['id', 'desc']], limit: 1 });
    return rows[0] || null;
  },
  async open(openingCash) {
    const refs = await App.store.apply([
      { op: 'insert', t: 'shifts', ref: 's', v: { user_id: App.user.id, opened_at: nowIso(), opening_cash: openingCash, status: 'open' } },
      auditOp('shift_open', `Opening ${amt(openingCash)}`),
    ]);
    App.shiftId = refs.s;
    return refs.s;
  },
  async summary(shiftId) {
    const [shift] = await App.store.select('shifts', { eq: { id: shiftId } });
    const out = { opening: toD(shift?.opening_cash), bills: 0, sales: 0, returns: 0, vouchers: 0 };
    const sales = await App.store.select('sales', { eq: { shift_id: shiftId, status: 'completed' } });
    for (const s of sales) {
      if (s.kind === 'sale') { out.bills++; out.sales += toD(s.total); }
      if (s.kind === 'return') out.returns += toD(s.total);
      if (s.kind === 'voucher') out.vouchers += toD(s.total);
    }
    const kindById = new Map(sales.map((s) => [s.id, s.kind]));
    const pays = sales.length ? await App.store.select('payments', { in: { sale_id: sales.map((s) => s.id) } }) : [];
    for (const p of pays) {
      const key = `${kindById.get(p.sale_id)}_${p.mode}`;
      out[key] = (out[key] || 0) + toD(p.amount);
    }
    const kh = await App.store.select('khata', { eq: { shift_id: shiftId, type: 'payment', mode: 'cash' } });
    out.khata_cash = sum(kh, (k) => k.amount);
    const moves = await App.store.select('cash_moves', { eq: { shift_id: shiftId } });
    out.cash_in = sum(moves.filter((m) => m.type === 'in'), (m) => m.amount);
    out.cash_out = sum(moves.filter((m) => m.type === 'out'), (m) => m.amount);
    out.expected = r2(out.opening + (out.sale_cash || 0) + (out.voucher_cash || 0) - (out.return_cash || 0) + out.khata_cash + out.cash_in - out.cash_out);
    for (const k in out) out[k] = r2(out[k]);
    return out;
  },
  async cashMove(type, amount, note) {
    await App.store.apply([
      { op: 'insert', t: 'cash_moves', v: { shift_id: App.shiftId, date: nowIso(), type, amount, note, user_id: App.user.id } },
      auditOp(`cash_${type}`, `${amt(amount)} ${note}`),
    ]);
  },
  async close(shiftId, counted, denoms) {
    const sm = await Shifts.summary(shiftId);
    const d = Object.entries(denoms).filter(([, n]) => n > 0).map(([k, n]) => `${k}x${n}`).join(',');
    await App.store.apply([
      { op: 'update', t: 'shifts', id: shiftId, v: { closed_at: nowIso(), closing_cash: counted, expected_cash: sm.expected, denominations: d, status: 'closed' } },
      auditOp('shift_close', `Counted ${amt(counted)} expected ${amt(sm.expected)}`),
    ]);
    App.shiftId = null;
    return sm;
  },
};

const Held = {
  toJson(c) {

      customer_id: c.customer?.id ?? null, price_list: c.priceList, interstate: c.interstate, bill_discount: c.billDiscount,
      coupon: c.coupon?.code || '', note: c.note, salesperson: c.salesperson, exchange_code: c.exchangeCode,
      exchange_value: c.exchangeValue,
      lines: c.lines.map((l) => ({ item_id: l.item.id, qty: l.qty, unit_price: l.unitPrice, disc: l.manualDiscount })),

  },
  async fromJson(m) {
    const c = newCart();
    c.priceList = m.price_list || 'retail';
    c.interstate = !!m.interstate;
    c.billDiscount = toD(m.bill_discount);
    c.note = toS(m.note);
    c.salesperson = toS(m.salesperson);

const Inventory = {
  nextCode() {
    let m = 100000;
    for (const i of App.items) if (/^\d+$/.test(i.code)) m = Math.max(m, parseInt(i.code, 10));
    return String(m + 1);
  },
  codeExists(code, exceptId) { return App.items.some((i) => i.code === code && i.id !== exceptId); },

  /** Saves an item. New items record their opening stock as a movement. */
  async saveItem(item, opts = {}) {
    const v = { ...item };
    delete v.id;
    if (item.id == null) {
      const qty = toD(opts.openingStock);
      v.stock = 0;
      v.created_at = nowIso();
      const ops = [{ op: 'insert', t: 'items', ref: 'it', v }];
      if (qty) {
        ops.push({ op: 'inc', t: 'items', id: { $ref: 'it' }, v: { stock: qty } });
        ops.push({ op: 'insert', t: 'stock_moves', v: { item_id: { $ref: 'it' }, date: nowIso(), type: 'opening', qty, ref: 'Opening', user_id: App.user?.id ?? null, note: 'Opening stock' } });
        if (v.track_batch) ops.push({ op: 'insert', t: 'batches', v: { item_id: { $ref: 'it' }, batch_no: toS(opts.batchNo), expiry: toS(opts.expiry), qty, cost: toD(v.cost), created_at: nowIso() } });
      }
      if (!opts.noAudit) ops.push(auditOp('item_add', `${v.code} ${v.name}`));
      const refs = await App.store.apply(ops);
      const row = { ...kbFillRow('items', v), id: refs.it, stock: qty };
      App.items.push(row);
      App.itemMap.set(row.id, row);
      return refs.it;
    }
    delete v.stock;
    const ops = [{ op: 'update', t: 'items', id: item.id, v }];
    if (!opts.noAudit) ops.push(auditOp('item_edit', `${v.code} ${v.name}`));
    await App.store.apply(ops);
    const cached = App.itemMap.get(item.id);
    if (cached) Object.assign(cached, v);
    return item.id;
  },

  async createVariants(parent, sizes, colors) {
    const s = sizes.length ? sizes : [''];
    const c = colors.length ? colors : [''];
    let n = 0;
    for (const size of s) for (const color of c) {
      const suffix = [size, color].filter(Boolean).map((x) => x.replace(/\s/g, '').toUpperCase()).join('-');
      if (!suffix) continue;
      const code = `${parent.code}-${suffix}`;
      if (Inventory.codeExists(code)) continue;
      await Inventory.saveItem({ ...parent, id: null, code, parent_id: parent.id, size, color }, { noAudit: true });
      n++;
    }
    await audit('variants', `${parent.code}: ${n} created`);
    return n;
  },

  async bulkPriceUpdate({ category, field, percent, roundTo }) {
    const list = App.items.filter((i) => !category || i.category === category);
    const f = (v) => {
      v = toD(v);
      if (v <= 0) return v;
      let n = v * (1 + percent / 100);
      if (roundTo > 0) n = Math.round(n / roundTo) * roundTo;
      return r2(n);
    };
    const ops = [];
    const changes = [];
    for (const it of list) {
      const m = {};
      if (field === 'retail' || field === 'all') m.price_retail = f(it.price_retail);
      if (field === 'wholesale' || field === 'all') m.price_wholesale = f(it.price_wholesale);
      if (field === 'member' || field === 'all') m.price_member = f(it.price_member);
      if (field === 'mrp' || field === 'all') m.mrp = f(it.mrp);
      const mrp = m.mrp ?? toD(it.mrp);
      const retail = m.price_retail ?? toD(it.price_retail);
      if (mrp > 0 && retail > mrp) m.price_retail = mrp;
      ops.push({ op: 'update', t: 'items', id: it.id, v: m });
      changes.push([it, m]);
    }
    ops.push(auditOp('bulk_price', `${category || 'all'} ${field} ${percent}% round ${roundTo} (${list.length} items)`));
    for (const part of chunk(ops, 400)) await App.store.apply(part);
    for (const [it, m] of changes) Object.assign(it, m);
    return list.length;
  },

  async adjust(item, delta, reason, note) {
    const batches = item.track_batch ? await batchesFor([item.id]) : null;
    await App.store.apply([...stockOps(item, delta, reason, 'ADJ', note, batches), auditOp(`stock_${reason}`, `${item.code} ${qtyFmt(delta)} ${note}`)]);
    adjustCachedStock(item.id, delta);
  },

  /** Physical count: each difference becomes an "audit" movement. */
  async postAudit(counts) {
    const ops = [];
    const changed = [];
    const ids = Object.keys(counts).map(Number);
    const fresh = await App.store.select('items', { in: { id: ids } });
    const batches = await batchesFor(fresh.filter((i) => i.track_batch).map((i) => i.id));
    for (const it of fresh) {
      const diff = r2(counts[it.id] - toD(it.stock));
      if (Math.abs(diff) < 0.0005) continue;
      ops.push(...stockOps(it, diff, 'audit', 'AUDIT', `Physical count ${qtyFmt(counts[it.id])}`, batches));
      changed.push(it.id);
    }
    ops.push(auditOp('stock_audit', `${changed.length} items adjusted`));
    await App.store.apply(ops);
    await Data.refreshItems(changed);
    return changed.length;
  },

  batches(itemId) { return App.store.select('batches', { eq: { item_id: itemId }, order: [['expiry', 'asc']] }); },
  moves(itemId) { return App.store.select('stock_moves', { eq: { item_id: itemId }, order: [['id', 'desc']], limit: 200 }); },
  variants(parentId) { return App.items.filter((i) => i.parent_id === parentId && i.active).sort((a, b) => (a.size + a.color).localeCompare(b.size + b.color)); },
  lowStock() { return App.items.filter((i) => i.active && toD(i.reorder_level) > 0 && toD(i.stock) <= toD(i.reorder_level)); },
  async expiring(days) {
    const limit = isoDate(addDays(new Date(), days));
    const rows = await App.store.select('batches', { gt: { qty: 0 }, neq: { expiry: '' }, lte: { expiry: limit }, order: [['expiry', 'asc']] });
    return rows.map((b) => ({ ...b, name: App.itemMap.get(b.item_id)?.name || '', code: App.itemMap.get(b.item_id)?.code || '' }));
  },
  async slowMoving(days) {
    const since = addDays(new Date(), -days).toISOString();
    const sold = await App.store.select('stock_moves', { eq: { type: 'sale' }, gte: { date: since } });
    const soldIds = new Set(sold.map((m) => m.item_id));
    const all = await App.store.select('stock_moves', { eq: { type: 'sale' }, order: [['date', 'desc']] });
    const last = new Map();
    for (const m of all) if (!last.has(m.item_id)) last.set(m.item_id, m.date);
    return App.items
      .filter((i) => i.active && toD(i.stock) > 0 && !soldIds.has(i.id))
      .map((i) => ({ ...i, last_sale: last.get(i.id) || null }))
      .sort((a, b) => toD(b.stock) * toD(b.cost) - toD(a.stock) * toD(a.cost));
  },
};

// ---------- purchase ----------
/** An editable purchase line. qty/free/cost are in packs when inPacks. */
function newPurchaseLine(item, o = {}) {
  const packQty = toD(item.pack_qty) > 1 ? toD(item.pack_qty) : 1;
  const inPacks = o.inPacks ?? packQty > 1;
  return {
    item, qty: o.qty ?? 1, freeQty: o.freeQty || 0, inPacks,
    cost: o.cost ?? (inPacks ? toD(item.cost) * packQty : toD(item.cost)),
    gstRate: o.gstRate ?? toD(item.gst_rate), batchNo: o.batchNo || '', expiry: o.expiry || '',
    poLineId: o.poLineId ?? null, ordered: o.ordered || 0,
  };
}
const PL = {
  pack: (l) => (l.inPacks && toD(l.item.pack_qty) > 1 ? toD(l.item.pack_qty) : 1),
  baseQty: (l) => l.qty * PL.pack(l),
  baseFree: (l) => l.freeQty * PL.pack(l),
  baseCost: (l) => l.cost / PL.pack(l),
  taxable: (l) => l.qty * l.cost,
  tax: (l) => l.qty * l.cost * l.gstRate / 100,
  total: (l) => PL.taxable(l) + PL.tax(l),
  toggle(l) {
    const p = toD(l.item.pack_qty);
    if (p <= 1) return;
    if (l.inPacks) { l.qty *= p; l.freeQty *= p; l.cost /= p; } else { l.qty /= p; l.freeQty /= p; l.cost *= p; }
    l.inPacks = !l.inPacks;
  },
  unitLabel: (l) => (l.inPacks && toD(l.item.pack_qty) > 1 ? `${l.item.purchase_unit || 'pack'} of ${qtyFmt(l.item.pack_qty)}` : l.item.unit),
};

const Purchase = {
  async saveSupplier(s) {

    if (s.id == null) {

    }
    await App.store.apply([{ op: 'update', t: 'suppliers', id: s.id, v }]);

  },
  ledger(id) { return App.store.select('supplier_ledger', { eq: { supplier_id: id }, order: [['id', 'desc']] }); },
  async paySupplier(id, amount, mode, note) {
    const ops = [
      { op: 'insert', t: 'supplier_ledger', v: { supplier_id: id, date: nowIso(), type: 'payment', amount, mode, note } },

  async savePO(supplierId, lines, note) {
    const ops = [seqOp('po', 'n'), {
      op: 'insert', t: 'purchase_orders', ref: 'po', v: {
        po_no: docNoValue('po', 'n'), supplier_id: supplierId, date: nowIso(), status: 'open',

      },
    }];

    ops.push(auditOp('po_create', ''));
